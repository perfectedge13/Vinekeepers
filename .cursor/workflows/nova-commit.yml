# Nova-commit workflow — full verification then commit/push
# Shared steps use @.cursor/skills/common/ (discovery, run_tests, reconcile, static_analysis). Commit-only steps in nova-commit/sub-skills/.
# Commit and push only if all phases pass.

name: nova-commit
description: Full-suite verification and commit. Discovery (all registries) → gates → tests → plausibility → docs → static analysis → commit/push → output.

# Execute these phase IDs in this order.
run_order:
  - discovery
  - schema_gate
  - drift_gate
  - run_tests
  - plausibility_review
  - docs_reconcile
  - static_analysis
  - commit_push
  - output

phases:
  - id: discovery
    type: step
    skill: nova-spec-discovery
    location: .cursor/skills/common/discovery.md
    scope: all
    description: Read index, load every registry spec (no scoping), summarize index, all registries, README.

  - id: schema_gate
    type: gate
    run: npm run validate-specs
    on_fail: stop
    description: Schema Gate — index and all registries valid against JSON Schema.

  - id: drift_gate
    type: gate
    run: npm run validate-drift
    on_fail: stop
    skip_when: schema_not_present
    description: Spec Drift Gate — index and registry integrity.

  - id: run_tests
    type: step
    skill: nova-run-tests
    location: .cursor/skills/common/run-tests.md
    description: Run ALL validation tests (project adapter); show full output and counts. If Fail or Blocked, stop; do not commit.

  - id: plausibility_review
    type: step
    skill: nova-plausibility-review
    location: .cursor/skills/nova-commit/sub-skills/plausibility-review.md
    description: For every requirement, report Implemented? true/false with justification. If any accepted requirement is false, treat as failure; do not commit.

  - id: docs_reconcile
    type: step
    skill: nova-reconcile
    location: .cursor/skills/common/reconcile.md
    description: Reconcile README and docs. See common/reconcile.md.

  - id: static_analysis
    type: step
    skill: nova-static-analysis
    location: .cursor/skills/common/static-analysis.md
    description: Run static analysis (project adapter). If build fails, stop.

  - id: commit_push
    type: step
    skill: nova-commit-push
    location: .cursor/skills/nova-commit/sub-skills/commit-push.md
    description: Only if all above passed — git add, commit with descriptive message, push. If VCS unavailable, return commands for user.

  - id: output
    type: step
    skill: nova-commit-output
    location: .cursor/skills/nova-commit/sub-skills/output.md
    description: Return gates, test results (with counts), plausibility table, static analysis, README updates, commit/push yes/no and message or reason.
