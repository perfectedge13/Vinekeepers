# Dev Bot layer alignment (nova-code = Dev Bot). For CLI/orchestrator.
# Step IDs grouped by layer for reporting and future automation.
layers:
  design: [discovery]
  pre_change: [schema_gate, drift_gate]
  implementation: [plan_change, branch_removal_rename, implement]
  documentation: [update_specs, update_readme, post_schema, traceability]
  validation: [run_tests, build_check]
  wrap_up: [reconcile, output]
