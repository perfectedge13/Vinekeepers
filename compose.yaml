# Vinekeepers — run with: docker compose up -d
# Build first: docker build -t vinekeepers .   (or use: docker compose build)
# Env: put DISCORD_BOT_TOKEN, CURSOR_API_KEY, etc. in .env (loaded into container).
# Port 8080: health endpoint for Prometheus blackbox (Grafana status dashboard green/red tile).

services:
  vinekeepers:
    image: vinekeepers
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      # Gadget / run_deploy_compose (direct executor): the image includes the Docker CLI,
      # but direct host compose still requires the host Docker socket plus every compose
      # workingDirectory from config/deploy-targets.yaml mounted at the same in-container path.
      # Example mounts: repo root as /app, plus /opt/stacks/neo4j and /opt/stacks/wikijs
      # for the sample targets. Without these mounts Gadget will fail fast with a prerequisite error.
      # See README.md → Docker → Gadget / run_deploy_compose on Docker.
      # - /var/run/docker.sock:/var/run/docker.sock
      # - .:/app
      # - /opt/stacks/neo4j:/opt/stacks/neo4j
      # - /opt/stacks/wikijs:/opt/stacks/wikijs
    restart: unless-stopped
