# Vinekeepers — run with: docker compose up -d
# Build first: docker build -t vinekeepers .   (or use: docker compose build)
# Env: put DISCORD_BOT_TOKEN, CURSOR_API_KEY, etc. in .env (loaded into container).
# Port 8080: health endpoint (/ and /health) for Prometheus uptime bridge on Docker network "monitoring".
#
# Gadget / run_deploy_compose: Docker socket + host stack dirs + DEPLOY_TARGETS_PATH are configured here
# so direct compose can run against neo4j/wikijs paths that match config/deploy-targets.docker.yaml.

services:
  vinekeepers:
    image: vinekeepers
    build: .
    env_file: .env
    environment:
      DEPLOY_TARGETS_PATH: /app/config/deploy-targets.docker.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VINEKEEPERS_HOST_REPO_ROOT:-.}:/workspace/vinekeepers:ro
      - /home/perfect_edge13/Docker/neo4j:/home/perfect_edge13/Docker/neo4j
      - /home/perfect_edge13/Docker/wikijs:/home/perfect_edge13/Docker/wikijs
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    external: true
