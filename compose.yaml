# Vinekeepers — run with: docker compose up -d
# Build first: docker build -t vinekeepers .   (or use: docker compose build)
# Env: put DISCORD_BOT_TOKEN, CURSOR_API_KEY, etc. in .env (loaded into container).
# Port 8080: health endpoint for Prometheus blackbox (Grafana status dashboard green/red tile).

services:
  vinekeepers:
    image: vinekeepers
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      # Gadget / run_deploy_compose (direct executor): use
      # `docker compose -f compose.yaml -f compose.host-ops.yaml up -d`
      # to add the Docker socket and sample host stack mounts without shadowing /app.
      # The override switches DEPLOY_TARGETS_PATH to config/deploy-targets.docker.yaml,
      # which points the Vinekeepers target at /workspace/vinekeepers and keeps the
      # sample neo4j / wikijs stacks at /opt/stacks/*.
      # See README.md → Docker → Gadget / run_deploy_compose on Docker.
    restart: unless-stopped
