scope:
  primary_assets:
    - src/main/java/com/vinekeepers/VinekeepersApp.java
    - src/main/java/com/vinekeepers/core/VinekeepersEngine.java
    - src/main/java/com/vinekeepers/core/Bootstrap.java
    - src/main/java/com/vinekeepers/env/EnvLoader.java
    - src/main/java/com/vinekeepers/config/ConfigLoader.java

change_triggers:
  paths:
    - src
    - config
    - ansible
    - specs
    - pom.xml
    - README.md
    - mkdoc
    - mkdocs.yml
    - AGENTS.md
    - .cursor/project.yml
    - .cursor/rules
    - .cursor/skills
    - .cursor/workflows

specs:
  - file: core-registry.yml
  - file: connectors-registry.yml
  - file: env-registry.yml
  - file: config-registry.yml
  - file: bot-registry.yml
  - file: events-registry.yml
  - file: state-registry.yml
  - file: tools-registry.yml
  - file: audit-registry.yml
  - file: reasoner-registry.yml
  - file: workflow-registry.yml

domains:
  - slug: core
    spec_file: core-registry.yml
  - slug: connectors
    spec_file: connectors-registry.yml
  - slug: env
    spec_file: env-registry.yml
  - slug: config
    spec_file: config-registry.yml
  - slug: bot
    spec_file: bot-registry.yml
  - slug: events
    spec_file: events-registry.yml
  - slug: state
    spec_file: state-registry.yml
  - slug: tools
    spec_file: tools-registry.yml
  - slug: audit
    spec_file: audit-registry.yml
  - slug: reasoner
    spec_file: reasoner-registry.yml
  - slug: workflow
    spec_file: workflow-registry.yml

interfaces:
  cli:
    - command: mvn test
      description: Run unit tests
    - command: mvn compile
      description: Build verification
    - command: npm run validate-specs
      description: Validate spec index and registries against schema
    - command: npm run validate-drift
      description: Validate index and registry paths, refs, and traceability
    - command: npm run validate-docs
      description: Validate generated mkdocs content

validation:
  commands:
    test: mvn test
    build_check: mvn compile
    static_analysis: mvn compile
  shell: powershell
  entrypoint: src/main/java/com/vinekeepers/VinekeepersApp.java
