  - id: REQ-LUNA-001
    title: Luna bot — Discord mention trigger, multi-turn gather, Cursor Cloud API
    statement: "Luna bot is registered with id luna; Discord activation uses a configured discordMention: luna rule and optional discordAuthors filter; workflowRef luna_cursor in bots.yaml; luna_cursor uses guided repo selection (choiceProvider githubRepos, GitHub API + last-repo memory), optional custom repo entry, codeChange prompt/capture, confirmation step (Launch/Edit repo/Edit request/Cancel), then cursor.fullRun; Vinekeepers stores in-memory run state and luna:lastRepo per author, polls Cursor, reports launch/progress/completion to Discord; config and routing stay in YAML."
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Bot id luna and routing filter discordMention luna; optional discordAuthors in routing restricts Luna to listed Discord users (e.g. novawilde13_72571)
        - Luna routing activates when Discord messages reference @Luna in text or mention metadata and satisfy discordAuthors when configured
        - bots.yaml specifies workflow type configured and workflowRef luna_cursor for luna
        - Workflow luna_cursor prompts and captures project and codeChange across multiple Discord messages before launching cursor.fullRun
        - cursor.fullRun action resolves repository input, launches the official Cursor Cloud Agent API, stores LunaCloudRunState, and immediately acknowledges launch to Discord
        - CursorCloudRunMonitor polls agent status and conversation feedback and relays updates such as running state, PR URL, and final summary to Discord
        - Engine sends workflow reply to Discord when source is Discord
        - "Confirmation branch clear: luna_cursor edit_request branch clears codeChange and confirmAction from state before reprompting; edit_repo branch clears project, codeChange, and confirmAction before reprompting (branch clear config in bots.yaml)"
      examples: []
    traceability:
      assets: [ASSET-LUNA-STATE, ASSET-LUNA-WORKFLOW, ASSET-CURSOR-ADAPTER, ASSET-CURSOR-ADAPTER-IMPL, ASSET-LUNA-RUN-STATE, ASSET-CURSOR-RUN-MONITOR, ASSET-CURSOR-AGENT-LAUNCH-REQUEST, ASSET-CURSOR-AGENT-CONVERSATION, ASSET-CURSOR-AGENT-DETAILS, ASSET-CURSOR-AGENT-LAUNCH-RESULT, ASSET-CURSOR-AGENT-MESSAGE, ASSET-CURSOR-CLOUD-TRANSPORT, ASSET-CURSOR-CLOUD-TRANSPORT-RESPONSE, ASSET-CURSOR-CLOUD-EXCEPTION, ASSET-CURSOR-FULL-RUN-TOOL, ASSET-ENGINE, ASSET-BOOTSTRAP, ASSET-BOTS-YAML, ASSET-CONFIGURABLE-WORKFLOW-RUNNER, ASSET-CONFIGURABLE-WORKFLOW-STATE, ASSET-STEP-RESULT, ASSET-BRANCH-STEP]
      symbols: []
    validation:
      tests:
        - id: UNIT-LUNA-STATE
          title: GatheringStateTest
          intent: Verify Luna conversation state (project, code change, step)
          testClass: com.vinekeepers.workflow.GatheringStateTest
          preconditions: []
        - id: UNIT-LUNA-MENTION-ROUTING
          title: ConfigLoaderTest
          intent: Verify Luna config uses discordMention routing that activates on @Luna-style messages
          testClass: com.vinekeepers.config.ConfigLoaderTest
          testMethod: buildRouterParsesDiscordMentionRouting
          preconditions: []
        - id: UNIT-LUNA-WORKFLOW
          title: CursorCloudGatheringWorkflowTest
          intent: Verify Luna multi-turn workflow and Cursor adapter invocation
          testClass: com.vinekeepers.workflow.CursorCloudGatheringWorkflowTest
          preconditions: []
        - id: UNIT-CURSOR-ADAPTER
          title: CursorCloudAdapterImplTest
          intent: Verify Cursor Cloud API adapter implementation
          testClass: com.vinekeepers.core.cursor.CursorCloudAdapterImplTest
          preconditions: []
        - id: UNIT-CURSOR-FULL-RUN-TOOL
          title: CursorFullRunToolTest
          intent: Verify cursor.fullRun launches a Cursor cloud run and stores run state
          testClass: com.vinekeepers.tools.CursorFullRunToolTest
          preconditions: []
        - id: UNIT-CURSOR-RUN-MONITOR
          title: CursorCloudRunMonitorTest
          intent: Verify CursorCloudRunMonitor reports Cursor status and feedback back to Discord
          testClass: com.vinekeepers.core.cursor.CursorCloudRunMonitorTest
          preconditions: []
    anti_patterns:
      - Hardcoding Discord channel in workflow
      - Storing secrets in state
      - Do not rely on discordTrigger alone for Luna activation because @mentions in Discord channels would be missed.

