schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-09T14:30:00Z"

project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"

enums:
  status: [draft, active, deprecated]
  priority: [low, medium, high]
  type: [functional, non-functional, constraint]
  handling_strategy: [fail, retry, skip]
  asset_kind: [source, config, spec, workflow]
  dependency_kind: [library, tool, service]
  dependency_scope: [build, test, runtime]
  dependency_criticality: [optional, required]

dependencies:
  items:
    - id: DEP-SLF4J
      kind: library
      name: slf4j-api
      scope: runtime
      criticality: required
      spec: org.slf4j:slf4j-api
      install_hint: Maven dependency
      used_by_requirements: [REQ-CORE-002, REQ-CORE-003]
    - id: DEP-LOGBACK
      kind: library
      name: logback-classic
      scope: runtime
      criticality: required
      spec: ch.qos.logback:logback-classic
      install_hint: Maven dependency
      used_by_requirements: [REQ-CORE-002]
    - id: DEP-SNAKEYAML
      kind: library
      name: snakeyaml
      scope: runtime
      criticality: required
      spec: org.yaml:snakeyaml
      install_hint: Maven dependency
      used_by_requirements: [REQ-CONFIG-001]
    - id: DEP-JACKSON-DATABIND
      kind: library
      name: jackson-databind
      scope: runtime
      criticality: required
      spec: com.fasterxml.jackson.core:jackson-databind
      install_hint: Maven dependency
      used_by_requirements: [REQ-LUNA-001]
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements: [REQ-CORE-001, REQ-ENV-001, REQ-CORE-002, REQ-CORE-003, REQ-CONFIG-001, REQ-BOT-001, REQ-BOT-002, REQ-EVENTS-001, REQ-STATE-001, REQ-TOOLS-001, REQ-REASONER-001, REQ-WORKFLOW-001, REQ-LUNA-001]

assets:
  - id: ASSET-SPEC-INDEX
    kind: spec
    path: specs/specs.yml
    role: Spec index and validation entrypoint
    requires: [REQ-CORE-001]
    feature_ids: [FEAT-CORE]
  - id: ASSET-REGISTRY
    kind: spec
    path: specs/core-registry.yml
    role: Core requirements registry
    requires: [REQ-CORE-001]
    feature_ids: [FEAT-CORE]
  - id: ASSET-APP
    kind: source
    path: src/main/java/com/vinekeepers/VinekeepersApp.java
    role: Application entrypoint; loads .env and bootstraps engine
    requires: [REQ-CORE-002, REQ-ENV-001]
    feature_ids: [FEAT-CORE, FEAT-ENV]
  - id: ASSET-BOOTSTRAP
    kind: source
    path: src/main/java/com/vinekeepers/core/Bootstrap.java
    role: Wire engine, config, connectors, shared tools, and configured workflow runners
    requires: [REQ-CORE-002, REQ-TOOLS-001, REQ-LUNA-001]
    feature_ids: [FEAT-CORE, FEAT-TOOLS, FEAT-CURSOR-GATHERING]
  - id: ASSET-ENV-LOADER
    kind: source
    path: src/main/java/com/vinekeepers/env/EnvLoader.java
    role: Load .env file into system properties
    requires: [REQ-ENV-001]
    feature_ids: [FEAT-ENV]
  - id: ASSET-ENV
    kind: source
    path: src/main/java/com/vinekeepers/env/Env.java
    role: Read config from system properties
    requires: [REQ-ENV-001]
    feature_ids: [FEAT-ENV]
  - id: ASSET-ENGINE
    kind: source
    path: src/main/java/com/vinekeepers/core/VinekeepersEngine.java
    role: Route events to bots (router plus for Discord message events add bots with waiting session WAITING_INPUT for event session key); run workflow and reasoner; apply tool/state side effects; deliver replies via connector sink registry (transitional source-prefix) and lifecycle operations (respondImmediately, sendFollowUp, updateMessage); build OutboundResponse from workflow/reasoner; resolve ReplyTarget from event; no defer in engine
    requires: [REQ-CORE-003, REQ-REASONER-001, REQ-LUNA-001]
    feature_ids: [FEAT-ENGINE, FEAT-REASONER, FEAT-CURSOR-GATHERING]
  - id: ASSET-OUTBOUND-RESPONSE
    kind: source
    path: src/main/java/com/vinekeepers/interactions/OutboundResponse.java
    role: Platform-neutral outbound reply (optional text, optional single ResponseIntent); at least one present
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-APP-REPLY-SINK
    kind: source
    path: src/main/java/com/vinekeepers/interactions/AppReplySink.java
    role: Connector contract with lifecycle operations (respondImmediately, sendFollowUp, updateMessage, openModal, getCapabilities); defer is adapter-internal only
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-REPLY-TARGET
    kind: source
    path: src/main/java/com/vinekeepers/interactions/ReplyTarget.java
    role: Sealed ReplyTarget (ChannelTarget, InteractionTarget) for where to send replies
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-CAPABILITIES
    kind: source
    path: src/main/java/com/vinekeepers/interactions/Capabilities.java
    role: Typed connector capabilities (supportedIntents, supportsInteractions, deferRequiredWithinMs, etc.)
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-RESPONSE-INTENT
    kind: source
    path: src/main/java/com/vinekeepers/interactions/ResponseIntent.java
    role: Platform-neutral response intents (PresentChoices, ConfirmAction, CollectText, CollectForm, ShowActions, ShowStatus)
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-CONFIG-LOADER
    kind: source
    path: src/main/java/com/vinekeepers/config/ConfigLoader.java
    role: Load bot definitions, routing, workflows, bot runtime options, and Discord mention filters from YAML
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-BOTS-YAML
    kind: config
    path: config/bots.yaml
    role: Bot definitions YAML (including Luna routing, Discord mention activation, and optional discordAuthors filter)
    requires: [REQ-CONFIG-001, REQ-LUNA-001]
    feature_ids: [FEAT-CONFIG, FEAT-CURSOR-GATHERING]
  - id: ASSET-BOT-CONFIG
    kind: source
    path: src/main/java/com/vinekeepers/config/BotConfig.java
    role: Bot configuration model
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-ROUTER
    kind: source
    path: src/main/java/com/vinekeepers/bot/Router.java
    role: Match events to bots by routing rules; Discord mention and trigger filters apply only to message events; interaction events use author/channel only
    requires: [REQ-BOT-001]
    feature_ids: [FEAT-ROUTING]
  - id: ASSET-ROUTING
    kind: source
    path: src/main/java/com/vinekeepers/bot/Routing.java
    role: Routing and filter configuration
    requires: [REQ-BOT-001]
    feature_ids: [FEAT-ROUTING]
  - id: ASSET-EVENT-FILTER
    kind: source
    path: src/main/java/com/vinekeepers/bot/EventFilter.java
    role: Filter events by criteria
    requires: [REQ-BOT-001]
    feature_ids: [FEAT-ROUTING]
  - id: ASSET-ROUTING-FILTER
    kind: source
    path: src/main/java/com/vinekeepers/bot/RoutingFilter.java
    role: Apply routing filters to events; for Discord, discordTrigger and discordMention apply only to message events; discordAuthors and discordChannels apply to all Discord events
    requires: [REQ-BOT-001]
    feature_ids: [FEAT-ROUTING]
  - id: ASSET-NORMALIZED-EVENT-CONTEXT
    kind: source
    path: src/main/java/com/vinekeepers/bot/NormalizedEventContext.java
    role: Normalize event payloads for routing and session decisions, including actorId and actorUsername (from payload author/authorId), mention extraction, and optional interaction payload (interactionId, token, customId, values)
    requires: [REQ-BOT-001]
    feature_ids: [FEAT-ROUTING]
  - id: ASSET-TOOL-POLICY
    kind: source
    path: src/main/java/com/vinekeepers/bot/ToolPolicy.java
    role: Allow/deny policy for bot tools
    requires: [REQ-BOT-002]
    feature_ids: [FEAT-BOT]
  - id: ASSET-BOT-DEFINITION
    kind: source
    path: src/main/java/com/vinekeepers/bot/BotDefinition.java
    role: Bot composition (persona, model, workflow, tools, and runtime conversation settings)
    requires: [REQ-BOT-003]
    feature_ids: [FEAT-BOT]
  - id: ASSET-CONVERSATION-MODE
    kind: source
    path: src/main/java/com/vinekeepers/bot/ConversationMode.java
    role: Runtime mode enum for single-event versus conversational bots
    requires: [REQ-BOT-003]
    feature_ids: [FEAT-BOT]
  - id: ASSET-PERSONA
    kind: source
    path: src/main/java/com/vinekeepers/bot/Persona.java
    role: Bot persona and tone
    requires: [REQ-BOT-003]
    feature_ids: [FEAT-BOT]
  - id: ASSET-MODEL-PROFILE
    kind: source
    path: src/main/java/com/vinekeepers/bot/ModelProfile.java
    role: LLM/model settings per bot
    requires: [REQ-BOT-003]
    feature_ids: [FEAT-BOT]
  - id: ASSET-MEMORY-POLICY
    kind: source
    path: src/main/java/com/vinekeepers/bot/MemoryPolicy.java
    role: Session and memory policy per bot
    requires: [REQ-BOT-003]
    feature_ids: [FEAT-BOT]
  - id: ASSET-EVENT-BUS
    kind: source
    path: src/main/java/com/vinekeepers/events/EventBus.java
    role: Publish and subscribe to events
    requires: [REQ-EVENTS-001]
    feature_ids: [FEAT-EVENTS]
  - id: ASSET-EVENT
    kind: source
    path: src/main/java/com/vinekeepers/events/Event.java
    role: Event payload and metadata
    requires: [REQ-EVENTS-001]
    feature_ids: [FEAT-EVENTS]
  - id: ASSET-EVENT-SOURCE
    kind: source
    path: src/main/java/com/vinekeepers/events/EventSource.java
    role: Event source interface
    requires: [REQ-EVENTS-001]
    feature_ids: [FEAT-EVENTS]
  - id: ASSET-EVENT-SUBSCRIBER
    kind: source
    path: src/main/java/com/vinekeepers/events/EventSubscriber.java
    role: Event subscriber interface
    requires: [REQ-EVENTS-001]
    feature_ids: [FEAT-EVENTS]
  - id: ASSET-STATE-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/StateStore.java
    role: Persist and load bot workflow state
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-TOOL
    kind: source
    path: src/main/java/com/vinekeepers/tools/Tool.java
    role: Tool interface
    requires: [REQ-TOOLS-001]
    feature_ids: [FEAT-TOOLS]
  - id: ASSET-TOOL-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/tools/ToolRegistry.java
    role: Register and resolve tools
    requires: [REQ-TOOLS-001]
    feature_ids: [FEAT-TOOLS]
  - id: ASSET-TOOL-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/tools/ToolRunner.java
    role: Execute approved tool calls for workflows and reasoners under ToolPolicy
    requires: [REQ-TOOLS-001]
    feature_ids: [FEAT-TOOLS]
  - id: ASSET-CURSOR-FULL-RUN-TOOL
    kind: source
    path: src/main/java/com/vinekeepers/tools/CursorFullRunTool.java
    role: Tool wrapper that launches a Cursor cloud run from gathered workflow state and stores launch metadata
    requires: [REQ-TOOLS-001, REQ-LUNA-001]
    feature_ids: [FEAT-TOOLS, FEAT-CURSOR-GATHERING]
  - id: ASSET-ECHO-TOOL
    kind: source
    path: src/main/java/com/vinekeepers/tools/EchoTool.java
    role: Simple echo tool used by configured workflow and tool runner tests
    requires: [REQ-TOOLS-001]
    feature_ids: [FEAT-TOOLS]
  - id: ASSET-STUB-TOOL
    kind: source
    path: src/main/java/com/vinekeepers/tools/StubTool.java
    role: Stub tool implementation
    requires: [REQ-TOOLS-001]
    feature_ids: [FEAT-TOOLS]
  - id: ASSET-AUDIT-LOG
    kind: source
    path: src/main/java/com/vinekeepers/audit/AuditLog.java
    role: Audit log interface
    requires: [REQ-AUDIT-001]
    feature_ids: [FEAT-AUDIT]
  - id: ASSET-AUDIT-RECORDER
    kind: source
    path: src/main/java/com/vinekeepers/audit/AuditRecorder.java
    role: Record tool calls and outcomes
    requires: [REQ-AUDIT-001]
    feature_ids: [FEAT-AUDIT]
  - id: ASSET-REASONER
    kind: source
    path: src/main/java/com/vinekeepers/reasoner/Reasoner.java
    role: Reasoner interface for bot decisions
    requires: [REQ-REASONER-001]
    feature_ids: [FEAT-REASONER]
  - id: ASSET-REASONER-INPUT
    kind: source
    path: src/main/java/com/vinekeepers/reasoner/ReasonerInput.java
    role: Reasoner input model including workflow context, current state, and last user message
    requires: [REQ-REASONER-001]
    feature_ids: [FEAT-REASONER]
  - id: ASSET-REASONER-OUTPUT
    kind: source
    path: src/main/java/com/vinekeepers/reasoner/ReasonerOutput.java
    role: Reasoner output model including reply text, optional OutboundResponse richReply, state patch, and proposed tool calls
    requires: [REQ-REASONER-001]
    feature_ids: [FEAT-REASONER]
  - id: ASSET-PROPOSED-TOOL-CALL
    kind: source
    path: src/main/java/com/vinekeepers/reasoner/ProposedToolCall.java
    role: Proposed tool call emitted by a reasoner for engine-side execution
    requires: [REQ-REASONER-001]
    feature_ids: [FEAT-REASONER]
  - id: ASSET-STUB-REASONER
    kind: source
    path: src/main/java/com/vinekeepers/reasoner/StubReasoner.java
    role: Stub reasoner implementation that returns an empty output
    requires: [REQ-REASONER-001]
    feature_ids: [FEAT-REASONER]
  - id: ASSET-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/Workflow.java
    role: Workflow state machine interface
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-WORKFLOW-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowResult.java
    role: Workflow result model
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-STUB-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflow.java
    role: Stub workflow implementation
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-STUB-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubState.java
    role: Stub workflow state
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-PACKAGE-MARKER
    kind: source
    path: src/main/java/com/vinekeepers/util/PackageMarker.java
    role: Package marker utility
    requires: [REQ-CORE-002]
    feature_ids: [FEAT-CORE]
  - id: ASSET-LUNA-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/GatheringState.java
    role: Luna per-conversation state (project, code change, step)
    requires: [REQ-STATE-001, REQ-WORKFLOW-001, REQ-LUNA-001]
    feature_ids: [FEAT-STATE, FEAT-CURSOR-GATHERING]
  - id: ASSET-LUNA-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/CursorCloudGatheringWorkflow.java
    role: Luna workflow class (legacy); Luna uses configured workflow luna_cursor in config; this class used by tests
    requires: [REQ-WORKFLOW-001, REQ-LUNA-001]
    feature_ids: [FEAT-CURSOR-GATHERING]
  - id: ASSET-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunner.java
    role: Interface to run workflow for an event and return a structured workflow result
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW, FEAT-ENGINE]
  - id: ASSET-WORKFLOW-RUN-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunResult.java
    role: Structured workflow result with reply, optional OutboundResponse richReply, waiting/completed flags, and error details
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-STUB-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflowRunner.java
    role: Stub workflow runner implementation
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-WORKFLOW-RUNNER-FACTORY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunnerFactory.java
    role: Create WorkflowRunner from workflow type, params, and bot runtime options from config
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-SESSION-KEY-STRATEGY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/SessionKeyStrategy.java
    role: Contract for resolving per-bot workflow session keys from events
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-SESSION-KEY-STRATEGIES
    kind: source
    path: src/main/java/com/vinekeepers/workflow/SessionKeyStrategies.java
    role: Built-in session key strategies for channel, channel_user, and thread conversations
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-STEP-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StepResult.java
    role: Result of a single workflow step execution with next-step, storage, outcome metadata, and optional OutboundResponse richReply
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-STEP-OUTCOME
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StepOutcome.java
    role: Outcome enum for continue, waiting, complete, and error workflow step states
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-WORKFLOW-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowStep.java
    role: Single step in a configurable workflow
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-WORKFLOW-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowAction.java
    role: Action interface invokable from workflow steps
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-WORKFLOW-ACTION-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowActionRegistry.java
    role: Register and resolve workflow actions by name
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-CONFIGURABLE-WORKFLOW-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/ConfigurableWorkflowState.java
    role: Mutable state for configurable workflow including waiting, completed, and error lifecycle data; clearKeys(keys) removes given keys from state (edit-reprompt)
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-WORKFLOW-DEFINITION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowDefinition.java
    role: Workflow definition from config (id and list of step configs)
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-CONFIGURABLE-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/ConfigurableWorkflowRunner.java
    role: "Run workflow from WorkflowDefinition with conversational pause/resume, session keys, tool-backed actions; parses intent, choices, confirmLabel, cancelLabel, fields for steps; applies StepResult clearKeys to state before setStepIndex"
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-ASK-FOR-INPUT-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/AskForInputStep.java
    role: Step that asks for user input and stores in state
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-PROMPT-FOR-FIELD-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/PromptForFieldStep.java
    role: Step that prompts once for a field and pauses until a later event; optional intent/choices/choiceProvider/confirmLabel/cancelLabel/fields; interpolates {{key}} from state
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-CAPTURE-FIELD-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/CaptureFieldFromEventStep.java
    role: Step that captures a field from the current event; for kind interaction normalizes payload.values (Map or List) and reads selected value or customId
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-CALL-ACTION-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/CallActionStep.java
    role: Step that invokes a registered WorkflowAction or ToolRunner-backed tool with bound arguments
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-BRANCH-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/BranchStep.java
    role: Step that branches by condition (state key truthy, or when key/value map for value-based branch); optional clear config (list of state keys) for edit-reprompt flows
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-DYNAMIC-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/DynamicChoiceProvider.java
    role: Interface for dynamic choice providers used by prompt_for_field when choiceProvider is set
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-DYNAMIC-CHOICE-PROVIDER-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/DynamicChoiceProviderRegistry.java
    role: Registry of named dynamic choice providers wired from Bootstrap into ConfigurableWorkflowRunner
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW]
  - id: ASSET-GITHUB-REPOS-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/providers/GitHubReposChoiceProvider.java
    role: Fetches user repos from GitHub API (sort=updated), prepends last repo, appends Custom repo; uses GITHUB_TOKEN
    requires: [REQ-WORKFLOW-001, REQ-LUNA-001]
    feature_ids: [FEAT-CURSOR-GATHERING]
  - id: ASSET-DONE-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/DoneStep.java
    role: Step that completes workflow with optional message
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW-STEPS]
  - id: ASSET-CURSOR-ADAPTER
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudAdapter.java
    role: Cursor Cloud Agents API adapter interface for launch, status, conversation, and follow-up operations
    requires: [REQ-LUNA-001]
    feature_ids: [FEAT-CURSOR-GATHERING]
  - id: ASSET-CURSOR-ADAPTER-IMPL
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudAdapterImpl.java
    role: Cursor Cloud Agents API HTTP client implementation (env-based config)
    requires: [REQ-LUNA-001]
    feature_ids: [FEAT-CURSOR-GATHERING]
  - id: ASSET-LUNA-RUN-STATE
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/LunaCloudRunState.java
    role: In-memory state for a launched Cursor cloud run, including Discord reply target and remote status
    requires: [REQ-LUNA-001]
    feature_ids: [FEAT-CURSOR-GATHERING]
  - id: ASSET-CURSOR-RUN-MONITOR
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudRunMonitor.java
    role: Poll Cursor cloud runs and relay status, feedback, and PR updates back to Discord
