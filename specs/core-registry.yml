    title: Specs bootstrap and traceability
    statement: The project maintains a spec index (specs.yml) and at least one requirements registry for traceability; schema and drift checks apply when schemas are present.
    status: active
    priority: medium
    type: non-functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - specs/specs.yml exists and validates against specs-index schema
        - At least one registry file exists and validates against req-registry schema
      examples: []
    traceability:
      assets: [ASSET-SPEC-INDEX, ASSET-REGISTRY]
      symbols: []
    validation:
      tests:
        - id: MANUAL-SPEC-VALIDATE
          title: Validate spec index and registry
          intent: Ensure specs/specs.yml and registry exist and pass schema validation when npm run validate-specs is available
          preconditions: []
          steps:
            - run: "Test-Path specs/specs.yml"
              expect: ["True"]
            - run: "Test-Path specs/core-registry.yml"
              expect: ["True"]

  - id: REQ-CORE-002
    title: Application bootstrap and entrypoint
    statement: VinekeepersApp is the entrypoint; it loads .env and bootstraps the engine, config, connectors, and shared tool execution components.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Main class runs Bootstrap and starts engine
        - Bootstrap wires engine, config loader, ConnectorRegistry; creates Discord adapter with DiscordConnectorConfig; calls adapter.registerBots(bots, context); engine/sink/cursor/action registration remain in Bootstrap
        - Bootstrap creates WorkflowRunner per bot via WorkflowRunnerFactory and registerRunner(botId, runner)
        - Bootstrap registers shared tools and passes ToolRunner into configured workflows
      examples: []
    traceability:
      assets: [ASSET-APP, ASSET-BOOTSTRAP, ASSET-PACKAGE-MARKER]
      symbols: []
    validation:
      tests:
        - id: UNIT-VINEKEEPERS-APP
          title: VinekeepersAppTest
          intent: Verify application entrypoint and bootstrap
          testClass: com.vinekeepers.VinekeepersAppTest
          preconditions: []
        - id: UNIT-BOOTSTRAP
          title: BootstrapTest
          intent: Verify Bootstrap wires engine, config, ConnectorRegistry, Discord adapter and registerBots
          testClass: com.vinekeepers.core.BootstrapTest
          preconditions: []

  - id: REQ-CORE-003
    title: Event-driven engine routes events to bots
    statement: VinekeepersEngine receives events, routes them to matching bots, runs the registered WorkflowRunner, then passes workflow context and session state to the reasoner before choosing a reply and recording audit events. For Discord message events, the engine additionally includes any registered bot that has a workflow runner and has persisted state with WAITING_INPUT for the event's session key, so conversational workflows can resume on later messages in the same session. Reply delivery uses ReplySender (e.g. OutboundDeliveryRouter implementing ReplySender) and the connector contract (AppReplySink) with lifecycle operations (respondImmediately, sendFollowUp, updateMessage, openModal, getCapabilities); for Discord, OutboundDeliveryRouter resolves the sender from ReplyTarget and optional lifecycle context (configuredBotId)—no silent fallback when the lifecycle channel's bot has no registered sender. Engine builds OutboundResponse from workflow or reasoner (rich or text-only), resolves ReplyTarget from event, and calls the sink registered for the event source (transitional source-prefix routing). Interaction events (kind interaction) are supported; platform timing and defer are connector-owned only.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Engine subscribes to event bus and dispatches to bots by routing rules
        - For Discord message events, engine adds bots that have a workflow runner and stateStore state with WAITING_INPUT for the event's session key (waiting-session routing) so workflows resume in the same conversation
        - Engine uses registered runners and runner.runResult(event, stateStore, botId) for workflow execution
        - Engine gives the reasoner workflow reply context, current session state, and the last normalized user message
        - Engine applies reasoner state patches and executes proposed tool calls through ToolRunner
        - Engine delivers replies via sink registry (source-prefix) and lifecycle methods (respondImmediately, sendFollowUp, updateMessage, openModal); sink exposes getCapabilities; no defer in engine
        - For Discord, OutboundDeliveryRouter resolves sender by target and lifecycle configuredBotId; for lifecycle channels, do not silently fall back when that bot's sender is unavailable
        - No bot registered for id logs warning and does not fail
      examples: []
    traceability:
      assets: [ASSET-ENGINE, ASSET-WORKFLOW-RUNNER, ASSET-TOOL-RUNNER, ASSET-REASONER-INPUT, ASSET-REASONER-OUTPUT, ASSET-OUTBOUND-RESPONSE, ASSET-APP-REPLY-SINK, ASSET-REPLY-TARGET, ASSET-CAPABILITIES, ASSET-RESPONSE-INTENT, ASSET-REPLY-SENDER]
      symbols: []
    validation:
      tests:
        - id: UNIT-ENGINE
          title: VinekeepersEngineTest
          intent: Verify engine receives events and routes to bots
          testClass: com.vinekeepers.core.VinekeepersEngineTest
          preconditions: []

