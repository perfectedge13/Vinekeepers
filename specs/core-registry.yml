  - id: REQ-BOT-001
    title: Route events to bots by routing rules
    statement: Router matches incoming events to bots using Routing and EventFilter/RoutingFilter over a normalized event view; events are dispatched only to bots whose filters accept the event, including Discord mention-based routing from either payload metadata or @mention text when configured, and optional Discord author filtering (discordAuthors) by actor id or normalized actor username. Discord trigger and mention filters apply only to message events; for Discord interaction events routing uses author and channel (and other non-trigger/mention criteria) only.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Router.match(event) returns list of matching BotDefinitions
        - Filters apply Discord/GitHub and other criteria from routing config
        - Event routing can normalize actor, channel, text, mentions, repo, and label fields from incoming payloads
        - Normalized event context exposes actorId and actorUsername (e.g. from payload author/authorId) for routing
        - discordTrigger and discordMention are enforced only for Discord message events; for Discord interaction events routing uses author, channel, and other criteria only (no trigger/mention check)
        - discordMention filters match case-insensitively against normalized mentions from payload metadata or message text (message events only)
        - discordAuthors filters match when event author (actorId or actorUsername normalized) is in the configured list
