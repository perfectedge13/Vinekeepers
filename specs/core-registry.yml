schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-18T12:00:00Z"

project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"

enums:
  status: [draft, active, deprecated]
  priority: [low, medium, high]
  type: [functional, non-functional, constraint]
  handling_strategy: [fail, retry, skip]
  asset_kind: [source, config, spec, workflow]
  dependency_kind: [library, tool, service]
  dependency_scope: [build, test, runtime]
  dependency_criticality: [optional, required]

dependencies:
  items:
    - id: DEP-SLF4J
      kind: library
      name: slf4j-api
      scope: runtime
      criticality: required
      spec: org.slf4j:slf4j-api
      install_hint: Maven dependency
      used_by_requirements: [REQ-CORE-002, REQ-CORE-003]
    - id: DEP-LOGBACK
      kind: library
      name: logback-classic
      scope: runtime
      criticality: required
      spec: ch.qos.logback:logback-classic
      install_hint: Maven dependency
      used_by_requirements: [REQ-CORE-002]
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements: [REQ-CORE-001, REQ-ENV-001, REQ-CORE-002, REQ-CORE-003, REQ-CONFIG-001, REQ-BOT-001, REQ-BOT-002, REQ-EVENTS-001, REQ-STATE-001, REQ-TOOLS-001, REQ-REASONER-001, REQ-WORKFLOW-001, REQ-LUNA-001]

assets:
  - id: ASSET-SPEC-INDEX
    kind: spec
    path: specs/specs.yml
    role: Spec index and validation entrypoint
    requires: [REQ-CORE-001]
    feature_ids: [FEAT-CORE]
  - id: ASSET-REGISTRY
    kind: spec
    path: specs/core-registry.yml
    role: Core requirements registry
    requires: [REQ-CORE-001]
    feature_ids: [FEAT-CORE]
  - id: ASSET-APP
    kind: source
    path: src/main/java/com/vinekeepers/VinekeepersApp.java
    role: Application entrypoint; loads .env and bootstraps engine
    requires: [REQ-CORE-002, REQ-ENV-001]
    feature_ids: [FEAT-CORE, FEAT-ENV]
  - id: ASSET-BOOTSTRAP
    kind: source
    path: src/main/java/com/vinekeepers/core/Bootstrap.java
    role: >-
      Wire engine, config, ConnectorRegistry; build DiscordConnectorConfig and DiscordConnectorAdapter; call
      adapter.registerBots(bots, ConnectorContext); build handlesMap from getConnectorIdentity("discord"); create
      FeatureRoomStateStore, FeaturePlanStateStore, RepoWorkspaceStateStore, RepoWorkspaceService and pass room store to
      Router and OutboundDeliveryRouter; register engine reply sender, sink, and ReplyTargetResolver by connector id;
      register workflow actions provision_room_participants, initialize_feature_room_state, initialize_feature_plan_state,
      hydrate_planning_session, synthesize_plan_drafts, ensure_repo_workspace, upsert_artifact_section_data,
      get_profile_missing_fields, structured discovery and plan critique/approval actions; action and sink registration
      stay in Bootstrap
    requires: [REQ-CORE-002, REQ-TOOLS-001, REQ-LUNA-001]
    feature_ids: [FEAT-CORE, FEAT-TOOLS, FEAT-CURSOR-GATHERING]
  - id: ASSET-ENGINE
    kind: source
    path: src/main/java/com/vinekeepers/core/VinekeepersEngine.java
    role: Route events to bots (router plus waiting-session for message events); run workflow and reasoner; apply tool/state side effects; deliver replies via sink registry then fallback to reply-sender registry, both keyed by event source prefix (connector id)—no connector literal in engine; ReplySender and AppReplySink registered by Bootstrap; lifecycle (respondImmediately, sendFollowUp, updateMessage); build OutboundResponse from workflow/reasoner; obtains ReplyTarget only via connector-owned ReplyTargetResolver by connector id—fail closed when no resolver or resolver returns empty; no defer in engine
    requires: [REQ-CORE-003, REQ-REASONER-001, REQ-LUNA-001]
    feature_ids: [FEAT-ENGINE, FEAT-REASONER, FEAT-CURSOR-GATHERING]
  - id: ASSET-OUTBOUND-RESPONSE
    kind: source
    path: src/main/java/com/vinekeepers/interactions/OutboundResponse.java
    role: Platform-neutral outbound reply (optional text, optional single ResponseIntent); at least one present
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-APP-REPLY-SINK
    kind: source
    path: src/main/java/com/vinekeepers/interactions/AppReplySink.java
    role: Connector contract with lifecycle operations (respondImmediately, sendFollowUp, updateMessage, openModal, getCapabilities); defer is adapter-internal only
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-REPLY-TARGET
    kind: source
    path: src/main/java/com/vinekeepers/interactions/ReplyTarget.java
    role: Sealed ReplyTarget (ChannelTarget, InteractionTarget) for where to send replies
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-CAPABILITIES
    kind: source
    path: src/main/java/com/vinekeepers/interactions/Capabilities.java
    role: Typed connector capabilities (supportedIntents, supportsInteractions, deferRequiredWithinMs, etc.)
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-RESPONSE-INTENT
    kind: source
    path: src/main/java/com/vinekeepers/interactions/ResponseIntent.java
    role: Platform-neutral response intents (PresentChoices, ConfirmAction, CollectText, CollectForm, ShowActions, ShowStatus)
    requires: [REQ-CORE-003]
    feature_ids: [FEAT-ENGINE]
  - id: ASSET-PACKAGE-MARKER
    kind: source
    path: src/main/java/com/vinekeepers/util/PackageMarker.java
    role: Package marker utility
    requires: [REQ-CORE-002]
    feature_ids: [FEAT-CORE]
  - id: ASSET-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunner.java
    role: Interface to run workflow for an event and return a structured workflow result
    requires: [REQ-WORKFLOW-001]
    feature_ids: [FEAT-WORKFLOW, FEAT-ENGINE]
  - id: ASSET-TOOL-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/tools/ToolRunner.java
    role: Execute approved tool calls for workflows and reasoners under ToolPolicy
    requires: [REQ-TOOLS-001]
    feature_ids: [FEAT-TOOLS]
  - id: ASSET-REASONER-INPUT
    kind: source
    path: src/main/java/com/vinekeepers/reasoner/ReasonerInput.java
    role: Reasoner input model including workflow context, current state, and last user message
    requires: [REQ-REASONER-001]
    feature_ids: [FEAT-REASONER]
  - id: ASSET-REASONER-OUTPUT
    kind: source
    path: src/main/java/com/vinekeepers/reasoner/ReasonerOutput.java
    role: Reasoner output model including reply text, optional OutboundResponse richReply, state patch, and proposed tool calls
    requires: [REQ-REASONER-001]
    feature_ids: [FEAT-REASONER]

requirements:
  - id: REQ-CORE-001
    title: Specs bootstrap and traceability
    statement: The project maintains a spec index (specs.yml) and at least one requirements registry for traceability; schema and drift checks apply when schemas are present.
    status: active
    priority: medium
    type: non-functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - specs/specs.yml exists and validates against specs-index schema
        - At least one registry file exists and validates against req-registry schema
      examples: []
    traceability:
      assets: [ASSET-SPEC-INDEX, ASSET-REGISTRY]
      symbols: []
    validation:
      tests:
        - id: MANUAL-SPEC-VALIDATE
          title: Validate spec index and registry
          intent: Ensure specs/specs.yml and registry exist and pass schema validation when npm run validate-specs is available
          preconditions: []
          steps:
            - run: "Test-Path specs/specs.yml"
              expect: ["True"]
            - run: "Test-Path specs/core-registry.yml"
              expect: ["True"]

  - id: REQ-CORE-002
    title: Application bootstrap and entrypoint
    statement: VinekeepersApp is the entrypoint; it loads .env and bootstraps the engine, config, connectors, and shared tool execution components.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Main class runs Bootstrap and starts engine
        - Bootstrap wires engine, config loader, ConnectorRegistry; creates Discord adapter with DiscordConnectorConfig; calls adapter.registerBots(bots, context); Bootstrap registers engine reply sender and sink by connector id (e.g. engine.setReplySender("discord", outboundDeliveryRouter), registerSink("discord", DiscordAppReplySink)); engine/sink/cursor/action registration remain in Bootstrap
        - Bootstrap creates WorkflowRunner per bot via WorkflowRunnerFactory and registerRunner(botId, runner)
        - Bootstrap registers shared tools and passes ToolRunner into configured workflows
      examples: []
    traceability:
      assets: [ASSET-APP, ASSET-BOOTSTRAP, ASSET-PACKAGE-MARKER]
      symbols: []
    validation:
      tests:
        - id: UNIT-VINEKEEPERS-APP
          title: VinekeepersAppTest
          intent: Verify application entrypoint and bootstrap
          testClass: com.vinekeepers.VinekeepersAppTest
          preconditions: []
        - id: UNIT-BOOTSTRAP
          title: BootstrapTest
          intent: Verify Bootstrap wires engine, config, ConnectorRegistry, Discord adapter and registerBots
          testClass: com.vinekeepers.core.BootstrapTest
          preconditions: []

  - id: REQ-CORE-003
    title: Event-driven engine routes events to bots
    statement: VinekeepersEngine receives events, routes them to matching bots, runs the registered WorkflowRunner, then passes workflow context and session state to the reasoner before choosing a reply and recording audit events. For message events, the engine additionally includes any registered bot that has a workflow runner and has persisted state with WAITING_INPUT for the event's session key. Reply delivery uses reply senders and sinks registered by connector id (source prefix); engine has no connector-specific literal (e.g. no "discord"). Delivery uses the sink for the event's source prefix when registered, else fallback to the reply sender for that source prefix. ReplySender (e.g. OutboundDeliveryRouter) and AppReplySink are registered by Bootstrap; lifecycle operations (respondImmediately, sendFollowUp, updateMessage, openModal, getCapabilities). Engine builds OutboundResponse from workflow or reasoner; ReplyTarget is obtained only via ReplyTargetResolver registered by connector id—when no resolver is registered for the source prefix or the resolver returns empty, the engine does not deliver the reply (fail closed). Interaction events (kind interaction) are supported; platform timing and defer are connector-owned only.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Engine subscribes to event bus and dispatches to bots by routing rules
        - For Discord message events, engine adds bots that have a workflow runner and stateStore state with WAITING_INPUT for the event's session key (waiting-session routing) so workflows resume in the same conversation
        - Engine uses registered runners and runner.runResult(event, stateStore, botId) for workflow execution
        - Engine gives the reasoner workflow reply context, current session state, and the last normalized user message
        - Engine applies reasoner state patches and executes proposed tool calls through ToolRunner
        - Engine registers reply senders and sinks by connector id (setReplySender(connectorId, sender), registerSink(sourcePrefix, sink)); delivery uses sink for event's source prefix when present, else fallback to reply sender for that source prefix; no connector literal (e.g. no "discord") in engine
        - Engine delivers replies via sink registry and lifecycle methods (respondImmediately, sendFollowUp, updateMessage, openModal); sink exposes getCapabilities; no defer in engine
        - Engine uses ReplyTargetResolver registered by connector id to obtain ReplyTarget; when no resolver is registered for the source prefix or resolver returns empty, engine does not deliver reply (fail closed)
        - For Discord message and interaction events, engine applies a short TTL dedupe on (sourceId, kind, messageId or interactionId) so duplicate bus publications do not run workflows twice
        - No bot registered for id logs warning and does not fail
      examples: []
    traceability:
      assets: [ASSET-ENGINE, ASSET-WORKFLOW-RUNNER, ASSET-TOOL-RUNNER, ASSET-REASONER-INPUT, ASSET-REASONER-OUTPUT, ASSET-OUTBOUND-RESPONSE, ASSET-APP-REPLY-SINK, ASSET-REPLY-TARGET, ASSET-CAPABILITIES, ASSET-RESPONSE-INTENT, ASSET-REPLY-SENDER, ASSET-REPLY-TARGET-RESOLVER, ASSET-DISCORD-REPLY-TARGET-RESOLVER]
      symbols: []
    validation:
      tests:
        - id: UNIT-ENGINE
          title: VinekeepersEngineTest
          intent: Verify engine receives events and routes to bots
          testClass: com.vinekeepers.core.VinekeepersEngineTest
          preconditions: []
        - id: UNIT-DISCORD-REPLY-TARGET-RESOLVER
          title: DiscordReplyTargetResolverTest
          intent: Verify DiscordReplyTargetResolver resolves Event to ChannelTarget or InteractionTarget from payload; supports engine ReplyTarget resolution by connector id
          testClass: com.vinekeepers.connectors.DiscordReplyTargetResolverTest
          preconditions: []
        - id: UNIT-ENGINE-DISCORD-DEDUPE
          title: VinekeepersEngineTest
          intent: Verify duplicate Discord message id within TTL does not run workflow twice
          testClass: com.vinekeepers.core.VinekeepersEngineTest
          testMethod: duplicateDiscordMessageId_withinDedupeWindow_runsWorkflowOnce
          preconditions: []

features:
  - id: FEAT-CORE
    slug: core
    title: Specs governance and bootstrap
    domain_slug: core
    doc_path: features/domain/core/core.md
    summary: Spec metadata anchors traceability, and VinekeepersApp plus Bootstrap wire the runtime before events begin flowing.
    requirement_ids: [REQ-CORE-001, REQ-CORE-002]
    asset_ids: [ASSET-SPEC-INDEX, ASSET-REGISTRY, ASSET-APP, ASSET-BOOTSTRAP, ASSET-PACKAGE-MARKER]
    status: active
  - id: FEAT-ENGINE
    slug: engine
    title: Event-driven engine orchestration
    domain_slug: core
    doc_path: features/domain/core/engine.md
    summary: VinekeepersEngine routes events to matched bots, executes workflow runners, applies reasoner output, and emits replies.
    requirement_ids: [REQ-CORE-003]
    asset_ids: [ASSET-ENGINE, ASSET-ROUTER, ASSET-WORKFLOW-RUNNER, ASSET-TOOL-RUNNER, ASSET-REASONER-INPUT, ASSET-REASONER-OUTPUT, ASSET-OUTBOUND-RESPONSE, ASSET-APP-REPLY-SINK, ASSET-REPLY-TARGET, ASSET-CAPABILITIES, ASSET-RESPONSE-INTENT, ASSET-REPLY-SENDER, ASSET-REPLY-TARGET-RESOLVER, ASSET-DISCORD-REPLY-TARGET-RESOLVER]
    status: active
