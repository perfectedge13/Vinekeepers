    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
requirements:
  - id: REQ-WORKFLOW-001
    title: Workflow state machine and config-driven runners
    statement: >-
      Workflow<S> handle(event, context, state) returns WorkflowResult<S>; WorkflowRunner runs a workflow for an event
      and returns WorkflowRunResult with reply, waiting, completion, and error state. WorkflowRunnerFactory creates
      runners from config workflow type and params (stub, configured), and configurable workflows can pause for later
      events using session key strategies.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Workflow interface and WorkflowResult model exist
        - WorkflowRunner interface and runner.runResult(event, stateStore, botId) used by engine
        - WorkflowRunnerFactory creates runner by type (stub, configured)
        - StubWorkflow/StubState and StubWorkflowRunner used when no custom workflow
        - Configurable workflows support prompt_for_field and capture_field steps for conversational pause/resume
        - Configurable workflow state records waiting field, pending prompt, completion, and error status
        - SessionKeyStrategies resolve channel, channel_user, or thread conversation keys for persisted workflow state
        - CallActionStep can invoke either a registered workflow action or a ToolRunner-backed tool
        - >-
          capture_field step supports optional trimAndLower (boolean); when true, captured text is trimmed and
          lowercased; for message events content is read from payload content or text (and optional contentKey)
        - StepResult may carry clearKeys; runner applies clearKeys to state before setStepIndex (edit-reprompt)
        - >-
          BranchStep branch config may include clear (list of state keys); returned StepResult carries clearKeys for
          runner to apply
        - >-
          Branch when key/value may use value "" to match empty string from capture_field (e.g. arrietty_room blank
          branch)
        - >-
          extract_event step populates state from event; fromEvent list with from (payload.key or context.field),
          storeIn, optional default, optional transforms; list-valued context stored as List
        - >-
          WorkflowTransforms provide trim, lower, upper, default (null/blank-safe); branch uses trim/lower/upper only;
          capture_field and extract_event may use transforms list
        - >-
          WorkflowConditionEvaluator evaluates branch conditions: operators equals, not_equals, blank, nonblank,
          contains, starts_with, regex (full-string), one_of; optional transform list applied to state value before compare
        - >-
          Step bind and state passed to actions; interpolation uses merged map (state then bind, bind overrides) for
          actions that render content
        - >-
          post_channel_message supports optional bind/state target (room | thread) and targetChannelId;
          targetChannelId takes precedence; target=room uses channelId; target=thread uses deliveryChannelId with
          THREAD_CREATE_FAILED fallback to channelId; else legacy firstNonBlank(deliveryChannelId, channelId)
        - create_thread action creates a Discord thread under parent channel via OutboundGateway; bind channelId,
          threadName, optional contextId; when channelId has a lifecycle context uses that context's bot gateway (owner
          gateway), else default gateway; blank or missing channelId returns THREAD_CREATE_FAILED; on success when
          contextId in bind/state updates LifecycleContextStore via setDeliveryTargetId(contextId, threadId); no store
          update on failure; storeIn (e.g. deliveryChannelId) stores thread id or sentinel THREAD_CREATE_FAILED in state
        - create_channel and create_thread use request types (CreateRoomRequest, CreateThreadRequest) and resolve
          SpaceOperations by WorkflowCapabilitySupport.sourcePrefix(event); null or blank prefix returns sentinel
          (CHANNEL_CREATE_FAILED / THREAD_CREATE_FAILED) — fail-closed, no Discord default
        - >-
          call_action step may set storeSpread true; when the invoked action returns a Map, ConfigurableWorkflowRunner
          merges entries into workflow state before advancing (StepResult.advanceSpread)
        - >-
          Bootstrap registers workflow actions initialize_feature_plan_state,           hydrate_planning_session, start_coordinator_planning,
          ensure_repo_workspace, prep_planning_repo_grounding, spread_plan_workspace_signals,
          derive_plan_governance, evaluate_planning_packet_depth, evaluate_planning_approval_gate, execute_planning_room_cycle,
          planning_run_silent_synthesis, planning_run_evaluation, assert_planning_route_phase, planning_route_invariant_failed,
          post_planning_progress_if_changed, merge_planning_clarification_choice, run_arrietty_planning_pass, run_planning_pass, run_architect_planning_pass, run_auditor_planning_pass, run_scribe_planning_pass,
          run_llm_planning_synthesis, run_request_expansion_llm, upsert_artifact_section_data,
          synthesize_plan_drafts, get_structured_discovery_gaps, build_discovery_agenda,
          build_insight_discovery_agenda,
          capture_and_apply_discovery_answer,
          classify_assumption_or_issue, recompute_plan_progress, coordinator_intake_bootstrap, run_plan_critique_and_readiness,
          build_planning_thread_review_body, post_planning_packet_thread, build_request_exploration, expand_planning_drafts, persist_plan_approval,
          append_plan_requirement,
          append_plan_assumption, append_plan_issue, append_plan_validation_note, set_plan_section_status,
          set_solution_outline on WorkflowActionRegistry
        - >-
          get_structured_discovery_gaps spreads discoveryHasOpenGaps false and discoveryScanError when contextId is missing;
          until planningAutonomousFirstPassCompleted is true, discoveryGapsJson omits non-workspace REQUIRED_FIELD gaps while
          still emitting repo workspace BLOCKER gaps when workspace resolution failed; after a successful execute_planning_room_cycle,
          spreads include full REQUIRED_FIELD gaps for empty required profile fields; repeatable-section required fields consolidate
          to one gap per missing field id across rows
        - >-
          build_discovery_agenda spreads discoveryAgendaError when discoveryGapsJson is missing; when state includes gap
          spread from get_structured_discovery_gaps, spreads discoveryCurrentQuestionPrompt and discoveryApplyKind (e.g.
          REQUIRED_FIELD)
        - >-
          capture_and_apply_discovery_answer returns OK_SKIP_APPLY when discoveryApplyKind is not REQUIRED_FIELD
          and the message is not a lightweight consent token; lightweight consent replies (ok, continue, proceed, etc.)
          run expand_planning_drafts and return OK; when kind
          is REQUIRED_FIELD with discoveryApplyArtifactId, discoveryApplySectionId, discoveryApplyFieldId, and
          discoveryApplyMode, applies discoveryAnswerRaw into plan artifacts (upsert semantics)
        - >-
          post_planning_packet_thread builds the planning packet from FeaturePlanState (PlanningThreadPacketFormatter includes
          canonical governance sections), splits for Discord size limits, posts orchestrator messages to the intake/spec thread,
          spreads planningPacketPosted / planningPacketChunkCount, and persists packetPostedAt / fingerprint / chunk count on
          FeaturePlanState when the send succeeds; gate is fail-closed and requires canonical next action READY_FOR_PACKET plus
          canonical packet-posting allowance and passing depth checks; skips duplicate sends when planningPacketLastPostedFingerprint matches the SHA-256 of the normalized full
          packet body unless bind forceRepost is true, spreading planningPacketSkippedDuplicate and a short
          planningPacketSkipReason for thread UX
        - >-
          build_request_exploration writes the request_exploration artifact (v2 profile) from request and repo hints before synthesis
        - >-
          expand_planning_drafts replaces placeholder-heavy artifact fields with request- and repo-grounded drafts
        - >-
          spread_plan_workspace_signals spreads repoWorkspaceReady, repoLocalPathPresent, repoWorkspaceStatusSummary, and
          planningRepoEvidenceJson from FeaturePlanState after ensure_repo_workspace; planningRepoEvidenceJson merges selected planningRag* keys from workflow state when prep_planning_repo_grounding has run
        - >-
          execute_planning_room_cycle (PlanningCyclePipeline) spreads planningAutonomousFirstPassCompleted true when the cycle
          completes without planningRoomCycleError
        - >-
          Arrietty-style coordinator clarification presents at most one concrete blocking question per round when a required fact
          cannot be inferred; ClarificationPromptQualityGate and canonical gap projection paths suppress generic, meta, completeness-only,
          and vague catch-all open-question prompts; clarification substance aligns with unresolved plan state after governance/artifact
          merges (not free-form LLM filler)
        - >-
          Planning cycle operator-visible summaries and failure lines (including planningCycleUserVisibleFailure and planningRoomCycleErrorUserMessage)
          are humanized via PlanningUserFacingCopy so raw internal error codes and pipeline mechanics are not primary Discord copy
        - >-
          When canonical resolution selects ASK_USER, PlanningCyclePipeline keeps planningClarificationQuestionText
          aligned to the ledger-backed canonical gap and may persist PlanningIntakeStage.CLARIFYING, but live templates prompt
          directly from planningClarificationQuestionText instead of relying on a late question-only copy rewrite
        - >-
          ExecutePlanningRoomCycleAction requires a non-null PlanningCyclePipeline at construction; Bootstrap wiring must supply
          the pipeline (no silent null fallback)
        - >-
          PlanReadinessEvaluator infers packet posted from FeaturePlanState.packetPostedAt when non-null; when a workflow state
          map is supplied, planningPacketPosted true (case-insensitive) or planningPacketPostedVersion parsed as integer > 0 also
          counts as posted; with a null workflow map, spread keys without persisted packetPostedAt do not imply posted
        - >-
          run_plan_critique_and_readiness prepends a MUST_FIX intake finding when PlanningIntakeStage is GATHERING_CONTEXT and
          PlanningIntakeStage remains GATHERING_CONTEXT; PlanCritiqueSupport still maps structured discovery gaps into critique findings
        - >-
          PlanReadinessCalculator (via PlanReadinessEvaluator in run_plan_critique_and_readiness) persists PlanConfidence with
          confidenceScore, confidenceReasons (including structured known-vs-unknown summary text), structuredKnownFactCount,
          materialUnknownCount, and capped materialUnknownLabels alongside machine readiness status
        - >-
          PlanningApprovalGateSupport.validateApproveAllowed rejects launch approval when persisted PlanConfidence.confidenceScore is
          set and below PlanReadinessCalculator.APPROVAL_CONFIDENCE_THRESHOLD (0.85), in addition to packet, critique lifecycle, and READY readiness checks
        - >-
          evaluate_planning_approval_gate treats coordinator discovery as satisfied when canonical PlanningIntakeStage has advanced beyond
          planningIntakeStage on FeaturePlanState is not GATHERING_CONTEXT, alongside posted packet, depth, READY readiness,
          no pending clarification, and PlanningApprovalGateSupport.validateApproveAllowed
        - >-
          derive_plan_governance merges gaps and artifacts into plan governance lists before evaluate_planning_packet_depth;
          evaluate_planning_packet_depth sets planningPacketDepthOk and planningPacketDepthReason from PlanningPacketDepthEvaluator
        - >-
          run_llm_planning_synthesis calls OpenAiChatClient when OPENAI_API_KEY is set; otherwise skips with planningLlmSkipReason;
          on transport, parse, or schema errors it spreads planningLlmError without blocking the workflow indefinitely; JSON parse uses
          PlanningLlmJsonSupport with one repair attempt via OpenAI when raw output is invalid; spreads planningSynthesisFailureCategory
          (e.g. SYNTHESIS_TRANSPORT_ERROR, SYNTHESIS_JSON_INVALID, SYNTHESIS_REPAIR_EXHAUSTED, SYNTHESIS_UPSERT_REJECTED,
          SYNTHESIS_EMPTY_NOOP) and planningSynthesisRepairExhausted when repair/apply still fails; PlanningCyclePipeline then sets
          planningRecoverableDraftAfterSynthesis for recoverable transport/parse paths so deterministic planning recovery can
          continue from the saved draft instead of inventing a second semantic branch;
          when planningRagAvailable is true in workflow state, includes planningRagRetrievalText in the synthesis prompt context
        - >-
          hydrate_planning_session spreads planningFailureCategory and planningFailurePhase from FeaturePlanState when set so Arrietty kickoff
          and intake templates can surface typed recovery metadata without reading raw plan rows in YAML
        - >-
          prep_planning_repo_grounding (PrepPlanningRepoGroundingAction + PlanningRepoGroundingService) runs after a materialized checkout path exists on FeaturePlanState;
          loads .vinekeepers/repo-grounding.parquet when present before embedding; indexes only missing chunk hashes into Qdrant with payload scoped by repo ref and branch;
          writes merged Parquet back; spreads planningRag* diagnostics and retrieval text; no-ops or degrades without failing the workflow when VINEKEEPERS_PLANNING_RAG is false or Qdrant/OpenAI/cache configuration is unusable
        - >-
          Planning OpenAI completions that supply OpenAiCallContext with a non-blank activitySummary notify
          OpenAiPlanningProgressSink before the HTTP request; Bootstrap wires OpenAiPlanningProgressPoster so enabled runs post
          "**Update:** …" to the workflow channel via post_channel_message unless OPENAI_PLANNING_DISCORD_PROGRESS is false
        - >-
          For those contextualized planning calls, OpenAiChatClient logs call duration at INFO and, when OPENAI_LOG_PLANNING_BODIES
          is not false, logs truncated system prompt, user message, and assistant reply (or a failure hint) with sk-* style
          redaction and per-field cap OPENAI_LOG_BODY_MAX_CHARS (clamped 256–32768, default 4096); when body logging is false,
          failures still emit concise outcome lines without full payloads
        - >-
          build_insight_discovery_agenda selects at most one BLOCKER/HIGH discovery gap, uses canonical userFacingDetail with
          ClarificationPromptQualityGate (no bundled Planning check-in prompts; discoveryBundledApplyJson stays empty on the intake path)
        - >-
          recompute_plan_progress spreads discoveryHasOpenGaps false and discoveryRecomputeError when contextId is missing;
          when plan has artifacts, persists projected section statuses and returns a refreshed gap spread map
        - >-
          Coordinator Discord prompts that gate plan readiness or REVIEWABLE checkpoints include plain-English explanation of what
          the operator is choosing (e.g. move to launch approval vs revise the plan first) rather than only internal status tokens,
          and the explanatory checkpoint copy stays distinct from the separate interactive present_choices prompt with a plain-text fallback
        - >-
          When the workflow asks for structured plan input (e.g. decision log rows), user-visible copy frames the message as a
          question, explains one-reply-per-row expectations in plain language, states that text is stored on the plan, and avoids
          unexplained jargon (ADR-only framing)
        - >-
          Critique summaries, readiness lines, and similar coordinator posts use PlanningUserFacingCopy (or equivalent) for
          severities and statuses instead of exposing raw MUST_FIX / REVIEWABLE tokens to Discord
        - >-
          derive_plan_governance merges OPEN discovery gaps into gap:* PlanIssue rows while preserving non-gap issues, splits
          artifact risk/decision text into canonical PlanRisk / PlanDecision rows with art-risk-* / art-dec-* ids, and merges
          open_questions lines into unresolvedQuestions with dedupe excluding the ready-to-implement sentinel
        - >-
          PlanningThreadPacketFormatter renders governance and multi-line bullets as labeled Discord lists where applicable,
          soft-truncates long sections with an explicit display-length footnote, and splits oversized bodies into labeled Discord chunks
        - >-
          build_role_planning_thread_messages remains available as a compatibility helper for legacy role-labeled packets,
          though production Arrietty planning now posts a single consolidated coordinator packet
        - >-
          build_planning_thread_review_body emits concise "packet already above" copy when planningPacketPosted,
          planningPacketSkippedDuplicate, or planningPacketPostedVersion > 0; otherwise caps the full formatted packet for the spread
