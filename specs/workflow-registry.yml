      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-AGENT-CONVERSATION
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorAgentConversation.java
