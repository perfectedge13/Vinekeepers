  - id: REQ-LUNA-001
    title: Luna bot ΓÇö Discord mention trigger, multi-turn gather, Cursor Cloud API, lifecycle room Phase 1
    statement: >-
      Luna bot is registered with id luna; Discord activation uses a configured discordMention: luna rule and optional
      discordAuthors filter; workflowRef luna_cursor in bots.yaml; luna_cursor uses guided repo selection
      (choiceProvider githubRepos, GitHub API + last-repo memory), optional custom repo entry, codeChange
      prompt/capture, confirmation step (Launch/Edit repo/Edit request/Cancel), then launch_cursor_run as the
      authoritative launch path (cursor.fullRun is not used in luna_cursor). CursorInstructionComposer is the single
      prompt source for Cursor run instructions including /nova-code. Vinekeepers stores in-memory run state and
      luna:lastRepo per author, polls Cursor, reports launch/progress/completion to Discord; config and routing stay in
      YAML. Phase 1 lifecycle room: LifecycleRunRecord (indexed by channelId and externalRunId); extended
      LifecycleContext (channelId, configuredBotId, runtimeBotInstanceId, optional repo/requestText) and
      LifecycleContextStore; RuntimeBotInstance for provisioned bots (e.g. Arrietty) stored under generic prefix
      bot_instance:; workflow actions create_channel (Discord createTextChannel, sentinel CHANNEL_CREATE_FAILED, room
      naming from state or fallback), post_channel_message, provision_bot_instance, create_lifecycle_context,
      launch_cursor_run.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - >-
          Bot id luna and routing filter discordMention luna; optional discordAuthors in routing restricts Luna to
          listed Discord users (numeric id or username, e.g. novawilde13_72571)
        - >-
          Luna routing activates when Discord messages reference @Luna in text or mention metadata and satisfy
          discordAuthors when configured
        - bots.yaml specifies workflow type configured and workflowRef luna_cursor for luna
        - >-
          Arrietty template bot (id arrietty) with workflowRef arrietty_room and handlesOwnedSpaces true for lifecycle
          room; arrietty_room workflow may include create_thread step with storeIn deliveryChannelId and optional branch
          on THREAD_CREATE_FAILED; create_thread uses lifecycle owner gateway when channel has context; after success
          setDeliveryTargetId updates store when contextId present; LifecycleContext.withDeliveryChannelId and
          LifecycleContextStore.setDeliveryTargetId (ignores null/blank/sentinel); done step may use main-room redirect
          message (e.g. "Launching now. See <#{{channelId}}>."); no hardcoded bot ids in Router or engine
        - >-
          Workflow luna_cursor prompts and captures project and codeChange across multiple Discord messages before
          launching via launch_cursor_run (cursor.fullRun not used in luna_cursor)
        - >-
          launch_cursor_run action resolves repository input, uses CursorInstructionComposer for prompt (single source
          including /nova-code), launches the official Cursor Cloud Agent API, stores LifecycleRunRecord, and
          immediately acknowledges launch to Discord
        - >-
          CursorCloudRunMonitor polls agent status and conversation feedback and relays updates such as running state,
          PR URL, and final summary to Discord; when LifecycleRunRecord has deliveryChannelId set, sends to that
          target (thread) with messageId null; treats THREAD_CREATE_FAILED sentinel as no delivery target (use
          channelId)
        - Engine sends workflow reply to Discord when source is Discord
        - >-
          Confirmation branch clear: luna_cursor edit_request branch clears codeChange and confirmAction from state
          before reprompting; edit_repo branch clears project, codeChange, and confirmAction before reprompting (branch
          clear config in bots.yaml)
        - >-
          Cursor adapter logs transport exceptions, non-2xx responses (status and safe error message), and startup
          config (baseUrl, key presence); never logs API key, request body, or full response body
        - >-
          Cursor adapter parses non-2xx responses robustly (extractErrorMessageAndCode for error string, nested
          error.message/code, top-level message, plain text, empty body); uses safe request diagnostics (debug URI, key
          masked, model, repo, branch); serializes request payload with NON_NULL; uses Bearer token in Authorization
          header
        - >-
          create_channel returns sentinel CHANNEL_CREATE_FAILED on gateway failure or null from createTextChannel; room
          naming uses normalizeChannelName (Discord-safe lowercase)
        - >-
          create_channel bind may include lifecycleOwnerBotId; after create, addPermissionOverride is called for that
          bot's Discord user id (resolved via OutboundDeliveryRouter getSelfUserIdForBot) when OutboundGateway supports it
        - >-
          post_channel_message send target from optional target (room | thread) or targetChannelId (bind then state):
          targetChannelId takes precedence; target=room uses channelId; target=thread uses deliveryChannelId with
          THREAD_CREATE_FAILED fallback to channelId; else legacy firstNonBlank(deliveryChannelId, channelId);
          interpolates content from merged map (state then bind, bind overrides); lifecycleBotName from bind for content
        - >-
          create_lifecycle_context uses bind precedence (bind overrides state for configuredBotId, repo, requestText,
          runtimeBotInstanceId, deliveryChannelId); excludes THREAD_CREATE_FAILED from context deliveryChannelId
        - >-
          launch_cursor_run acknowledgement to Discord includes optional status (e.g. launching) and directs user to
          lifecycle room; passes optional deliveryChannelId from bind/state into LifecycleRunRecord
        - >-
          luna_cursor after get_profile_missing_fields may run Phase B guided discovery: get_structured_discovery_gaps
          (storeSpread), branch on discoveryHasOpenGaps, build_discovery_agenda (storeSpread), prompt_for_field /
          capture_field for discoveryAnswerRaw, capture_and_apply_discovery_answer, classify_assumption_or_issue,
          recompute_plan_progress (storeSpread), then branch (exit loop on discoveryBlockingIssueMode or no open gaps,
          else clear discoveryAnswerRaw and rebuild agenda); when no gaps, flow continues to intake/spec role posts and
          launch_cursor_run; confirm cancel branches to cancelled done step; channel create failure branches to
          could-not-create-room done step
      examples: []
