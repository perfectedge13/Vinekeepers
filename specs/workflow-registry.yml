schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-19T12:00:00Z"
project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: '21'
enums:
  status:
    - draft
    - active
    - deprecated
  priority:
    - low
    - medium
    - high
  type:
    - functional
    - non-functional
    - constraint
  handling_strategy:
    - fail
    - retry
    - skip
  asset_kind:
    - source
    - config
    - spec
    - workflow
  dependency_kind:
    - library
    - tool
    - service
  dependency_scope:
    - build
    - test
    - runtime
  dependency_criticality:
    - optional
    - required
dependencies:
  items:
    - id: DEP-JACKSON-DATABIND
      kind: library
      name: jackson-databind
      scope: runtime
      criticality: required
      spec: com.fasterxml.jackson.core:jackson-databind
      install_hint: Maven dependency
      used_by_requirements:
        - REQ-LUNA-001
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements:
        - REQ-CORE-001
        - REQ-ENV-001
        - REQ-CORE-002
        - REQ-CORE-003
        - REQ-CONFIG-001
        - REQ-BOT-001
        - REQ-BOT-002
        - REQ-EVENTS-001
        - REQ-STATE-001
        - REQ-TOOLS-001
        - REQ-REASONER-001
        - REQ-WORKFLOW-001
        - REQ-LUNA-001
assets:
  - id: ASSET-BOOTSTRAP
    kind: source
    path: src/main/java/com/vinekeepers/core/Bootstrap.java
    role: >-
      Wire engine, config, connectors, shared tools, and configured workflow runners; pass LifecycleContextStore and
      handlesOwnedSpaces map from loaded bots to Router; construct FeaturePlanStateStore, RepoWorkspaceStateStore,
      RepoWorkspaceService; load WorkProfileRegistry from config/work-profiles.yaml; register initialize_feature_plan_state,
      ensure_repo_workspace, upsert_artifact_section_data, get_profile_missing_fields, append/set plan actions
    requires:
      - REQ-CORE-002
      - REQ-TOOLS-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CORE
      - FEAT-TOOLS
      - FEAT-CURSOR-GATHERING
  - id: ASSET-ENGINE
    kind: source
    path: src/main/java/com/vinekeepers/core/VinekeepersEngine.java
    role: >-
      Route events to bots (router plus for Discord message events add bots with waiting session WAITING_INPUT for event
      session key); run workflow and reasoner; apply tool/state side effects; deliver replies via connector sink
      registry (transitional source-prefix) and lifecycle operations (respondImmediately, sendFollowUp, updateMessage);
      for Discord, OutboundDeliveryRouter resolves sender by target and lifecycle configuredBotId with no silent
      fallback; build OutboundResponse from workflow/reasoner; obtain ReplyTarget via ReplyTargetResolver by connector id; fail closed when no resolver or resolver returns empty; no defer in engine
    requires:
      - REQ-CORE-003
      - REQ-REASONER-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-ENGINE
      - FEAT-REASONER
      - FEAT-CURSOR-GATHERING
  - id: ASSET-BOTS-YAML
    kind: config
    path: config/bots.yaml
    role: >-
      Bot definitions YAML (Luna routing, Discord mention activation, optional discordAuthors, optional
      discordTokenEnvKey and handlesOwnedSpaces per bot, lifecycleBotName in step bind; Arrietty template with
      workflowRef arrietty_room, handlesOwnedSpaces, capture_field trimAndLower for room name UX, branch value "" for
      blank/empty)
    requires:
      - REQ-CONFIG-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CONFIG
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-FULL-RUN-TOOL
    kind: source
    path: src/main/java/com/vinekeepers/tools/CursorFullRunTool.java
    role: Tool wrapper that launches a Cursor cloud run from gathered workflow state and stores launch metadata
    requires:
      - REQ-TOOLS-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-TOOLS
      - FEAT-CURSOR-GATHERING
  - id: ASSET-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/Workflow.java
    role: Workflow state machine interface
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowResult.java
    role: Workflow result model
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflow.java
    role: Stub workflow implementation
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubState.java
    role: Stub workflow state
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-LUNA-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/GatheringState.java
    role: Luna per-conversation state (project, code change, step)
    requires:
      - REQ-STATE-001
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-STATE
      - FEAT-CURSOR-GATHERING
  - id: ASSET-LUNA-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/CursorCloudGatheringWorkflow.java
    role: Luna workflow class (legacy); Luna uses configured workflow luna_cursor in config; this class used by tests
    requires:
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunner.java
    role: Interface to run workflow for an event and return a structured workflow result
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
      - FEAT-ENGINE
  - id: ASSET-WORKFLOW-RUN-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunResult.java
    role: >-
      Structured workflow result with reply, optional OutboundResponse richReply, waiting/completed flags, and error
      details
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflowRunner.java
    role: Stub workflow runner implementation
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RUNNER-FACTORY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunnerFactory.java
    role: Create WorkflowRunner from workflow type, params, and bot runtime options from config
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-SESSION-KEY-STRATEGY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/SessionKeyStrategy.java
    role: Contract for resolving per-bot workflow session keys from events
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-SESSION-KEY-STRATEGIES
    kind: source
    path: src/main/java/com/vinekeepers/workflow/SessionKeyStrategies.java
    role: Built-in session key strategies for channel, channel_user, and thread conversations
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STEP-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StepResult.java
    role: >-
      Result of a single workflow step execution with next-step, storage, outcome metadata, and optional
      OutboundResponse richReply
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-STEP-OUTCOME
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StepOutcome.java
    role: Outcome enum for continue, waiting, complete, and error workflow step states
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowStep.java
    role: Single step in a configurable workflow
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowAction.java
    role: Action interface invokable from workflow steps
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-ACTION-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowActionRegistry.java
    role: Register and resolve workflow actions by name
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-CAPABILITY-SUPPORT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowCapabilitySupport.java
    role: >-
      Utility to resolve source prefix from event for capability lookups (e.g. SpaceOperationsRegistry); null/blank
      prefix yields fail-closed behavior in actions (no Discord default)
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CONFIGURABLE-WORKFLOW-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/ConfigurableWorkflowState.java
    role: >-
      Mutable state for configurable workflow including waiting, completed, and error lifecycle data; clearKeys(keys)
      removes given keys from state (edit-reprompt)
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-DEFINITION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowDefinition.java
    role: Workflow definition from config (id and list of step configs)
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CONFIGURABLE-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/ConfigurableWorkflowRunner.java
    role: >-
      Run workflow from WorkflowDefinition with conversational pause/resume, session keys, tool-backed actions; parses
      intent, choices, confirmLabel, cancelLabel, fields, trimAndLower, transforms, and fromEvent for steps; registers
      extract_event step; applies StepResult clearKeys to state before setStepIndex
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-ASK-FOR-INPUT-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/AskForInputStep.java
    role: Step that asks for user input and stores in state
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PROMPT-FOR-FIELD-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/PromptForFieldStep.java
    role: >-
      Step that prompts once for a field and pauses until a later event; optional
      intent/choices/choiceProvider/confirmLabel/cancelLabel/fields; interpolates {{key}} from state
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CAPTURE-FIELD-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/CaptureFieldFromEventStep.java
    role: >-
      Step that captures a field from the current event; for kind interaction normalizes payload.values (Map or List)
      and reads selected value or customId; for message events reads from contentKey or payload content/text; optional
      transforms list (trim, lower, upper, default); when both trimAndLower and transforms present, trimAndLower wins
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CALL-ACTION-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/CallActionStep.java
    role: Step that invokes a registered WorkflowAction or ToolRunner-backed tool with bound arguments
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-BRANCH-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/BranchStep.java
    role: >-
      Step that branches by condition; when key/value (optional operator, transform on state value); operators equals,
      not_equals, blank, nonblank, contains, starts_with, regex (full-string), one_of; optional clear for edit-reprompt
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-DYNAMIC-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/DynamicChoiceProvider.java
    role: Interface for dynamic choice providers used by prompt_for_field when choiceProvider is set
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-DYNAMIC-CHOICE-PROVIDER-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/DynamicChoiceProviderRegistry.java
    role: Registry of named dynamic choice providers wired from Bootstrap into ConfigurableWorkflowRunner
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-GITHUB-REPOS-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/providers/GitHubReposChoiceProvider.java
    role: Fetches user repos from GitHub API (sort=updated), prepends last repo, appends Custom repo; uses GITHUB_TOKEN
    requires:
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-DONE-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/DoneStep.java
    role: Step that completes workflow with optional message
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-TRANSFORMS
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowTransforms.java
    role: Shared string transforms for workflow steps; trim, lower, upper, default; null/blank-safe; branch uses trim/lower/upper only
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-CONDITION-EVALUATOR
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowConditionEvaluator.java
    role: Evaluates branch condition (stateValue, operator, compareValue, transformList); operators equals, not_equals, blank, nonblank, contains, starts_with, regex full-string, one_of
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-EXTRACT-EVENT-FIELDS-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/ExtractEventFieldsStep.java
    role: Step that extracts event fields into state; fromEvent list with from (payload.key or context.field), storeIn, default, transforms; list-valued context as List
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CURSOR-ADAPTER
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudAdapter.java
    role: Cursor Cloud Agents API adapter interface for launch, status, conversation, and follow-up operations
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-ADAPTER-IMPL
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudAdapterImpl.java
    role: >-
      Cursor Cloud Agents API HTTP client implementation (env-based config); robust non-2xx error parsing
      (extractErrorMessageAndCode for error string, nested error.message/code, top-level message, plain text, empty);
      safe request diagnostics (debug URI, key masked, model, repo, branch); NON_NULL payload serialization; Bearer
      auth; logs transport exceptions and config without leaking key or body
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-LUNA-RUN-STATE
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/LifecycleRunRecord.java
    role: >-
      Generic run record for a lifecycle Cursor cloud run; indexed by channelId and externalRunId; optional
      deliveryChannelId for thread delivery; Discord reply target and remote status
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-RUN-MONITOR
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudRunMonitor.java
    role: >-
      Poll Cursor cloud runs and relay status, feedback, and PR updates back to Discord; when run record has
      deliveryChannelId set, send to that target (thread); use messageId null when sending to thread
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-AGENT-LAUNCH-REQUEST
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorAgentLaunchRequest.java
    role: Request payload model for launching a Cursor Cloud agent run
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-AGENT-CONVERSATION
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorAgentConversation.java
    role: Conversation response model for Cursor Cloud agent feedback
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-AGENT-DETAILS
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorAgentDetails.java
    role: Details model for Cursor Cloud agent status lookups
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-AGENT-LAUNCH-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorAgentLaunchResult.java
    role: Launch result model returned after starting a Cursor Cloud agent run
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-AGENT-MESSAGE
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorAgentMessage.java
    role: Message model representing Cursor Cloud agent conversation entries
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-CLOUD-TRANSPORT
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudTransport.java
    role: HTTP transport abstraction for Cursor Cloud adapter calls
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-CLOUD-TRANSPORT-RESPONSE
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudTransportResponse.java
    role: Transport response model used by Cursor Cloud adapter calls
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-CLOUD-EXCEPTION
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudException.java
    role: Exception type for Cursor Cloud transport and adapter failures
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-INSTRUCTION-COMPOSER
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorInstructionComposer.java
    role: >-
      Single prompt source for Cursor run instructions (repo, baseBranch, change) including /nova-code; used by
      LaunchCursorRunAction and CursorFullRunTool
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-LIFECYCLE-CONTEXT
    kind: source
    path: src/main/java/com/vinekeepers/state/LifecycleContext.java
    role: >-
      Extended lifecycle run context (channelId, guildId, run record id, configuredBotId, runtimeBotInstanceId,
      optional repo/requestText, optional deliveryChannelId) for Phase 1 lifecycle room; withDeliveryChannelId(id)
      returns new instance with that deliveryChannelId for store updates after create_thread
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-LIFECYCLE-CONTEXT-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/LifecycleContextStore.java
    role: >-
      Store and resolve lifecycle contexts by key for lifecycle room runs; setDeliveryTargetId(contextId,
      deliveryTargetId) updates context delivery target (ignores null, blank, THREAD_CREATE_FAILED); used by
      create_thread after success
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-RUNTIME-BOT-INSTANCE
    kind: source
    path: src/main/java/com/vinekeepers/bot/RuntimeBotInstance.java
    role: >-
      Runtime instance of a bot provisioned from a template (e.g. Arrietty); instanceId, templateBotId, displayName,
      channelId
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CREATE-CHANNEL-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/CreateChannelAction.java
    role: >-
      Workflow action that builds CreateRoomRequest from event/state/bind, resolves SpaceOperations by
      WorkflowCapabilitySupport.sourcePrefix(event); null/blank prefix or unregistered prefix returns
      CHANNEL_CREATE_FAILED (fail-closed, no Discord default)
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-POST-CHANNEL-MESSAGE-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/PostChannelMessageAction.java
    role: >-
      Workflow action to post a message to a Discord channel via ReplySender; send target from optional target (room |
      thread) or targetChannelId (bind then state): targetChannelId takes precedence; target=room uses channelId;
      target=thread uses deliveryChannelId with THREAD_CREATE_FAILED fallback to channelId; else legacy
      firstNonBlank(deliveryChannelId, channelId); interpolation from merged map (state then bind); lifecycleBotName
      from bind for content; optional asBotId or asRole (ORCHESTRATOR, ARCHITECT, AUDITOR, SCRIBE) with precedence
      asBotId over asRole over default send; explicit send uses OutboundDeliveryRouter.sendAsExplicit and
      sendAsRoleExplicit (strict errors, no fallback)
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PROVISION-ROOM-PARTICIPANTS-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/ProvisionRoomParticipantsAction.java
    role: >-
      Workflow action to provision four feature-room participants (ORCHESTRATOR, ARCHITECT, AUDITOR, SCRIBE) into
      StateStore; ORCHESTRATOR reuses valid instanceId from state or the sole existing Arrietty runtime for the channel;
      returns list of participant maps for downstream initialize_feature_room_state
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-INITIALIZE-FEATURE-ROOM-STATE-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/InitializeFeatureRoomStateAction.java
    role: >-
      Workflow action to build FeatureRoomState from bind/state (featureRoomParticipants transient list of maps, contextId, channelId)
      and put it in FeatureRoomStateStore; validates role contract (exactly one of each PlanningRole, no duplicates,
      non-blank configuredBotId/runtimeBotInstanceId, exactly one primaryCoordinator on ORCHESTRATOR);
      when featureId or featureSlug missing from bind/state, generates featureId (feat- + 12 hex) and featureSlug
      (derived from initialRequest/repo or fallback feature)
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
