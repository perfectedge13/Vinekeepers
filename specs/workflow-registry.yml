    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-CLOUD-TRANSPORT
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudTransport.java
    role: HTTP transport abstraction for Cursor Cloud adapter calls
    requires:
