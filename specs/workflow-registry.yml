    kind: source
    path: src/main/java/com/vinekeepers/providers/GitHubReposChoiceProvider.java
    role: Fetches user repos from GitHub API (sort=updated), prepends last repo, appends Custom repo; uses GITHUB_TOKEN
    requires:
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-DONE-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/DoneStep.java
    role: Step that completes workflow with optional message
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
