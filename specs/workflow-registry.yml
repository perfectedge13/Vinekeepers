  - id: REQ-WORKFLOW-002
    title: Config-driven workflow v2 graph, ledger, rules, and safe templates
    statement: >-
      Workflows may declare workflowSchema v2 with phases, capabilities (legacy_action bridge, linear_workflow_ref delegate
      for workflows that intentionally nest a sibling linear workflow, and configurable_steps inline linear-style steps), and rulesets.
      Production coordinator workflow arrietty_room_v2 owns the full lifecycle in the v2 phase graph using legacy_action and embedded
      configurable_steps only and does not use linear_workflow_ref. WorkflowRunnerFactory yields GraphWorkflowRunner when phases are present. Generic UnresolvedItemLedger and
      ProgressDedupeHelper support clarification and progress dedupe without planning-only engine APIs. WorkflowRulesEngine
      evaluates ordered rules with ANDed predicates. PromptForFieldStep honors control.mode plain_text. WorkflowSafeTemplateRenderer
      allowlists template keys.       Planning cycle logic lives in       PlanningCyclePipeline; silent synthesis runs before one
      PlanningEvaluationService call, which is the single post-draft routing authority: usable question (best_question,
      draft_question_candidate, then top_unresolved_gap recovery) becomes ASK_USER; otherwise a coherent draft becomes
      READY_FOR_PACKET; otherwise BLOCKED stays reserved for machine / malformed-evaluation / incoherent-plan failure.
      PlanningDecisionNormalizer reduces that result to the exclusive live routing contract
      (planningNextAction, planningNextPhase, planningLastConfidence, planningNextQuestion, planningBlockingReason, planningRepoEvidenceStatus),
      while PlanningMaterialCyclePacing and PlanningCanonicalDecisionSupport persist continuity state without becoming a second
      routing authority. Coordinator clarification follows a strict contract (one concrete blocking question when a required
      fact is missing; no generic meta/completeness prompts; open-question substance grounded in unresolved plan state).
      PlanningRolePassRunner delegates to StructuredLlmArtifactUpsertPass.
      v2 rs_evaluation_branch routes on planningNextPhase
      only (planning_clarification, planning_packet, planning_blocked; no legacy boolean-first routing); unmatched phase falls
      through to planning_routing_invariant (internal error, not user blocked-thread copy); post-packet critique does not fail-close
      into BLOCK solely for NOT_READY plus material churn—findings annotate governance and the graph advances via defaultNextPhase;
      review / preapproval phases are illegal until planningPacketPosted is true, and non-launched intake threads reopen on later
      messages instead of returning the terminal idle copy; CONTINUE_SYNTHESIS is not a live YAML branch;
      packet depth defers generic open-question filler blocking to clarification state when canonical user input is not required
      and the unresolved ledger has no OPEN blocking row.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - WorkflowDefinition carries optional workflowSchema; v2 resolves when YAML has phases without steps list
        - GraphWorkflowRunner runs legacy_action and linear_workflow_ref capability pipeline and phase transitions via defaultNextPhase or rulesets
        - >-
          GraphWorkflowRunner and ConfigurableWorkflowRunner log full throwables with phase/step, capability, and action context;
          when an exception has a blank message, workflow error text falls back to the exception class name so audits and replies are not empty
        - WorkflowV2Loader parses phases, capabilities, rulesets, llm, and optional deliberation map from workflow map
        - UnresolvedItemLedger serializes to workflowUnresolvedItemsJson; WorkflowRulesEngine hasOpenUnresolved predicate works
        - ProgressDedupeHelper provides normalize + fingerprint + isPostWorthy for generic progress dedupe
        - post_planning_progress_if_changed supports optional bind keys progressPostWorthyKey, progressPostFingerprintKey, lastProgressPostHashKey
        - Bootstrap registers v2_noop for tests and graph capability demos
        - PlanningCyclePipeline executes planning cycle; ExecutePlanningRoomCycleAction is a thin facade; planning_run_silent_synthesis
          and planning_run_evaluation split the same pipeline for v2 YAML
        - >-
          StructuredLlmArtifactUpsertPass executes generic artifact upsert LLM pass for role-derived prompts and supplies
          OpenAiCallContext so each role pass participates in the same OpenAiChatClient Discord progress and safe server logging policy
          as other planning LLM calls
        - >-
          Work profiles may declare readiness.anyOfGroups and field-level minWords/readinessChecks; GenericReadinessEvaluator
          applies declarative depth before supplemental packet checks
        - >-
          Open questions are gathered through coordinator clarification one question at a time; prompts are concrete and blocking
          when user input is required, with generic/meta/completeness lines filtered; unresolved open-question lists in packets derive
          from FeaturePlanState (governance merge + artifacts), not ad-hoc LLM churn for the clarification slot; when no unresolved questions
          remain, packet depth and critique accept the ready-to-implement sentinel instead of requiring an editable draft list
        - >-
          evaluate_planning_packet_depth invokes PlanningPacketDepthEvaluator with relaxOpenQuestionSupplementalChecks derived from
          workflow state so thin artifact open_questions text alone does not fail depth when planningCanonicalUserInputRequired is false
          and the unresolved ledger has no OPEN blocking item
        - >-
          run_request_expansion_llm and run_llm_planning_synthesis system prompts require repo evidence tiers, draft-only JSON
          (no recommended_action or synthesis routing enums), optional draft_question_candidate for draft text only, forbid generic
          multi-question open-question brainstorming, and require real software_feature_planning_v2 artifact/section/field ids instead of
          generic fieldId placeholders; touchpoints must not be asserted as observed unless present in supplied repo evidence for that pass
        - >-
          run_request_expansion_llm user JSON carries planner_instruction when a workspace checkout path or non-trivial
          planningRepoEvidenceJson snapshot is present, nudging the model to treat repo evidence as observed when it uses that
          snapshot and to name concrete paths/packages in impacted_components only when supported by the evidence
        - >-
          For canonical_v1 coordinator transport, PlanningEvaluationService evaluates canonical plan state after drafting;
          code validates that only blocking or branching gaps can surface ASK_USER, enforces maxQuestions=1, persists
          confidence from evaluation output, and routes only through the normalized planningNextAction and planningNextPhase snapshot without fallback to generic or ranked questioning when the canonical gap set is closed;
          ordinary ambiguity resolves to ASK_USER (one repaired question when needed, using evaluator text then merged
          draft_question_candidate then top_unresolved_gap spread keys, then gap seed) or READY_FOR_PACKET (assumptions/packet)
          rather than planning_blocked; first-start evaluation payloads use phase_context planning_startup_evaluation and
          post-merge passes use planning_clarification;
          planning_blocked is reserved for machine/validity failures, malformed evaluation JSON, blocking CONTRADICTION gaps, or
          incoherent plan state with no recovery path; missing repo inspection alone does not force BLOCKED when no gap is blocking:
          evaluation may coerce READY_FOR_PACKET when depth and structured parse are acceptable and the model withheld
          ready_for_packet without asserting blocking gaps, or when narrative/plan artifacts are materially present
        - >-
          Silent synthesis before first evaluation uses at most one inner drafting round (coordinator + synthesis + depth) by default
          and skips a redundant inner expand_planning_drafts when runExpansionPhase already ran in the same cycle so demo paths do
          not double-expand; selective rerun after clarification may still run inner expand when expansion was skipped
        - >-
          Repo workspace evidence (planningRepoEvidenceJson and related spreads from ensure_repo_workspace / optional RAG prep)
          is part of the canonical evaluation context so strong on-repo support can reduce unnecessary user asks without a second ranking path
        - >-
          Launch approval readiness treats intake as satisfied when FeaturePlanState.autonomousPlanningPassCompleted is true or when
          PlanningIntakeStage has left GATHERING_CONTEXT and CLARIFYING, reducing sole reliance on a separate human “discovery complete” marker
        - >-
          classify_planning_ingress and set_planning_intake_stage actions are registered for v2 YAML to normalize ingress mode and
          persist canonical intake stage transitions on FeaturePlanState
        - >-
          WorkflowActionRegistry logs and rethrows action failures instead of silently swallowing them, and StepResult spread writes
          preserve null values without throwing during immutable-copy wrapping
        - >-
          dispatchCoordinatorPlanningKickoff does not report a blank coordinator kickoff as success unless the workflow records
          a successful kickoff side effect (for example coordinator_intake_bootstrap posting the thread kickoff); otherwise
          when kickoff returns an error or has no reply and no recorded visible outcome, the session is marked failed and
          the thread receives a fallback internal-error notice
        - UnresolvedItem carries optional repeatCount in JSON for anti-loop rules; UnresolvedItemLedger.maxOpenItemRepeatCount supports rules
        - >-
          Production Arrietty uses arrietty_room_v2 (workflowSchema v2) whose explicit lifecycle phases own hydrate_planning_session,
          ensure_repo_workspace, optional prep_planning_repo_grounding (Qdrant + Parquet RAG when configured in ingress YAML),
          spread_plan_workspace_signals, spread_planning_workspace_blocker, clarification, critique, approval, and launch
          inside the v2 graph; v2 templates allowlist includes planningIngressMode, planningAutonomousFirstPassCompleted,
          planningRepoEvidenceJson, canonicalPlanningIntakeStage, and user-facing review / launch copy keys
        - >-
          arrietty_room_v2 uses named phases plus embedded configurable_steps segments; configurable_steps persist isolated segment
          cursors; kickoff routes through planning_ingress/planning_kickoff; planning_preflight / planning_silent_synthesis /
          planning_clarification own the intake spine, and rs_evaluation_branch branches only on planningNextPhase
          (planning_clarification, planning_packet, planning_blocked; default planning_routing_invariant when unmatched); CONTINUE_SYNTHESIS is not a live YAML branch;
          FeaturePlanState planner recovery fields persist synthesis failure category, phase, recoverable flag, and
          humanized last recovery hint; clarification uses the explicit planning_clarification phase when
          the coordinator must ask the operator; ArriettyV2WorkflowYamlTest guards phase ownership, evaluation branching, and bans
          linear_workflow_ref in production config
        - >-
          When coordinator planning reaches the ready-to-move-forward path, user-facing progress copy says the next long
          step is posting the planning packet and running readiness checks only when planningNextAction is READY_FOR_PACKET,
          and post_planning_packet_thread emits a brief preamble only for that route so the intake thread is not silent during that wait
        - >-
          Planning packet sections and declarative readiness gate messages shown to operators use PlanningUserFacingCopy and
          work-profile titles where applicable so raw artifact paths and enum tokens are not the primary Discord copy
        - >-
          PlanningThreadPacketFormatter renders governance subsections as labeled Discord lists with capped inline fields, adds companion lists for
          multi-line user stories and acceptance criteria when parseable, applies per-section soft truncation with a visible
          "Truncated for display length." footnote, and labels split Discord messages as Planning packet parts
        - >-
          Open questions in the packet prefer the unresolvedQuestions list; artifact open_questions lines fall back to a labeled list or
          plain text, and the ready-to-implement sentinel is treated as empty for depth/critique without inventing fake unresolved rows
        - >-
          GraphWorkflowRunner when linear_workflow_ref completes with user-visible text (reply or rich intent) and the phase
          pipeline is exhausted collapses through default/terminal v2 phases and returns that delegated result instead of
          discarding it for an empty outer completed("")
        - >-
          PlanningDeliberationLedgerSync keeps workflowUnresolvedItemsJson aligned with clarification rank/merge; suppresses new OPEN
          when a MERGED planning item is semantically similar (paraphrase) to the candidate question; stores topicKey on new items;
          ProgressEventLog records deduped progress lines; work profiles may set deliberation.boundedClarificationChoices and optional
          deliberation.inferBoundedChoiceFromOrInText for OR-in-text bounded inference
      examples: []
