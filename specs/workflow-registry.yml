schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-22T04:20:00Z"
project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: '21'
enums:
  status:
    - draft
    - active
    - deprecated
  priority:
    - low
    - medium
    - high
  type:
    - functional
    - non-functional
    - constraint
  handling_strategy:
    - fail
    - retry
    - skip
  asset_kind:
    - source
    - config
    - spec
    - workflow
  dependency_kind:
    - library
    - tool
    - service
  dependency_scope:
    - build
    - test
    - runtime
  dependency_criticality:
    - optional
    - required
dependencies:
  items:
    - id: DEP-JACKSON-DATABIND
      kind: library
      name: jackson-databind
      scope: runtime
      criticality: required
      spec: com.fasterxml.jackson.core:jackson-databind
      install_hint: Maven dependency
      used_by_requirements:
        - REQ-LUNA-001
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements:
        - REQ-CORE-001
        - REQ-ENV-001
        - REQ-CORE-002
        - REQ-CORE-003
        - REQ-CONFIG-001
        - REQ-BOT-001
        - REQ-BOT-002
        - REQ-EVENTS-001
        - REQ-STATE-001
        - REQ-TOOLS-001
        - REQ-REASONER-001
        - REQ-WORKFLOW-001
        - REQ-WORKFLOW-002
        - REQ-LUNA-001
        - REQ-GADGET-001
assets:
  - id: ASSET-BOOTSTRAP
    kind: source
    path: src/main/java/com/vinekeepers/core/Bootstrap.java
    role: >-
      Wire engine, config, connectors, shared tools, and configured workflow runners; pass LifecycleContextStore and
      handlesOwnedSpaces map from loaded bots to Router; construct FeaturePlanStateStore, RepoWorkspaceStateStore,
      RepoWorkspaceService; load WorkProfileRegistry from config/work-profiles.yaml; register initialize_feature_plan_state,
      hydrate_planning_session, start_coordinator_planning, generate_planning_proposals, apply_auto_planning_proposals, build_proposal_confirm_prompt,
      resolve_proposal_confirmation, synthesize_plan_drafts, ensure_repo_workspace, spread_plan_workspace_signals,
      evaluate_planning_packet_depth, evaluate_planning_approval_gate, execute_planning_room_cycle,
      planning_cycle_run_expansion, planning_cycle_run_inner_round, planning_cycle_finalize,
      post_planning_progress_if_changed, merge_planning_clarification_choice, run_architect_planning_pass, run_auditor_planning_pass, run_scribe_planning_pass,
      run_llm_planning_synthesis, run_request_expansion_llm, upsert_artifact_section_data,
      get_profile_missing_fields, structured discovery and plan actions, mark_intake_discovery_complete,
      acknowledge_readiness_human_decision, build_role_planning_thread_messages, run_plan_critique_and_readiness,
      build_planning_thread_review_body, post_planning_packet_thread, build_request_exploration, expand_planning_drafts, persist_plan_approval,
      append/set plan actions; register resolve_deploy_branch, start_ansible_deploy, and run_deploy_compose;
      load DeployTargetRegistry and register deployTargets, deployComposeServices, and deployGitBranches choice providers on config load
    requires:
      - REQ-CORE-002
      - REQ-TOOLS-001
      - REQ-LUNA-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-CORE
      - FEAT-TOOLS
      - FEAT-CURSOR-GATHERING
      - FEAT-DEVOPS-GADGET
  - id: ASSET-ENGINE
    kind: source
    path: src/main/java/com/vinekeepers/core/VinekeepersEngine.java
    role: >-
      Route events to bots (router plus for Discord message events add bots with waiting session WAITING_INPUT for event
      session key); run workflow and reasoner; apply tool/state side effects; deliver replies via connector sink;
      dispatchCoordinatorPlanningKickoff runs a single coordinator bot for a synthetic thread message after Luna handoff with idempotent skip when thread session is already waiting, in progress, or completed
      registry (transitional source-prefix) and lifecycle operations (respondImmediately, sendFollowUp, updateMessage);
      for Discord, OutboundDeliveryRouter resolves sender by target and lifecycle configuredBotId with no silent
      fallback; build OutboundResponse from workflow/reasoner; obtain ReplyTarget via ReplyTargetResolver by connector id; fail closed when no resolver or resolver returns empty; no defer in engine;
      when ReplyTarget is deferred InteractionTarget and outbound is null, send minimal text follow-up so Discord interaction completes
      (bots with workflowType arrietty_room use a planning-specific line instead of the generic Recorded ack)
    requires:
      - REQ-CORE-003
      - REQ-REASONER-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-ENGINE
      - FEAT-REASONER
      - FEAT-CURSOR-GATHERING
  - id: ASSET-BOTS-YAML
    kind: config
    path: config/bots.yaml
    role: >-
      Bot definitions YAML (Luna routing, Discord mention activation, optional discordAuthors, optional
      discordTokenEnvKey and handlesOwnedSpaces per bot, lifecycleBotName in step bind; Arrietty template with
      workflowRef arrietty_room, handlesOwnedSpaces, capture_field trimAndLower for room name UX, branch value "" for
      blank/empty; operator bot (e.g. id gadget) with workflowRef devops_deploy, routing discordMention and discordChannels allowlist
      ops channel id in discordChannels (see comment block top of config/bots.yaml); Luna routing optional discordChannelsExclude
      for that ops channel id
    requires:
      - REQ-CONFIG-001
      - REQ-LUNA-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-CONFIG
      - FEAT-CURSOR-GATHERING
      - FEAT-DEVOPS-GADGET
  - id: ASSET-CURSOR-FULL-RUN-TOOL
    kind: source
    path: src/main/java/com/vinekeepers/tools/CursorFullRunTool.java
    role: Tool wrapper that launches a Cursor cloud run from gathered workflow state and stores launch metadata
    requires:
      - REQ-TOOLS-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-TOOLS
      - FEAT-CURSOR-GATHERING
  - id: ASSET-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/Workflow.java
    role: Workflow state machine interface
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowResult.java
    role: Workflow result model
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflow.java
    role: Stub workflow implementation
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubState.java
    role: Stub workflow state
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-LUNA-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/GatheringState.java
    role: Luna per-conversation state (project, code change, step)
    requires:
      - REQ-STATE-001
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-STATE
      - FEAT-CURSOR-GATHERING
  - id: ASSET-LUNA-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/CursorCloudGatheringWorkflow.java
    role: Luna workflow class (legacy); Luna uses configured workflow luna_cursor in config; this class used by tests
    requires:
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunner.java
    role: Interface to run workflow for an event and return a structured workflow result
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
      - FEAT-ENGINE
  - id: ASSET-WORKFLOW-RUN-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunResult.java
    role: >-
      Structured workflow result with reply, optional OutboundResponse richReply, waiting/completed flags, and error
      details
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflowRunner.java
    role: Stub workflow runner implementation
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RUNNER-FACTORY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunnerFactory.java
    role: >-
      Create WorkflowRunner from workflow type, params, and bot runtime options from config; parses optional templates map into
      WorkflowTemplatePolicy; when workflowSchema v2 and phases exist, yields GraphWorkflowRunner
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-GRAPH-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/v2/GraphWorkflowRunner.java
    role: >-
      Phase graph runner for workflowSchema v2 (capability pipelines, rulesets, legacy_action capabilities); applies workflow
      template policy to state each run
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-V2-LOADER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/v2/WorkflowV2Loader.java
    role: Parse workflow YAML map into WorkflowV2Model (phases, capabilities, rulesets, optional templates)
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RULES-ENGINE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/v2/WorkflowRulesEngine.java
    role: >-
      Ordered rule evaluation with ANDed when predicates and transition effects for v2 convergence; predicates include
      ledgerMaxOpenRepeatGte (max repeatCount among OPEN UnresolvedItem entries)
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-UNRESOLVED-ITEM-LEDGER
    kind: source
    path: src/main/java/com/vinekeepers/state/workflow/UnresolvedItemLedger.java
    role: Generic unresolved-item ledger JSON in workflow state (workflowUnresolvedItemsJson) for clarification lifecycle
    requires:
      - REQ-WORKFLOW-002
      - REQ-STATE-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PROGRESS-DEDUPE-HELPER
    kind: source
    path: src/main/java/com/vinekeepers/state/workflow/ProgressDedupeHelper.java
    role: Normalize and SHA-256 fingerprint user-visible progress bodies for generic dedupe
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-SAFE-TEMPLATE-RENDERER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/template/WorkflowSafeTemplateRenderer.java
    role: Allowlisted {{key}} template rendering to reduce internal state leakage in user copy
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-TEMPLATE-POLICY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/template/WorkflowTemplatePolicy.java
    role: >-
      Workflow YAML templates block (exposeInternal default true; optional allowedKeys); writes __workflowTemplatesExposeInternal
      and __workflowTemplatesAllowedKeys into session state for post_channel_message and other consumers
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-TEMPLATE-INTERPOLATOR
    kind: source
    path: src/main/java/com/vinekeepers/workflow/template/WorkflowTemplateInterpolator.java
    role: >-
      Interpolates {{key}} using full state (legacy) or WorkflowSafeTemplateRenderer + UserCopyContext when exposeInternal is false
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-CYCLE-PIPELINE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningCyclePipeline.java
    role: >-
      Composable planning-room cycle logic invoked by execute_planning_room_cycle; exposes partial phases
      runExpansionPhaseOnly, runInnerRoundOnce, finalizePlanningCycleSpread for planning_cycle_* actions and v2 YAML composition;
      planningPartialAggregatedFollowUpsJson carries follow-ups between partial calls
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-STRUCTURED-LLM-ARTIFACT-UPSERT-PASS
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/StructuredLlmArtifactUpsertPass.java
    role: Generic LLM JSON upsert pass over feature-plan artifacts; used by PlanningRolePassRunner
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-SESSION-KEY-STRATEGY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/SessionKeyStrategy.java
    role: Contract for resolving per-bot workflow session keys from events
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-SESSION-KEY-STRATEGIES
    kind: source
    path: src/main/java/com/vinekeepers/workflow/SessionKeyStrategies.java
    role: Built-in session key strategies for channel, channel_user, and thread conversations
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STEP-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StepResult.java
    role: >-
      Result of a single workflow step execution with next-step, storage, outcome metadata, and optional
      OutboundResponse richReply
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-STEP-OUTCOME
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StepOutcome.java
    role: Outcome enum for continue, waiting, complete, and error workflow step states
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowStep.java
    role: Single step in a configurable workflow
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowAction.java
    role: Action interface invokable from workflow steps
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-ACTION-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowActionRegistry.java
    role: Register and resolve workflow actions by name
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-CAPABILITY-SUPPORT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowCapabilitySupport.java
    role: >-
      Utility to resolve source prefix from event for capability lookups (e.g. SpaceOperationsRegistry); null/blank
      prefix yields fail-closed behavior in actions (no Discord default)
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CONFIGURABLE-WORKFLOW-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/ConfigurableWorkflowState.java
    role: >-
      Mutable state for configurable workflow including waiting, completed, and error lifecycle data; clearKeys(keys)
      removes given keys from state (edit-reprompt)
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-DEFINITION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowDefinition.java
    role: >-
      Workflow definition from config (id, list of step configs, optional workflow-level llm map provider/model/timeoutMs
      merged into state as workflowLlmProvider, workflowLlmModel, workflowLlmTimeoutMs); optional workflowSchema (e.g. v2);
      optional templates map (exposeInternal, allowedKeys) for WorkflowTemplatePolicy
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CONFIGURABLE-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/ConfigurableWorkflowRunner.java
    role: >-
      Run workflow from WorkflowDefinition with conversational pause/resume, session keys, tool-backed actions; parses
      intent, choices, confirmLabel, cancelLabel, fields, optional control.mode for prompt_for_field, trimAndLower, transforms,
      and fromEvent for steps; registers extract_event step; applies StepResult clearKeys to state before setStepIndex;
      merges workflow llm defaults into state at session start; call_action passes merged llm overrides into LLM-capable actions only
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-ASK-FOR-INPUT-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/AskForInputStep.java
    role: Step that asks for user input and stores in state
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PROMPT-FOR-FIELD-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/PromptForFieldStep.java
    role: >-
      Step that prompts once for a field and pauses until a later event; optional
      intent/choices/choiceProvider/confirmLabel/cancelLabel/fields; interpolates {{key}} from state
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CAPTURE-FIELD-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/CaptureFieldFromEventStep.java
    role: >-
      Step that captures a field from the current event; for kind interaction normalizes payload.values (Map or List)
      and reads selected value or customId; for message events reads from contentKey or payload content/text; optional
      transforms list (trim, lower, upper, default); when both trimAndLower and transforms present, trimAndLower wins
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CALL-ACTION-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/CallActionStep.java
    role: Step that invokes a registered WorkflowAction or ToolRunner-backed tool with bound arguments
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-BRANCH-STEP
    kind: source
    path: src/main/java/com/vinekeepers/workflow/steps/BranchStep.java
    role: >-
      Step that branches by condition; when key/value (optional operator, transform on state value); operators equals,
      not_equals, blank, nonblank, contains, starts_with, regex (full-string), one_of; optional clear for edit-reprompt
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-DYNAMIC-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/DynamicChoiceProvider.java
    role: Interface for dynamic choice providers used by prompt_for_field when choiceProvider is set
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-DYNAMIC-CHOICE-PROVIDER-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/DynamicChoiceProviderRegistry.java
    role: Registry of named dynamic choice providers wired from Bootstrap into ConfigurableWorkflowRunner
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-GITHUB-REPOS-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/providers/GitHubReposChoiceProvider.java
    role: Fetches user repos from GitHub API (sort=updated), prepends last repo, appends Custom repo; uses GITHUB_TOKEN
    requires:
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-GADGET-PROJECT-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/devops/DeployTargetRegistry.java
    role: >-
      Loads deploy targets from config/deploy-targets.yaml (targets or legacy projects; id, label, playbook, optional
      compose block); path from DEPLOY_TARGETS_PATH with GADGET_PROJECTS_PATH alias
    requires:
      - REQ-WORKFLOW-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-GADGET-DEPLOY-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/devops/AnsiblePlaybookDeployRunner.java
    role: >-
      Background ansible-playbook execution; streams TASK/fatal lines to Discord via OutboundDeliveryRouter.sendAs workflow bot id;
      env DEPLOY_ANSIBLE_* with GADGET_ANSIBLE_* aliases; passes -e project_id, branch, gadget_project, gadget_branch for compatibility
    requires:
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-GADGET-PROJECTS-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/providers/DeployTargetsChoiceProvider.java
    role: Dynamic choice provider deployTargets for devops_deploy target selection
    requires:
      - REQ-WORKFLOW-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-GADGET-RESOLVE-BRANCH-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/ResolveDeployBranchAction.java
    role: Workflow action resolve_deploy_branch; sets deployBranch from branchChoice or branchCustom when other
    requires:
      - REQ-WORKFLOW-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-START-GADGET-DEPLOY-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/StartAnsibleDeployAction.java
    role: >-
      Workflow action start_ansible_deploy; validates deploy target, resolves progress target (thread or parent channel on
      THREAD_CREATE_FAILED), submits AnsiblePlaybookDeployRunner using __botId from workflow state (no hardcoded bot id)
    requires:
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-GADGET-PROJECTS-YAML
    kind: config
    path: config/deploy-targets.yaml
    role: >-
      Deploy targets list (targets with id, label, playbook relative to ansible root, optional compose file, workingDirectory,
      composeServices allowlist, hostOpsExecutor direct or cursor_agent)
    requires:
      - REQ-CONFIG-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-CONFIG
      - FEAT-DEVOPS-GADGET
  - id: ASSET-HOST-COMPOSE-OPS-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/devops/HostComposeOpsRunner.java
    role: >-
      docker compose up/down/restart/ps or cursor agent non-interactive prompt for compose ops; streams output to Discord;
      DEPLOY_HOST_OPS_DISABLED (GADGET_HOST_OPS_DISABLED alias) kill switch
    requires:
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-RUN-DEPLOY-COMPOSE-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/RunDeployComposeAction.java
    role: Workflow action run_deploy_compose; bind composeOperation; submits HostComposeOpsRunner with workflow bot id from state
    requires:
      - REQ-WORKFLOW-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-DEPLOY-COMPOSE-SERVICES-CHOICE-PROVIDER
    kind: source
    path: src/main/java/com/vinekeepers/providers/DeployComposeServicesChoiceProvider.java
    role: Choice provider deployComposeServices from manifest allowlist for selected deployTargetId
    requires:
      - REQ-WORKFLOW-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-DEVOPS-GADGET
  - id: ASSET-DONE-STEP
