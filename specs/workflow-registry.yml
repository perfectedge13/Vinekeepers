        Do not serialize null fields in Cursor API request payload because it can cause API errors or unexpected
        behavior.
  - id: REQ-GADGET-001
    title: DevOps deploy — Discord menu, Ansible and Docker Compose, thread progress
    statement: >-
      Operator bot (e.g. id gadget) with Discord token env GADGET_DISCORD_TOKEN; routing uses discordMention and discordChannels
      allowlist (ops channel id, including Discord threads whose parent channel is allowlisted); workflow devops_deploy
      uses extract_event for channelId, main menu (Ansible deploy vs compose up/stop/restart/ps or Cancel),
      choiceProvider deployTargets from config/deploy-targets.yaml, branch choices main/develop/other with resolve_deploy_branch,
      create_thread for progress/status threads (thread name deploy-progress for mutating actions, DevOps Progress for compose ps),
      start_ansible_deploy to run ansible-playbook asynchronously and run_deploy_compose for docker compose or optional cursor
      agent executor; OutboundDeliveryRouter.sendAs workflow bot id from state; progress falls back to parent channel when
      THREAD_CREATE_FAILED; compose-only targets may omit playbook and use host workingDirectory paths (e.g.
      /home/perfect_edge13/Docker/neo4j, /home/perfect_edge13/Docker/wikijs) so docker compose resolves the stack file on the deploy host
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - bots.yaml defines operator DevOps bot with workflowRef devops_deploy and identities.discord ingress routed
        - >-
          Routing filter discordMention and discordChannels; messages match only with direct bot mention metadata/text in
          the allowlisted channel or a Discord thread whose parent channel is allowlisted; role pings do not satisfy discordMention
        - >-
          devops_deploy registers choiceProviders deployTargets, deployComposeServices, and deployGitBranches; Bootstrap registers
          deploy_resolve_project, resolve_deploy_branch, start_ansible_deploy, and run_deploy_compose; reload registry actions when config loads
        - >-
          AnsiblePlaybookDeployRunner invokes ansible-playbook with -e project_id, branch, gadget_project, gadget_branch, and manifest
          extraVars; respects DEPLOY_ANSIBLE_DISABLED/GADGET_ANSIBLE_DISABLED for dry run; posts via sendAs workflow bot id from state
        - >-
          HostComposeOpsRunner runs allowlisted docker compose up/stop/restart/ps per target manifest; uses compose workingDirectory as
          host cwd for ProcessBuilder (direct) or as Cursor agent --workspace (cursor_agent); direct execution fails fast with
          operator-facing prerequisite errors when the Docker CLI, compose file, workingDirectory mount, or /var/run/docker.sock
          mount is missing inside a containerized Vinekeepers runtime; startup logs warn early when direct compose targets are
          mis-mounted; DEPLOY_HOST_OPS_DISABLED disables host ops
        - >-
          compose.yaml bind-mounts the real host stack directories declared in config/deploy-targets.yaml at the same absolute paths
          inside the container so direct compose can run without stack-path env vars
        - >-
          config/bots.yaml workflows.devops_deploy main menu includes compose_restart; branch step next indices reference valid step
          indices (DevopsDeployWorkflowYamlTest)
        - >-
          config/bots.yaml uses thread name DevOps Progress for compose ps and deploy-progress for mutating compose actions; compose
          status kickoff copy says updates will appear in the selected status target
        - >-
          Shipped config/deploy-targets.yaml includes compose-only neo4j and wikijs targets with host stack workingDirectory and
          allowlisted services
        - >-
          Shipped compose.yaml mounts /var/run/docker.sock, the repo at /workspace/vinekeepers, bind-mounts the neo4j and wikijs
          stack directories at the same absolute paths as config/deploy-targets.yaml, and switches DEPLOY_TARGETS_PATH to
          config/deploy-targets.docker.yaml for containerized direct compose
        - >-
          ansible/playbooks ships example site.yml (staging dir + JSON manifest; extend for real deploy); Dockerfile copies
          ansible tree, sets GADGET_ANSIBLE_ROOT / DEPLOY_ANSIBLE_ROOT, and installs ansible plus the Docker CLI/Compose plugin
          in the Ubuntu Jammy runtime image
      examples: []
    traceability:
      assets:
        - ASSET-GADGET-PROJECT-REGISTRY
        - ASSET-GADGET-DEPLOY-RUNNER
        - ASSET-GADGET-PROJECTS-CHOICE-PROVIDER
        - ASSET-GADGET-RESOLVE-BRANCH-ACTION
        - ASSET-START-GADGET-DEPLOY-ACTION
        - ASSET-GADGET-PROJECTS-YAML
        - ASSET-GADGET-PROJECTS-DOCKER-YAML
        - ASSET-COMPOSE-HOST-OPS-YAML
        - ASSET-HOST-COMPOSE-OPS-RUNNER
        - ASSET-RUN-DEPLOY-COMPOSE-ACTION
        - ASSET-DEPLOY-COMPOSE-SERVICES-CHOICE-PROVIDER
        - ASSET-BOOTSTRAP
        - ASSET-BOTS-YAML
        - ASSET-DYNAMIC-CHOICE-PROVIDER-REGISTRY
        - ASSET-CREATE-THREAD-ACTION
      symbols: []
    validation:
      tests:
        - id: UNIT-GADGET-RESOLVE-BRANCH
          title: ResolveDeployBranchActionTest
          intent: Verify deployBranch from branchChoice and branchCustom when other
          testClass: com.vinekeepers.workflow.actions.ResolveDeployBranchActionTest
          preconditions: []
        - id: UNIT-GADGET-PROJECT-REGISTRY
          title: DeployTargetRegistryTest
          intent: >-
            Verify YAML load and findById including compose fields; shipped manifest neo4j/wikijs host stack paths and compose
            service allowlists (neo4j; wikijs stack wikijs, db)
          testClass: com.vinekeepers.devops.DeployTargetRegistryTest
          preconditions: []
        - id: UNIT-START-GADGET-DEPLOY
          title: StartAnsibleDeployActionTest
          intent: Verify unknown target failure and dry-run path posts via sendAs workflow bot id
          testClass: com.vinekeepers.workflow.actions.StartAnsibleDeployActionTest
          preconditions: []
        - id: UNIT-GADGET-ROUTING
          title: RouterTest
          intent: Verify DevOps bot routing with mention and discordChannels allowlist
          testClass: com.vinekeepers.bot.RouterTest
          testMethod: routeMatchesGadgetWhenMentionAndChannelAllowlist
          preconditions: []
        - id: UNIT-DEPLOY-RESOLVE-PROJECT
          title: DeployResolveProjectActionTest
          intent: Verify deploy_resolve_project skip vs pick
          testClass: com.vinekeepers.workflow.actions.DeployResolveProjectActionTest
          preconditions: []
        - id: UNIT-DEPLOY-GIT-BRANCHES-CHOICE
          title: GitRemoteBranchesChoiceProviderTest
          intent: Verify branch choice fallback without git remote
          testClass: com.vinekeepers.providers.GitRemoteBranchesChoiceProviderTest
          preconditions: []
        - id: UNIT-HOST-COMPOSE-OPS-RUNNER
          title: HostComposeOpsRunnerTest
          intent: Verify docker compose argv for up/stop/restart/ps and cursor prompt building without invoking docker
          testClass: com.vinekeepers.devops.HostComposeOpsRunnerTest
          preconditions: []
        - id: UNIT-DEVOPS-DEPLOY-WORKFLOW-YAML
          title: DevopsDeployWorkflowYamlTest
          intent: Guard devops_deploy YAML branch next indices, compose up/stop semantic routing, and main menu compose options
          testClass: com.vinekeepers.config.DevopsDeployWorkflowYamlTest
          preconditions: []
        - id: UNIT-DEPLOY-COMPOSE-SERVICES-CHOICE
          title: DeployComposeServicesChoiceProviderTest
          intent: Verify service choices from manifest allowlist for deployTargetId
          testClass: com.vinekeepers.providers.DeployComposeServicesChoiceProviderTest
          preconditions: []
        - id: UNIT-ANSIBLE-DEPLOY-RUNNER-ESCAPE
          title: AnsiblePlaybookDeployRunnerEscapeTest
          intent: Verify extra-var escaping for ansible-playbook argv
          testClass: com.vinekeepers.devops.AnsiblePlaybookDeployRunnerEscapeTest
          preconditions: []
    anti_patterns:
      - Running ansible-playbook on the engine thread (blocks Discord gateway)
      - Posting deploy progress with default sender when multi-bot; use sendAs workflow bot id from state
