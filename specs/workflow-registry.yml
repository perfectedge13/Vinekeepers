      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-MATERIAL-SPREAD-KEYS
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningMaterialSpreadKeys.java
    role: >-
      Shared FeaturePlanState spread key constants for material fingerprinting and silent-synthesis pacing
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-COORDINATOR-ROLE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningCoordinatorRole.java
    role: Arrietty coordinator pass enum with the consolidated LLM prompt block for StructuredLlmArtifactUpsertPass
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CONFIGURABLE-PASS-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/ConfigurablePassRunner.java
    role: >-
      Parses planningRolePassOrder from bind/state (JSON array or comma list) into ordered PlanningCoordinatorRole list;
      defaults to the single COORDINATOR pass and maps legacy ARRIETTY/architect/auditor/scribe tokens to that pass
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PLANNING-ROLE-PASS-RUNNER
