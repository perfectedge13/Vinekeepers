  - id: REQ-GADGET-001
    title: DevOps deploy — Discord menu, Ansible and Docker Compose, thread progress
    statement: >-
      Operator bot (e.g. id gadget) with Discord token env GADGET_DISCORD_TOKEN; routing uses discordMention and discordChannels
      allowlist (ops channel id); workflow devops_deploy uses extract_event for channelId, main menu (Ansible deploy vs compose up/stop/ps or Cancel),
      choiceProvider deployTargets from config/deploy-targets.yaml, branch choices main/develop/other with resolve_deploy_branch,
      create_thread for progress thread (thread name deploy-progress), start_ansible_deploy to run ansible-playbook asynchronously
      and run_deploy_compose for docker compose or optional cursor agent executor; OutboundDeliveryRouter.sendAs workflow bot id from state;
      progress falls back to parent channel when THREAD_CREATE_FAILED
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - bots.yaml defines operator DevOps bot with workflowRef devops_deploy and identities.discord ingress routed
        - >-
          Routing filter discordMention and discordChannels; messages match only in allowlisted channel with bot mention metadata
        - >-
          devops_deploy registers choiceProviders deployTargets, deployComposeServices, and deployGitBranches; Bootstrap registers
          deploy_resolve_project, resolve_deploy_branch, start_ansible_deploy, and run_deploy_compose; reload registry actions when config loads
        - >-
          AnsiblePlaybookDeployRunner invokes ansible-playbook with -e project_id, branch, gadget_project, gadget_branch, and manifest
          extraVars; respects DEPLOY_ANSIBLE_DISABLED/GADGET_ANSIBLE_DISABLED for dry run; posts via sendAs workflow bot id from state
        - >-
          HostComposeOpsRunner runs allowlisted docker compose operations per target manifest; DEPLOY_HOST_OPS_DISABLED disables host ops;
          optional hostOpsExecutor cursor_agent uses Cursor Agent CLI with non-interactive flags
        - >-
          ansible/playbooks ships example site.yml (staging dir + JSON manifest; extend for real deploy); Dockerfile copies
          ansible tree, sets GADGET_ANSIBLE_ROOT / DEPLOY_ANSIBLE_ROOT, installs ansible via apt on Ubuntu Jammy runtime (not Alpine pip)
