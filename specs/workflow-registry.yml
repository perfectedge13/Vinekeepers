    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-LUNA-RUN-STATE
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/LifecycleRunRecord.java
