schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-24T20:00:00Z"
project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"
enums:
  status:
    - draft
    - active
    - deprecated
  priority:
    - low
    - medium
    - high
  type:
    - functional
    - non-functional
    - constraint
  handling_strategy:
    - fail
    - retry
    - skip
  asset_kind:
    - source
    - config
    - spec
    - workflow
  dependency_kind:
    - library
    - tool
    - service
  dependency_scope:
    - build
    - test
    - runtime
  dependency_criticality:
    - optional
    - required
dependencies:
  items:
    - id: DEP-JACKSON-DATABIND
      kind: library
      name: jackson-databind
      scope: runtime
      criticality: required
      spec: com.fasterxml.jackson.core:jackson-databind
      install_hint: Maven dependency
      used_by_requirements:
        - REQ-LUNA-001
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements:
        - REQ-CORE-001
        - REQ-ENV-001
        - REQ-CORE-002
        - REQ-CORE-003
        - REQ-CONFIG-001
        - REQ-BOT-001
        - REQ-BOT-002
        - REQ-EVENTS-001
        - REQ-STATE-001
        - REQ-TOOLS-001
        - REQ-REASONER-001
        - REQ-WORKFLOW-001
        - REQ-WORKFLOW-002
        - REQ-LUNA-001
        - REQ-GADGET-001
    - id: DEP-PARQUET-AVRO
      kind: library
      name: parquet-avro
      scope: runtime
      criticality: required
      spec: org.apache.parquet:parquet-avro
      install_hint: Maven dependency for planning RAG Parquet cache
      used_by_requirements:
        - REQ-WORKFLOW-001
    - id: DEP-HADOOP-COMMON
      kind: library
      name: hadoop-common
      scope: runtime
      criticality: required
      spec: org.apache.hadoop:hadoop-common
      install_hint: Maven dependency (Path API for Parquet I/O)
      used_by_requirements:
        - REQ-WORKFLOW-001
    - id: DEP-AVRO
      kind: library
      name: avro
      scope: runtime
      criticality: required
      spec: org.apache.avro:avro
      install_hint: Maven dependency for Parquet/Avro stack
      used_by_requirements:
        - REQ-WORKFLOW-001
assets:
  - id: ASSET-BOOTSTRAP
    kind: source
    path: src/main/java/com/vinekeepers/core/Bootstrap.java
    role: >-
      Wire engine, config, connectors, shared tools, and configured workflow runners; pass LifecycleContextStore and
      handlesOwnedSpaces map from loaded bots to Router; construct FeaturePlanStateStore, RepoWorkspaceStateStore,
      RepoWorkspaceService; load WorkProfileRegistry from config/work-profiles.yaml; register initialize_feature_plan_state,
      hydrate_planning_session, start_coordinator_planning, synthesize_plan_drafts, ensure_repo_workspace, prep_planning_repo_grounding, spread_plan_workspace_signals,
      derive_plan_governance, evaluate_planning_packet_depth, evaluate_planning_approval_gate, execute_planning_room_cycle,
      planning_run_silent_synthesis, planning_run_evaluation, assert_planning_route_phase, planning_route_invariant_failed,
      post_planning_progress_if_changed, merge_planning_clarification_choice, run_arrietty_planning_pass, run_planning_pass, run_architect_planning_pass, run_auditor_planning_pass, run_scribe_planning_pass,
      run_llm_planning_synthesis, run_request_expansion_llm, upsert_artifact_section_data,
      structured discovery and plan actions, coordinator_intake_bootstrap, mark_intake_discovery_complete, classify_planning_ingress, set_planning_intake_stage,
      acknowledge_readiness_human_decision, build_role_planning_thread_messages, run_plan_critique_and_readiness,
      build_planning_thread_review_body, post_planning_packet_thread, build_request_exploration, expand_planning_drafts, persist_plan_approval,
      append/set plan actions; register resolve_deploy_branch, start_ansible_deploy, and run_deploy_compose;
      load DeployTargetRegistry and register deployTargets, deployComposeServices, and deployGitBranches choice providers on config load;
      wires OpenAiChatClient with OpenAiPlanningProgressPoster (OpenAiPlanningProgressSink) so planning LLM calls can post
      **Update:** lines to the workflow channel when OPENAI_PLANNING_DISCORD_PROGRESS is not false
    requires:
      - REQ-CORE-002
      - REQ-TOOLS-001
      - REQ-LUNA-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-CORE
      - FEAT-TOOLS
      - FEAT-CURSOR-GATHERING
      - FEAT-DEVOPS-GADGET
  - id: ASSET-ENGINE
    kind: source
    path: src/main/java/com/vinekeepers/core/VinekeepersEngine.java
    role: >-
      Route events to bots (router plus for Discord message events add bots with waiting session WAITING_INPUT for event
      session key unless router.isCoordinatorExclusivePlanningDiscordEvent); run workflow and reasoner; apply tool/state side effects; deliver replies via connector sink;
      dispatchCoordinatorPlanningKickoff runs a single coordinator bot for a synthetic thread message after Luna handoff with idempotent skip when thread session is already waiting, in progress, or completed
      and treats a recorded coordinator kickoff side effect as a successful visible outcome even when the workflow returns completed("");
      registry (transitional source-prefix) and lifecycle operations (respondImmediately, sendFollowUp, updateMessage);
      for Discord, OutboundDeliveryRouter resolves sender by target and lifecycle configuredBotId with no silent
      fallback; build OutboundResponse from workflow/reasoner; obtain ReplyTarget via ReplyTargetResolver by connector id; fail closed when no resolver or resolver returns empty; no defer in engine;
      when ReplyTarget is deferred InteractionTarget and outbound is null, send minimal text follow-up so Discord interaction completes
      (bots whose configured workflowRef starts with arrietty_room use a planning-specific line instead of the generic Recorded ack)
    requires:
      - REQ-CORE-003
      - REQ-REASONER-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-ENGINE
      - FEAT-REASONER
      - FEAT-CURSOR-GATHERING
  - id: ASSET-BOTS-YAML
    kind: config
    path: config/bots.yaml
    role: >-
      Bot definitions YAML (Luna routing, Discord mention activation, optional discordAuthors, optional
      discordTokenEnvKey and handlesOwnedSpaces per bot, lifecycleBotName in step bind; Arrietty template with
      workflowRef arrietty_room_v2 whose planning ingress may run hydrate_planning_session, ensure_repo_workspace,
      optional prep_planning_repo_grounding (Parquet cache + Qdrant + planningRag* spreads), and spread_plan_workspace_signals before direct v2-owned planning phases, handlesOwnedSpaces, capture_field trimAndLower for room name UX, Arrietty prompt_for_field asks prefixed with ❓ for chat visibility, branch value "" for
      blank/empty; operator bot (e.g. id gadget) with workflowRef devops_deploy, routing discordMention and discordChannels allowlist
      ops channel id in discordChannels (see comment block top of config/bots.yaml); Luna routing optional discordChannelsExclude
      for that ops channel id
    requires:
      - REQ-CONFIG-001
      - REQ-LUNA-001
      - REQ-GADGET-001
    feature_ids:
      - FEAT-CONFIG
      - FEAT-CURSOR-GATHERING
      - FEAT-DEVOPS-GADGET
  - id: ASSET-CURSOR-FULL-RUN-TOOL
    kind: source
    path: src/main/java/com/vinekeepers/tools/CursorFullRunTool.java
    role: Tool wrapper that launches a Cursor cloud run from gathered workflow state and stores launch metadata
    requires:
      - REQ-TOOLS-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-TOOLS
      - FEAT-CURSOR-GATHERING
  - id: ASSET-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/Workflow.java
    role: Workflow state machine interface
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowResult.java
    role: Workflow result model
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflow.java
    role: Stub workflow implementation
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubState.java
    role: Stub workflow state
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-LUNA-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/GatheringState.java
    role: Luna per-conversation state (project, code change, step)
    requires:
      - REQ-STATE-001
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-STATE
      - FEAT-CURSOR-GATHERING
  - id: ASSET-LUNA-WORKFLOW
    kind: source
    path: src/main/java/com/vinekeepers/workflow/CursorCloudGatheringWorkflow.java
    role: Luna workflow class (legacy); Luna uses configured workflow luna_cursor in config; this class used by tests
    requires:
      - REQ-WORKFLOW-001
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunner.java
    role: Interface to run workflow for an event and return a structured workflow result
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
      - FEAT-ENGINE
  - id: ASSET-WORKFLOW-RUN-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunResult.java
    role: >-
      Structured workflow result with reply, optional OutboundResponse richReply, waiting/completed flags, and error
      details
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-STUB-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/StubWorkflowRunner.java
    role: Stub workflow runner implementation
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RUNNER-FACTORY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/WorkflowRunnerFactory.java
    role: >-
      Create WorkflowRunner from workflow type, params, and bot runtime options from config; parses optional templates map into
      WorkflowTemplatePolicy; when workflowSchema v2 and phases exist, yields GraphWorkflowRunner
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-GRAPH-WORKFLOW-RUNNER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/v2/GraphWorkflowRunner.java
    role: >-
      Phase graph runner for workflowSchema v2 (capability pipelines, rulesets, legacy_action, linear_workflow_ref, and
      configurable_steps capabilities); linear_workflow_ref runs a sibling linear workflow via ConfigurableWorkflowRunner on the
      same session store; configurable_steps runs inline steps from the capability YAML with the parent v2 workflow llm defaults
      and template policy; applies workflow template policy to state each run; when YAML includes deliberation map, writes
      workflowDeliberationMetaJson plus deliberationProfileHint and deliberationLabel when present; on outer micro-step guard
      exhaustion sets planningWorkflowStepLimitReached=true before markError
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-V2-LOADER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/v2/WorkflowV2Loader.java
    role: >-
      Parse workflow YAML map into WorkflowV2Model (phases, capabilities including optional inline steps for
      configurable_steps, rulesets, optional templates, optional deliberation map)
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-RULES-ENGINE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/v2/WorkflowRulesEngine.java
    role: >-
      Ordered rule evaluation with ANDed when predicates and transition effects for v2 convergence; predicates include
      truthy, equals, hasOpenUnresolved, allUnresolvedClosed, sameFingerprintRepeated, ledgerMaxOpenRepeatGte,
      reviewReady / approvalReady (dual planningReviewReady / planningApprovalReady), ledgerHasBlockingOpen
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-UNRESOLVED-ITEM-LEDGER
    kind: source
    path: src/main/java/com/vinekeepers/state/workflow/UnresolvedItemLedger.java
    role: >-
      Generic unresolved-item ledger JSON in workflow state (workflowUnresolvedItemsJson) for clarification lifecycle;
      hasOpenItems, hasOpenBlockingSeverity (OPEN + severity blocking), fingerprint merge closure helpers
    requires:
      - REQ-WORKFLOW-002
      - REQ-STATE-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PROGRESS-DEDUPE-HELPER
    kind: source
    path: src/main/java/com/vinekeepers/state/workflow/ProgressDedupeHelper.java
    role: Normalize and SHA-256 fingerprint user-visible progress bodies for generic dedupe
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PROGRESS-EVENT-LOG
    kind: source
    path: src/main/java/com/vinekeepers/state/workflow/ProgressEventLog.java
    role: >-
      Append-only workflowProgressEventsJson with coarse dedupe; events carry kind, message/body, severity, optional refs;
      withAppendedTyped for deliberation progress; PlanningCyclePipeline merges deltas and exposes userCopyProgressEventLatest
      and userCopyProgressLine for safe templates
    requires:
      - REQ-WORKFLOW-002
      - REQ-STATE-001
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-DELIBERATION-LEDGER-SYNC
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningDeliberationLedgerSync.java
    role: >-
      Dual-write planning clarification ranking/merge into UnresolvedItemLedger (workflowUnresolvedItemsJson) alongside
      FeaturePlanState assumptions
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-WORKFLOW-SAFE-TEMPLATE-RENDERER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/template/WorkflowSafeTemplateRenderer.java
    role: Allowlisted {{key}} template rendering to reduce internal state leakage in user copy
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-TEMPLATE-POLICY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/template/WorkflowTemplatePolicy.java
    role: >-
      Workflow YAML templates block (exposeInternal default true; optional allowedKeys); writes __workflowTemplatesExposeInternal
      and __workflowTemplatesAllowedKeys into session state for post_channel_message and other consumers
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-WORKFLOW-TEMPLATE-INTERPOLATOR
    kind: source
    path: src/main/java/com/vinekeepers/workflow/template/WorkflowTemplateInterpolator.java
    role: >-
      Interpolates {{key}} using full state (legacy) or WorkflowSafeTemplateRenderer + UserCopyContext when exposeInternal is false
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-CYCLE-PIPELINE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningCyclePipeline.java
    role: >-
      Thin orchestration entry for execute_planning_room_cycle and the split planning_run_silent_synthesis /
      planning_run_evaluation path; owns cycle load, workspace preflight, rerun bookkeeping, silent synthesis, one
      PlanningEvaluationService call, canonical decision persistence, and minimal workflow projection only
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CANONICAL-CLARIFICATION-SPREAD-BUILDER
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/CanonicalClarificationSpreadBuilder.java
    role: >-
      canonical_v1 only: packages CanonicalClarificationSelection (question + gapId + mergeTargetPath from CanonicalPlanningGap)
      into spread/ledger inputs; no second semantic evaluator lives here
    requires:
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-SILENT-PLANNING-SYNTHESIS-SERVICE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/SilentPlanningSynthesisService.java
    role: >-
      Silent (non-interactive) drafting — expansion, role passes, synthesis, pre-critique artifacts, and depth — as one
      explicit silent phase before planning evaluation
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PLANNING-EVALUATION-SERVICE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningEvaluationService.java
    role: >-
      Single semantic planning authority: one structured LLM call returns and validates a finalized
      PlanningEvaluationDecision with confidence, canonical gaps, one optional best question, AIRD deltas, readiness,
      block reason, and canonical next action for the live path
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PLANNING-EVALUATION-DECISION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningEvaluationDecision.java
    role: >-
      Finalized typed evaluation-to-orchestration handoff for production planning; carries canonical next action,
      canonical question payload, AIRD deltas, confidence, top-gap metadata, readiness, and explicit block reason
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PLANNING-WORKSPACE-PREFLIGHT-SERVICE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningWorkspacePreflightService.java
    role: >-
      Workspace-only preflight before silent synthesis; repo materialization failures are not planning gaps and do not use clarification merge
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CLARIFICATION-PROJECTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/ClarificationProjection.java
    role: >-
      Immutable carrier for one canonical clarification ask projected to spreads and ledger; production builds via
      ClarificationProjection.fromSelection(CanonicalClarificationSelection) including canonicalGapId (not a rank field)
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-CANONICAL-CLARIFICATION-SELECTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/CanonicalClarificationSelection.java
    role: >-
      Records which coordinator gap (if any) was selected for ASK_USER in canonical_v1, including merge-target paths for ledger reconciliation
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-CONFIDENCE-BREAKDOWN
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningConfidenceBreakdown.java
    role: Structured evaluation-confidence factors persisted as a JSON-friendly snapshot on FeaturePlanState
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-GAP-ASK-COUNTS
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningGapAskCounts.java
    role: Per-gap surfaced-ask tallies persisted as planningGapAskCountsJson on FeaturePlanState
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-CANONICAL-MERGE-TARGET-PATHS
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/CanonicalMergeTargetPaths.java
    role: >-
      Derives UnresolvedItem paths used when merging operator replies to close the active canonical coordinator gap
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-MATERIAL-FINGERPRINT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningMaterialFingerprint.java
    role: Fingerprint helpers for draft/exploration material-change detection in planning cycles
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CLARIFICATION-TEXT-SIMILARITY
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/ClarificationTextSimilarity.java
    role: >-
      Paraphrase-style similarity for duplicate clarification detection and ledger continuity
    requires:
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW
  - id: ASSET-PLANNING-MATERIAL-CYCLE-PACING
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningMaterialCyclePacing.java
    role: >-
      Deterministic pacing/persistence helper for canonical decision spread keys; live routing consumes evaluation output
      instead of independent clarification heuristics
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PLANNING-CANONICAL-DECISION-SUPPORT
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningCanonicalDecisionSupport.java
    role: >-
      Canonical decision normalizer/projection helper for planning; builds persisted PlanningCanonicalDecision from
      evaluation output and critique outcomes, derives canonical stage/interaction state, and projects routing keys for YAML
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PLAN-STRUCTURED-MATERIAL-DIAGNOSTICS
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planreview/PlanStructuredMaterialDiagnostics.java
    role: >-
      Structured material gap diagnostics (first question / has-gaps) for synthesis and readiness
    requires:
      - REQ-WORKFLOW-001
      - REQ-WORKFLOW-002
    feature_ids:
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PLANNING-SYNTHESIS-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/PlanningSynthesisAction.java
    role: Internal synthesis-pacing enum for ASK_USER / ASSUME_AND_CONTINUE / READY_FOR_PACKET / CONTINUE_SYNTHESIS / BLOCK; v2 graph post-evaluation transitions use planningNextPhase derived from planningNextAction
    requires:
      - REQ-WORKFLOW-001
