    kind: source
    path: src/main/java/com/vinekeepers/workflow/planning/CanonicalPlanningGap.java
    role: >-
      Canonical uncertainty record (gapId, kind, artifactPath, mergeTargetPath, blocking/branching flags, questionSeed)
