    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-CLOUD-TRANSPORT-RESPONSE
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudTransportResponse.java
    role: Transport response model used by Cursor Cloud adapter calls
    requires:
      - REQ-LUNA-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
