    feature_ids:
      - FEAT-CURSOR-GATHERING
  - id: ASSET-CURSOR-ADAPTER-IMPL
    kind: source
    path: src/main/java/com/vinekeepers/core/cursor/CursorCloudAdapterImpl.java
    role: >-
      Cursor Cloud Agents API HTTP client implementation (env-based config); robust non-2xx error parsing
      (extractErrorMessageAndCode for error string, nested error.message/code, top-level message, plain text, empty);
