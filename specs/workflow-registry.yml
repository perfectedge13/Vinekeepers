      codeChange) or fallback; normalizeChannelName for Discord-safe lowercase
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-POST-CHANNEL-MESSAGE-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/PostChannelMessageAction.java
    role: >-
      Workflow action to post a message to a Discord channel; send target = deliveryChannelId or channelId (bind then
      state); treat THREAD_CREATE_FAILED sentinel as fallback to channelId; interpolation from merged map (state then
      bind); lifecycleBotName from bind for content
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-PROVISION-BOT-INSTANCE-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/ProvisionBotInstanceAction.java
    role: >-
      Workflow action to provision a runtime bot instance (e.g. Arrietty) bound to a channel; instance stored under
      generic prefix bot_instance:{instanceId}
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CREATE-LIFECYCLE-CONTEXT-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/CreateLifecycleContextAction.java
    role: >-
      Workflow action to create and store a lifecycle context for a run; bind precedence (state then bind, bind
      overrides); reads optional deliveryChannelId from bind/state (excludes THREAD_CREATE_FAILED sentinel)
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-CREATE-THREAD-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/CreateThreadAction.java
    role: >-
      Workflow action to create a Discord thread under parent channel; bind channelId, threadName, optional contextId.
      When channelId has a lifecycle context, uses that context's bot gateway (owner gateway, e.g. Arrietty); else
      default gateway. Blank or missing channelId returns THREAD_CREATE_FAILED; no LifecycleContextStore update on
      failure. After success, when contextId in bind/state, updates LifecycleContextStore via setDeliveryTargetId
      (contextId, threadId). Returns thread id or THREAD_CREATE_FAILED; storeIn (e.g. deliveryChannelId) stores
      result in state
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
  - id: ASSET-LAUNCH-CURSOR-RUN-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/workflow/actions/LaunchCursorRunAction.java
    role: >-
      Workflow action to launch a Cursor cloud run and register run record; passes optional deliveryChannelId into
      LifecycleRunRecord; ack/status to Discord (e.g. launching) and directs user to lifecycle room
    requires:
      - REQ-LUNA-001
      - REQ-WORKFLOW-001
    feature_ids:
      - FEAT-CURSOR-GATHERING
      - FEAT-WORKFLOW-STEPS
requirements:
  - id: REQ-WORKFLOW-001
    title: Workflow state machine and config-driven runners
    statement: >-
      Workflow<S> handle(event, context, state) returns WorkflowResult<S>; WorkflowRunner runs a workflow for an event
      and returns WorkflowRunResult with reply, waiting, completion, and error state. WorkflowRunnerFactory creates
      runners from config workflow type and params (stub, configured), and configurable workflows can pause for later
      events using session key strategies.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - Workflow interface and WorkflowResult model exist
        - WorkflowRunner interface and runner.runResult(event, stateStore, botId) used by engine
        - WorkflowRunnerFactory creates runner by type (stub, configured)
        - StubWorkflow/StubState and StubWorkflowRunner used when no custom workflow
        - Configurable workflows support prompt_for_field and capture_field steps for conversational pause/resume
        - Configurable workflow state records waiting field, pending prompt, completion, and error status
        - SessionKeyStrategies resolve channel, channel_user, or thread conversation keys for persisted workflow state
        - CallActionStep can invoke either a registered workflow action or a ToolRunner-backed tool
        - call_action step supports optional model value and forwards it to action bind args as model
        - >-
          capture_field step supports optional trimAndLower (boolean); when true, captured text is trimmed and
