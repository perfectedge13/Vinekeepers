schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-24T18:00:00Z"

project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"

enums:
  status: [draft, active, deprecated]
  priority: [low, medium, high]
  type: [functional, non-functional, constraint]
  handling_strategy: [fail, retry, skip]
  asset_kind: [source, config, spec, workflow]
  dependency_kind: [library, tool, service]
  dependency_scope: [build, test, runtime]
  dependency_criticality: [optional, required]

dependencies:
  items:
    - id: DEP-SNAKEYAML
      kind: library
      name: snakeyaml
      scope: runtime
      criticality: required
      spec: org.yaml:snakeyaml
      install_hint: Maven dependency
      used_by_requirements: [REQ-CONFIG-001]
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements: [REQ-CORE-001, REQ-ENV-001, REQ-CORE-002, REQ-CORE-003, REQ-CONFIG-001, REQ-BOT-001, REQ-BOT-002, REQ-EVENTS-001, REQ-STATE-001, REQ-TOOLS-001, REQ-REASONER-001, REQ-WORKFLOW-001, REQ-WORKFLOW-002, REQ-LUNA-001, REQ-GADGET-001]

assets:
  - id: ASSET-CONFIG-LOADER
    kind: source
    path: src/main/java/com/vinekeepers/config/ConfigLoader.java
    role: >-
      Load bot definitions, routing, workflows; dual-read identities.discord (tokenEnvKey, handlesOwnedSpaces) and legacy
      top-level keys; normalize to ConnectorIdentity per connector; Discord mention filters from YAML are matched by Router
      against normalized mention tokens (REQ-BOT-001)
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-BOTS-YAML
    kind: config
    path: config/bots.yaml
    role: >-
      Bot definitions YAML (Luna routing, Discord mention activation, optional discordAuthors;
      preferred identity shape identities.discord.tokenEnvKey, handlesOwnedSpaces, and optional identities.discord.ingress (messages, interactions);
      legacy top-level discordTokenEnvKey/handlesOwnedSpaces deprecated but still accepted; defaultDiscordTokenEnvKey at root is
      retained transitional; lifecycleBotName in step bind; Arrietty production workflowRef arrietty_room_v2 runs hydrate_planning_session,
      ensure_repo_workspace, optional prep_planning_repo_grounding (legacy_action) for Qdrant/Parquet planning RAG, spread_plan_workspace_signals, and the named planning lifecycle phases directly in the v2 graph;
      v2 templates allowlist includes planningIngressMode, planningAutonomousFirstPassCompleted, planningRepoEvidenceJson, canonicalPlanningIntakeStage;
      create_thread storeIn deliveryChannelId; capture_field trimAndLower;       done step e.g. "Launching now. See <#{{channelId}}>.";
      optional workflow steps provision_room_participants (bind orchestratorConfiguredBotId or equivalent resolution) and initialize_feature_room_state for coordinator-owned feature rooms;
      feature-room planning uses Arrietty as the sole room participant/coordinator with sessionKeyStrategy thread for per-thread session keys;
      arrietty_room_v2 launch success path ends with one post_channel_message plus done (no redundant duplicate terminal pair);
      coordinator posts in arrietty_room_v2 use refreshed copy (workspace kickoff, draft-blocked with {{planningRoomCycleErrorUserMessage}}
      for humanized cycle errors plus depth reason, pre-launch checklist vs full packet framing, lifecycle launch line);
      operator DevOps bot workflowRef devops_deploy and routing discordChannels for ops channel id at top of file)
    requires: [REQ-CONFIG-001, REQ-LUNA-001, REQ-GADGET-001]
    feature_ids: [FEAT-CONFIG, FEAT-CURSOR-GATHERING, FEAT-DEVOPS-GADGET]
  - id: ASSET-BOT-CONFIG
    kind: source
    path: src/main/java/com/vinekeepers/config/BotConfig.java
    role: Bot configuration model
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-BOT-DEFINITION
    kind: source
    path: src/main/java/com/vinekeepers/bot/BotDefinition.java
    role: Bot composition (persona, model, workflow, tools, runtime conversation settings); connector identity via getConnectorIdentity(connectorId)
    requires: [REQ-BOT-003]
    feature_ids: [FEAT-BOT]
  - id: ASSET-BOT-CATALOG
    kind: source
    path: src/main/java/com/vinekeepers/bot/BotCatalog.java
    role: Thread-safe snapshot of loaded bots; Bootstrap.replaceAll after ConfigLoader.buildBots; workflow actions resolve persona display names without hardcoded bot ids
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-BOT-SCOPED-STATE-KEYS
    kind: source
    path: src/main/java/com/vinekeepers/state/BotScopedStateKeys.java
    role: Bot-scoped StateStore key helpers (vk:lastRepo:{botId}:{authorId}); legacy read of luna:lastRepo:{authorId}; branch prefix sanitization for Cursor launches
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-WORK-PROFILES-YAML
    kind: config
    path: config/work-profiles.yaml
    role: >-
      Declarative work profiles (profiles map) defining artifacts, sections, required fields, optional field promptHint strings
      for coordinator missing-field prompts (PlanningPromptFormatter), optional or default readiness.anyOfGroups,
      optional packetQuality.forbiddenSubstrings, and field-level richness keys for GenericReadinessEvaluator; default profile
      software_feature_planning includes a readiness gate for review-packet substance
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-WORK-PROFILE-LOADER
    kind: source
    path: src/main/java/com/vinekeepers/profile/WorkProfileLoader.java
    role: >-
      Load work-profiles.yaml into WorkProfileRegistry; parses profile readiness.anyOfGroups, ReadinessPathRule rows,
      packetQuality.forbiddenSubstrings, deliberation.boundedClarificationChoices, deliberation.inferBoundedChoiceFromOrInText, and field-level minWords,
      maxEchoOverlapWithRequest, echoWordSlack, skipReadinessIfBlank, readinessChecks; parses coordinatorClarification.mode/gaps plus optional
      coordinatorClarification.engine knobs (maxClarificationTurns, repoEvidenceAskThreshold, clarificationAskPriorityThreshold, allowAssumeAndContinue, allowClarificationAfterCritique)
    requires: [REQ-CONFIG-001]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-COORDINATOR-CLARIFICATION-ENGINE-POLICY
    kind: source
    path: src/main/java/com/vinekeepers/profile/CoordinatorClarificationEnginePolicy.java
    role: Typed defaults and YAML-backed policy for post-draft clarification budgets, repo-evidence ask threshold, assume/defer, and critique re-entry
    requires: [REQ-CONFIG-001, REQ-WORKFLOW-002]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-READINESS-PATH-RULE
    kind: source
    path: src/main/java/com/vinekeepers/profile/ReadinessPathRule.java
    role: Declarative readiness constraint on artifact/section/field path (loaded from work profile YAML)
    requires: [REQ-CONFIG-001, REQ-WORKFLOW-002]
    feature_ids: [FEAT-CONFIG]
  - id: ASSET-READINESS-ANY-OF-GROUP
    kind: source
    path: src/main/java/com/vinekeepers/profile/ReadinessAnyOfGroup.java
    role: OR bundle of ReadinessPathRule entries for narrative-style alternate field satisfaction
    requires: [REQ-CONFIG-001, REQ-WORKFLOW-002]
    feature_ids: [FEAT-CONFIG]

requirements:
  - id: REQ-CONFIG-001
    title: Load bot config from YAML
    statement: ConfigLoader loads bot definitions, routing, and workflows from YAML; BotConfig models the structure. Dual-read identities.discord (tokenEnvKey, handlesOwnedSpaces) and legacy top-level discordTokenEnvKey/handlesOwnedSpaces (deprecated); normalize into ConnectorIdentity per connector; new shape preferred, new wins if both present. defaultDiscordTokenEnvKey at root is retained transitional. Workflow block, conversationMode, sessionKeyStrategy, routing filters (discordTrigger, discordMention, discordAuthors, discordChannels, discordChannelsExclude) parsed into runtime configuration.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - ConfigLoader loads YAML and returns bot configs
        - BotConfig maps to BotDefinition structure
        - ConfigLoader parses workflow.type and workflow.params from YAML into BotDefinition
        - ConfigLoader parses workflows map and optional bot runtime options from YAML into BotConfig and BotDefinition
        - ConfigLoader parses routing filters including optional discordTrigger, discordMention, discordAuthors (list of string ids or usernames), discordChannels, and optional discordChannelsExclude (Discord channel ids where the rule must not match) from YAML
        - ConfigLoader parses identities.discord (tokenEnvKey, handlesOwnedSpaces, optional ingress) and legacy discordTokenEnvKey/handlesOwnedSpaces; builds ConnectorIdentity per connector and passes to BotDefinition
        - BotConfig retains defaultDiscordTokenEnvKey as retained transitional root-level (when bot has no identities.discord.tokenEnvKey)
        - Workflow step bind keys (e.g. lifecycleBotName, deliveryChannelId, target, targetChannelId) and content with {{key}} interpolation are supported in step config; step action create_thread with storeIn (e.g. deliveryChannelId) is supported
        - >-
          provision_room_participants resolves the orchestrator configured/template bot id from bind or state (orchestratorConfiguredBotId,
          templateBotId, valid instanceId RuntimeBotInstance template, or __botId) without a hardcoded default bot id in Java
        - >-
          workflow.params may set deferredInteractionAckPlanningCoordinator (boolean) so VinekeepersEngine uses planning-style deferred
          Discord interaction follow-up copy; legacy workflowRef prefix arrietty_room* remains supported for migration
        - >-
          Coordinator kickoff for arrietty_room_v2 must fail visibly only when the synthetic kickoff neither returns a
          reply nor records a successful kickoff side effect (for example the coordinator_intake_bootstrap thread post);
          blank or erroring runs without either signal still trigger the fallback internal-error notice instead of staying silent
        - >-
          ensure_repo_workspace optional Discord progress lines use workflow __botId or bind repoProgressAsBotId / repoProgressPersonaName
          for explicit sender and display prefix (Bootstrap supplies BotCatalog for persona lookup)
        - >-
          Cursor launch and GitHub repo choice last-repo keys use vk:lastRepo:{botId}:{authorId} when __botId is present, with legacy
          read/write fallback to luna:lastRepo:{authorId} when bot id is absent
        - Feature-room planning coordinator is the configuredBotId on the sole ORCHESTRATOR participant with sessionKeyStrategy thread for per-thread workflow session keys
        - >-
          Workflow map arrietty_room_v2 declares workflowSchema v2 with explicit ingress, drafting, clarification, packet, critique,
          approval, and launch phases; no production capability delegates to a sibling legacy workflow
        - Optional config/work-profiles.yaml defines work profiles (SnakeYAML); WorkProfileLoader loads profiles into WorkProfileRegistry for Bootstrap and planning actions
        - >-
          Work profiles may declare readiness.anyOfGroups and per-field richness keys (minWords, readinessChecks, echo overlap);
          WorkProfileDefinition.hasDeclarativeReadiness drives GenericReadinessEvaluator when evaluating packet depth
        - >-
          Work profile field promptHint (when present) is woven into PlanningPromptFormatter required-field coordinator prompts so
          operators see concrete guidance instead of only internal labels
        - >-
          Work profile coordinatorClarification (canonical_v1 gap rules and mode) is the config contract for which missing facts
          block Arrietty planning; optional coordinatorClarification.engine supplies clarification turn budget, repo-evidence ask threshold,
          assume-and-continue, and critique re-entry flags; runtime behavior pairs gaps with ClarificationEngineAssessor, ledger reconciliation,
          and strict single-question, non-meta clarification UX; gap questionTemplate values that read as generic meta or completeness prompts
          are ignored at evaluation time, and profile gaps may require explicit model-routing choices such as per-step vs step-type overrides
        - >-
          bots.yaml arrietty_room_v2 rs_post_draft branches only on planningPostDraftAction (fail-closed default planning_blocked);
          cap_post_draft_blocked posts planningPostDraftNoticeMarkdown for AUTONOMOUS_REDRAFT; blocked-thread templates interpolate
          planningCycleUserVisibleFailure for planning-room failures, and that key must be present in the safe-template allowedKeys list;
          orchestrator templates interpolate planningRoomCycleErrorUserMessage
          alongside planning depth fields where relevant, and pre-launch review copy stays a short
          checklist when the full planning packet is already in-thread
        - >-
          arrietty_room_v2 planning ingress YAML may declare legacy_action prep_planning_repo_grounding after ensure_repo_workspace
          to enable Parquet-backed embedding cache and Qdrant retrieval (planningRag* workflow spreads) without blocking the graph when RAG is disabled or misconfigured
        - >-
          Bootstrap loadConfig sets Router.setPlanningCoordinatorFallbackBotId to the first bot whose workflow type is
          arrietty_room_v2 and handlesOwnedSpaces is true, else the first handlesOwnedSpaces bot, so active planning intake routing
          can recover when coordinator metadata is missing from evicted room state
      examples: []
    traceability:
      assets:
        - ASSET-CONFIG-LOADER
        - ASSET-BOT-CONFIG
        - ASSET-BOTS-YAML
        - ASSET-BOT-DEFINITION
        - ASSET-WORK-PROFILES-YAML
        - ASSET-WORK-PROFILE-LOADER
        - ASSET-COORDINATOR-CLARIFICATION-ENGINE-POLICY
        - ASSET-READINESS-PATH-RULE
        - ASSET-READINESS-ANY-OF-GROUP
      symbols: []
    validation:
      tests:
        - id: UNIT-CONFIG-LOADER
          title: ConfigLoaderTest
          intent: Verify YAML config loading
          testClass: com.vinekeepers.config.ConfigLoaderTest
          preconditions: []
        - id: UNIT-CONFIG-LOADER-DISCORD-MENTION
          title: ConfigLoaderTest
          intent: Verify discordMention routing filters are parsed from YAML and produce a matching router
          testClass: com.vinekeepers.config.ConfigLoaderTest
          testMethod: buildRouterParsesDiscordMentionRouting
          preconditions: []
        - id: UNIT-CONFIG-LOADER-DISCORD-AUTHORS
          title: ConfigLoaderTest
          intent: Verify discordAuthors routing filter is parsed from YAML and router matches by author/actorUsername
          testClass: com.vinekeepers.config.ConfigLoaderTest
          testMethod: buildRouterParsesDiscordAuthorsRouting
          preconditions: []
        - id: UNIT-CONFIG-LOADER-HANDLES-OWNED-SPACES-TRUE
          title: ConfigLoaderTest
          intent: Verify handlesOwnedSpaces true is parsed from bot YAML into BotDefinition
          testClass: com.vinekeepers.config.ConfigLoaderTest
          testMethod: buildBotsParsesHandlesOwnedSpacesTrue
          preconditions: []
        - id: UNIT-CONFIG-LOADER-HANDLES-OWNED-SPACES-ABSENT-FALSE
          title: ConfigLoaderTest
          intent: Verify handlesOwnedSpaces absent in bot YAML yields false on BotDefinition
          testClass: com.vinekeepers.config.ConfigLoaderTest
          testMethod: buildBotsParsesHandlesOwnedSpacesAbsentAsFalse
          preconditions: []
        - id: UNIT-ARRIETTY-V2-WORKFLOW-YAML
          title: ArriettyV2WorkflowYamlTest
          intent: >-
            Verify arrietty_room_v2 YAML shape, planningPostDraftAction-only post-assess branching, and coordinator template contracts
          testClass: com.vinekeepers.config.ArriettyV2WorkflowYamlTest
          preconditions: []

features:
  - id: FEAT-CONFIG
    slug: config
    title: Bot config from YAML
    domain_slug: config
    doc_path: features/domain/config/config.md
    summary: ConfigLoader loads bot definitions from YAML; BotConfig models the structure.
    requirement_ids: [REQ-CONFIG-001]
    asset_ids:
      - ASSET-CONFIG-LOADER
      - ASSET-BOT-CONFIG
      - ASSET-BOTS-YAML
      - ASSET-BOT-DEFINITION
      - ASSET-WORK-PROFILES-YAML
      - ASSET-WORK-PROFILE-LOADER
      - ASSET-COORDINATOR-CLARIFICATION-ENGINE-POLICY
      - ASSET-READINESS-PATH-RULE
      - ASSET-READINESS-ANY-OF-GROUP
    status: active
