schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-23T12:00:00Z"

project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"

enums:
  status: [draft, active, deprecated]
  priority: [low, medium, high]
  type: [functional, non-functional, constraint]
  handling_strategy: [fail, retry, skip]
  asset_kind: [source, config, spec, workflow]
  dependency_kind: [library, tool, service]
  dependency_scope: [build, test, runtime]
  dependency_criticality: [optional, required]

dependencies:
  items:
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements: [REQ-CORE-001, REQ-ENV-001, REQ-CORE-002, REQ-CORE-003, REQ-CONFIG-001, REQ-BOT-001, REQ-BOT-002, REQ-EVENTS-001, REQ-STATE-001, REQ-TOOLS-001, REQ-REASONER-001, REQ-WORKFLOW-001, REQ-LUNA-001]

assets:
  - id: ASSET-ENV-LOADER
    kind: source
    path: src/main/java/com/vinekeepers/env/EnvLoader.java
    role: Load .env file into system properties
    requires: [REQ-ENV-001]
    feature_ids: [FEAT-ENV]
  - id: ASSET-ENV
    kind: source
    path: src/main/java/com/vinekeepers/env/Env.java
    role: Read config from system properties
    requires: [REQ-ENV-001]
    feature_ids: [FEAT-ENV]
  - id: ASSET-APP
    kind: source
    path: src/main/java/com/vinekeepers/VinekeepersApp.java
    role: Application entrypoint; loads .env and bootstraps engine
    requires: [REQ-CORE-002, REQ-ENV-001]
    feature_ids: [FEAT-CORE, FEAT-ENV]

requirements:
  - id: REQ-ENV-001
    title: Load .env at startup
    statement: The application loads a .env file from the project root into system properties at startup and provides Env.get(key, default) for configuration access.
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - EnvLoader.load(".env") is called before bootstrap
        - Env.get(key, default) returns value from system properties or default
        - >-
          Optional repo workspace keys (VINEKEEPERS_REPO_WORKSPACE_ROOT, VINEKEEPERS_ALLOW_GIT_CLONE, GIT_EXECUTABLE) are
          read via Env when RepoWorkspaceService is constructed
        - >-
          Optional OpenAI-compatible planning keys (OPENAI_API_KEY, OPENAI_BASE_URL or OPENAI_API_BASE_URL,
          OPENAI_PLANNING_TIMEOUT_MS or OPENAI_HTTP_REQUEST_TIMEOUT_MS, OPENAI_PLANNING_MODEL) are read via Env in OpenAiChatClient
        - >-
          Optional engine event executor keys (VINEKEEPERS_ENGINE_EVENT_THREADS default 1,
          VINEKEEPERS_ENGINE_EVENT_QUEUE_CAPACITY default 8000) are read via Env in EngineEventExecutorFactory
        - >-
          Optional OpenAI planning observability keys OPENAI_PLANNING_DISCORD_PROGRESS (default true; false disables
          **Update:** Discord posts for planning OpenAI calls), OPENAI_LOG_PLANNING_BODIES (default true; false suppresses
          truncated system/user/assistant body logs while still logging failure outcomes), and OPENAI_LOG_BODY_MAX_CHARS
          (default 4096, clamped between 256 and 32768) are read via Env in OpenAiChatClient and OpenAiPlanningProgressPoster
        - >-
          Optional planning RAG keys: VINEKEEPERS_PLANNING_RAG (default true; false skips RAG prep), QDRANT_URL or
          VINEKEEPERS_QDRANT_URL, optional QDRANT_API_KEY / VINEKEEPERS_QDRANT_API_KEY, QDRANT_COLLECTION (default
          vinekeepers_planning_grounding), OPENAI_EMBEDDING_MODEL (default text-embedding-3-small),
          OPENAI_EMBEDDING_DIMENSIONS (default 1536), PLANNING_RAG_EMBED_BATCH_SIZE, PLANNING_RAG_MAX_CHUNKS,
          PLANNING_RAG_TOP_K; read via Env in PlanningRagConfig, QdrantPlanningClient, and PlanningRepoGroundingService;
          missing or invalid Qdrant/OpenAI pairing leaves planning non-RAG without failing the workflow
      examples: []
    traceability:
      assets: [ASSET-ENV-LOADER, ASSET-ENV, ASSET-APP]
      symbols: []
    validation:
      tests:
        - id: UNIT-ENV-LOADER
          title: EnvLoader loads and Env reads
          intent: Verify .env loading and Env.get behavior
          testClass: com.vinekeepers.env.EnvLoaderTest
          preconditions: []

features:
  - id: FEAT-ENV
    slug: env
    title: Environment and .env loading
    domain_slug: env
    doc_path: features/domain/env/env.md
    summary: Load .env at startup and provide Env.get(key, default) for configuration access.
    requirement_ids: [REQ-ENV-001]
    asset_ids: [ASSET-ENV-LOADER, ASSET-ENV, ASSET-APP]
    status: active
