requirements:
  - id: REQ-STATE-001
    title: State store for bot workflow state
    statement: StateStore persists and loads per-bot, per-conversation workflow state (structured state objects). FeatureRoomStateStore indexes feature room rows for routing and delivery; lookups by context, room channel, intake thread, feature id, and delivery target are null-safe and skip blank keys; coordinator resolution for room-channel routing uses participant primaryCoordinator when set, otherwise falls back to the ORCHESTRATOR participant.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - StateStore.load(botId, conversationKey) returns state or empty
        - StateStore.save persists state for bot and conversation
        - FeatureRoomStateStore.getParticipantBotIds returns participant configured bot ids in stable PlanningRole order regardless of list order in state
        - FeatureRoomStateStore.getByContextId and getByRoomChannelId return empty for null or blank keys; put(null) does not store; put skips secondary indexes when optional keys are null or blank
        - FeatureRoomStateStore.resolveCoordinatorConfiguredBotId returns the participant marked primaryCoordinator when present, else the ORCHESTRATOR participant when present, else empty for null state or empty participants
        - FeaturePlanStateStore stores FeaturePlanState by contextId and secondary indexes (featureId, roomChannelId, intakeThreadId)
        - RepoWorkspaceService resolves absolute local git directories and records branch/commit; optional clone when env allows; creates VINEKEEPERS_REPO_WORKSPACE_ROOT when missing; deletes existing per-context workspace directory before shallow clone when present; fails closed if stale directory cannot be removed; logs milestones and supports optional progress callback; surfaces git output snippet on clone failure
        - >-
          FeaturePlanState repo workspace fields (repoRef, repoLocalPath, repoWorkspaceStatus, repoAccessNotes, workspace id) are the
          persisted inputs for spread_plan_workspace_signals and for optional prep_planning_repo_grounding (checkout root + ref/branch scope for Parquet cache and Qdrant payload filters)
        - FeaturePlanState carries optional profileId and artifacts map (per-artifact section/field values) alongside legacy planning fields; with* methods preserve profileId and artifacts
        - >-
          FeaturePlanState holds governance lists (PlanAssumption, PlanIssue, PlanRisk, PlanDecision, unresolvedQuestions),
          packet delivery metadata after a successful thread post, critique lifecycle status, enriched PlanCritiqueSnapshot (rubric scores,
          blocking counts), and PlanConfidence with numeric confidenceScore, confidenceReasons (including a known-vs-unknown signal summary),
          structuredKnownFactCount, materialUnknownCount, and capped materialUnknownLabels for approval gating and audit; derive_plan_governance normalizes gap-derived
          gap:* issues, synthetic art-risk-* / art-dec-* rows from artifact text, and merged unresolved question lines for Discord packet tables;
          unresolvedQuestions is the canonical persisted basis for “open questions” in coordinator UX (versus ad-hoc clarification filler);
          derive_plan_governance and packet formatters filter generic/meta or internal-looking lines so displayed open questions reflect
          substantive unresolved state only
        - >-
          packetPostedAt on FeaturePlanState is the canonical persisted signal that the planning packet was posted;
          PlanReadinessEvaluator treats it as authoritative for "packet posted" when workflow state map is omitted; workflow
          spreads planningPacketPosted / planningPacketPostedVersion are a secondary hint only when the evaluator is given workflow state
        - >-
          FeaturePlanState carries PlanningIntakeStage, intake kickoff post version/fingerprint, and optional
          planningOrchestrationFailureReason for terminal intake failures; withPlanningIntakeStage / withIntakeKickoffPosted /
          withPlanningOrchestrationFailure update the canonical intake spine
        - >-
          FeaturePlanState also persists planningCanonicalDecisionJson plus lastPosted/lastAsked decision ids and a
          material-state-change fingerprint so post-draft and post-critique routing can be verified against one durable canonical decision
        - >-
          PlanningCyclePipeline may advance FeaturePlanState to PlanningIntakeStage.CLARIFYING when PlanningPostDraftGovernor
          resolves to ASK_ONE_QUESTION and the plan was not already in CLARIFYING
        - >-
          Planning domain includes DiscoveryGap, DiscoveryQuestion, DiscoveryAgenda, DiscoveryFinding, and PlanningProposal models
          for structured discovery and proposal-driven planning (JSON-serializable; workflow state for proposals until confirm or auto-apply)
        - >-
          Structured discovery over repeatable sections consolidates required-field gaps to one DiscoveryGap per missing field id
          across rows; workflow session flag planningAutonomousFirstPassCompleted (set after a successful planning room cycle) gates
          whether REQUIRED_FIELD gaps are emitted alongside workspace BLOCKER gaps
        - >-
          FeaturePlanState.autonomousPlanningPassCompleted, clarificationTurnsCompleted, clarificationOutcomeHistory, and
          clarificationCoordinatorLedgerJson persist the
          post-draft clarification engine: autonomous cycle completion, user clarification turn budget accounting, short audit lines
          for assume/defer/block outcomes, and a JSON snapshot of assessed gaps / next ask; ClarificationResolutionDecision models the assessor outcomes used before a question is shown
        - >-
          state.workflow package holds generic UnresolvedItem / UnresolvedItemStatus models for config-driven clarification ledgers
          (used by workflow engine features; JSON-serializable)
        - >-
          Workflow session may persist PlanningPostDraftGovernor material baselines and revision fingerprint keys
          (planningMaterialBaselineRepoEvidenceHash, planningMaterialBaselineAssumptionCount, planningMaterialBaselineCritiqueBlockingCount,
          planningMaterialBaselineDraftFingerprint, planningLastNonPostingRevisionSituation) so autonomous redrafts are gated on real input change
        - >-
          FeaturePlanState carries optional coordinatorConfiguredBotId and planner recovery fields (planningFailureCategory,
          planningFailurePhase, planningRecoverableDraftAvailable, planningLastRecoveryHint) updated when post-draft handling
          records a blocking synthesis classification
        - >-
          PlanningIntakeBindingResolver resolves intake/plan binding from FeatureRoomStateStore and/or FeaturePlanStateStore
          (intake thread id, room channel with active intake, parent thread under room); coordinator id prefers room
          primary/ORCHESTRATOR resolution then plan coordinatorConfiguredBotId
      examples: []
    traceability:
      assets: [ASSET-STATE-STORE, ASSET-LUNA-STATE, ASSET-PLANNING-ROLE, ASSET-ROOM-PARTICIPANT, ASSET-FEATURE-ROOM-STATE, ASSET-FEATURE-ROOM-STATE-STORE, ASSET-FEATURE-PLAN-STATE, ASSET-CLARIFICATION-RESOLUTION-DECISION, ASSET-PLANNING-INTAKE-STAGE, ASSET-PLANNING-FAILURE-CATEGORY, ASSET-PLANNING-INTAKE-BINDING-RESOLVER, ASSET-DISCOVERY-GAP, ASSET-DISCOVERY-QUESTION, ASSET-DISCOVERY-AGENDA, ASSET-DISCOVERY-FINDING, ASSET-PLANNING-PROPOSAL, ASSET-PLAN-CRITIQUE-FINDING, ASSET-PLAN-CRITIQUE-SNAPSHOT, ASSET-PLAN-READINESS-STATUS, ASSET-PLAN-APPROVAL-STATUS, ASSET-PLAN-ASSUMPTION, ASSET-PLAN-ISSUE, ASSET-PLAN-RISK, ASSET-PLAN-DECISION, ASSET-PLAN-CONFIDENCE, ASSET-PLAN-CRITIQUE-RUBRIC-SCORES, ASSET-PLAN-CRITIQUE-LIFECYCLE-STATUS, ASSET-FEATURE-PLAN-STATE-STORE, ASSET-UNRESOLVED-ITEM, ASSET-UNRESOLVED-ITEM-STATUS, ASSET-REPO-WORKSPACE-STATE, ASSET-REPO-WORKSPACE-STATE-STORE, ASSET-DEFAULT-REPO-REF-RESOLVER, ASSET-REPO-WORKSPACE-PROGRESS-PHASE, ASSET-REPO-WORKSPACE-PROGRESS-CALLBACK, ASSET-REPO-WORKSPACE-SERVICE, ASSET-WORK-PROFILE-REGISTRY, ASSET-ARTIFACT-STATE-FACTORY, ASSET-BIND-PLACEHOLDER-RESOLVER]
      symbols: []
    validation:
      tests:
        - id: UNIT-STATE-STORE
          title: StateStoreTest
          intent: Verify state load/save and key scoping
          testClass: com.vinekeepers.state.StateStoreTest
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE
          title: FeatureRoomStateStoreTest
          intent: Verify FeatureRoomStateStore put, getByContextId, getByRoomChannelId, getByDeliveryTargetId
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-PARTICIPANT-ORDER
          title: FeatureRoomStateStoreTest
          intent: Verify getParticipantBotIds returns participant bot ids in stable PlanningRole order
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: getParticipantBotIds_returnsStableOrderFromParticipantList
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-PARTICIPANT-ORDER-WRONG-LIST
          title: FeatureRoomStateStoreTest
          intent: Verify getParticipantBotIds sorts by role when participants list is not in role order
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
