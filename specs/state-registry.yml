features:
  - id: FEAT-STATE
    slug: state
    title: State store for workflow state
    domain_slug: state
    doc_path: features/domain/state/state.md
    summary: >-
      StateStore persists and loads per-bot, per-conversation workflow state; state.workflow holds generic UnresolvedItem
      models for config-driven clarification ledgers (REQ-WORKFLOW-002); planning package includes the typed canonical
      decision model (PlanningCanonicalDecision / PlanningCanonicalNextAction / PlanningInteractionState), PlanningFailureCategory,
      and PlanningIntakeBindingResolver for durable recovery metadata and intake-thread binding when room state is missing.
    requirement_ids: [REQ-STATE-001]
    asset_ids: [ASSET-STATE-STORE, ASSET-LUNA-STATE, ASSET-PLANNING-ROLE, ASSET-ROOM-PARTICIPANT, ASSET-FEATURE-ROOM-STATE, ASSET-FEATURE-ROOM-STATE-STORE, ASSET-FEATURE-PLAN-STATE, ASSET-PLANNING-CANONICAL-DECISION, ASSET-PLANNING-CANONICAL-NEXT-ACTION, ASSET-PLANNING-INTERACTION-STATE, ASSET-CLARIFICATION-RESOLUTION-DECISION, ASSET-PLANNING-INTAKE-STAGE, ASSET-PLANNING-FAILURE-CATEGORY, ASSET-PLANNING-INTAKE-BINDING-RESOLVER, ASSET-PLAN-ASSUMPTION, ASSET-PLAN-ISSUE, ASSET-PLAN-RISK, ASSET-PLAN-DECISION, ASSET-PLAN-CONFIDENCE, ASSET-PLAN-CRITIQUE-RUBRIC-SCORES, ASSET-PLAN-CRITIQUE-LIFECYCLE-STATUS, ASSET-FEATURE-PLAN-STATE-STORE, ASSET-UNRESOLVED-ITEM, ASSET-UNRESOLVED-ITEM-STATUS, ASSET-REPO-WORKSPACE-STATE, ASSET-REPO-WORKSPACE-STATE-STORE, ASSET-DEFAULT-REPO-REF-RESOLVER, ASSET-REPO-WORKSPACE-PROGRESS-PHASE, ASSET-REPO-WORKSPACE-PROGRESS-CALLBACK, ASSET-REPO-WORKSPACE-SERVICE, ASSET-WORK-PROFILE-REGISTRY, ASSET-ARTIFACT-STATE-FACTORY, ASSET-BIND-PLACEHOLDER-RESOLVER]
