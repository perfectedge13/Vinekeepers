schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-19T12:00:00Z"

project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"

enums:
  status: [draft, active, deprecated]
  priority: [low, medium, high]
  type: [functional, non-functional, constraint]
  handling_strategy: [fail, retry, skip]
  asset_kind: [source, config, spec, workflow]
  dependency_kind: [library, tool, service]
  dependency_scope: [build, test, runtime]
  dependency_criticality: [optional, required]

dependencies:
  items:
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements: [REQ-CORE-001, REQ-ENV-001, REQ-CORE-002, REQ-CORE-003, REQ-CONFIG-001, REQ-BOT-001, REQ-BOT-002, REQ-EVENTS-001, REQ-STATE-001, REQ-TOOLS-001, REQ-REASONER-001, REQ-WORKFLOW-001, REQ-LUNA-001]

assets:
  - id: ASSET-STATE-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/StateStore.java
    role: Persist and load bot workflow state
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-ROLE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningRole.java
    role: Enum for feature room planning roles (ORCHESTRATOR, ARCHITECT, AUDITOR, SCRIBE)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-ROOM-PARTICIPANT
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/RoomParticipant.java
    role: Model for a participant in a feature room (role, configuredBotId, runtimeBotInstanceId, displayName, primaryCoordinator)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-FEATURE-ROOM-STATE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/FeatureRoomState.java
    role: State model for a feature room (contextId, featureId, roomChannelId, intakeThreadId, participants, status)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-FEATURE-ROOM-STATE-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/FeatureRoomStateStore.java
    role: Store and resolve feature room state by contextId, roomChannelId, intakeThreadId, featureId, or deliveryTargetId (thread then channel); null/blank keys no-op on lookup; put(null) no-op; getParticipantBotIds returns participant configuredBotIds in deterministic role order (ORCHESTRATOR, ARCHITECT, AUDITOR, SCRIBE); static resolveCoordinatorConfiguredBotId prefers primaryCoordinator flag then ORCHESTRATOR fallback
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-FEATURE-PLAN-STATE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/FeaturePlanState.java
    role: >-
      Canonical structured planning state for a feature room; legacy section lists, sectionStatuses, repo workspace
      linkage fields, profileId, generic artifacts map (ArtifactState per artifact id from work profile), optional
      PlanCritiqueSnapshot, PlanConfidence (readiness + level + notes + computedAt), PlanApproval (status, actorId, at)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-GAP
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryGap.java
    role: >-
      Typed planning gap (id, kind, artifact/section/field, reason, severity, optional userFacingDetail) for structured
      discovery JSON; userFacingDetail carries plain-language prompt text without exposing internal ids
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-QUESTION
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryQuestion.java
    role: Discovery prompt with optional REQUIRED_FIELD apply target for guided loop
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-AGENDA
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryAgenda.java
    role: Ordered discovery questions and open-gap summary for workflow snapshots
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-FINDING
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryFinding.java
    role: Captured answer metadata for discovery logs (optional future persistence)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-CRITIQUE-FINDING
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanCritiqueFinding.java
    role: One rule-based critique finding (id, category, severity, code, message, ref) for Phase C
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-CRITIQUE-SNAPSHOT
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanCritiqueSnapshot.java
    role: Persisted critique run (generatedAt, source, findings list) on FeaturePlanState
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-READINESS-STATUS
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanReadinessStatus.java
    role: String constants BLOCKED, NEEDS_REVISION, NEEDS_HUMAN_DECISION, READY for machine readiness
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-APPROVAL-STATUS
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanApprovalStatus.java
    role: Canonical approval statuses and allowsLaunch helper for Phase C gate
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-WORK-PROFILE-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/profile/WorkProfileRegistry.java
    role: Resolve WorkProfileDefinition by id; used when initializing plan state and profile-scoped workflow actions
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-ARTIFACT-STATE-FACTORY
    kind: source
    path: src/main/java/com/vinekeepers/profile/ArtifactStateFactory.java
    role: Build empty ArtifactState map from a WorkProfileDefinition for new FeaturePlanState rows
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-BIND-PLACEHOLDER-RESOLVER
    kind: source
    path: src/main/java/com/vinekeepers/profile/BindPlaceholderResolver.java
    role: Resolve nested {{key}} placeholders in string maps using bind/state merged map for artifact upsert data
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-FEATURE-PLAN-STATE-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/FeaturePlanStateStore.java
    role: In-memory store for FeaturePlanState; indexed by contextId, featureId, roomChannelId, intakeThreadId
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-REPO-WORKSPACE-STATE
    kind: source
    path: src/main/java/com/vinekeepers/state/repo/RepoWorkspaceState.java
    role: Repo workspace resolution/materialization record (contextId, repo ref, workspace id, local path, branch, commit, status)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-REPO-WORKSPACE-STATE-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/repo/RepoWorkspaceStateStore.java
    role: In-memory store for RepoWorkspaceState; indexed by contextId, workspaceId, repoRef
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DEFAULT-REPO-REF-RESOLVER
    kind: source
    path: src/main/java/com/vinekeepers/state/repo/DefaultRepoRefResolver.java
    role: Normalizes https/git URLs, owner/repo shorthand, and absolute local directory paths to canonical repo refs
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-REPO-WORKSPACE-PROGRESS-PHASE
    kind: source
    path: src/main/java/com/vinekeepers/state/repo/RepoWorkspaceProgressPhase.java
    role: Enum milestones for RepoWorkspaceService.ensure progress hook
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-REPO-WORKSPACE-PROGRESS-CALLBACK
    kind: source
    path: src/main/java/com/vinekeepers/state/repo/RepoWorkspaceProgressCallback.java
    role: Functional interface for RepoWorkspaceService.ensure optional progress notifications
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-REPO-WORKSPACE-SERVICE
    kind: source
    path: src/main/java/com/vinekeepers/state/repo/RepoWorkspaceService.java
    role: >-
      Ensures local git workspace from repo input (existing checkout or optional shallow clone via
      VINEKEEPERS_ALLOW_GIT_CLONE); creates workspace root dirs; removes stale per-context clone dir before re-clone when
      removal succeeds; SLF4J milestones and optional RepoWorkspaceProgressCallback; git stderr/stdout tail on clone failure;
      retry once on directory delete before failing closed
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-LUNA-STATE
    kind: source
    path: src/main/java/com/vinekeepers/workflow/GatheringState.java
    role: Luna per-conversation state (project, code change, step)
    requires: [REQ-STATE-001, REQ-WORKFLOW-001, REQ-LUNA-001]
    feature_ids: [FEAT-STATE, FEAT-CURSOR-GATHERING]

requirements:
  - id: REQ-STATE-001
    title: State store for bot workflow state
    statement: StateStore persists and loads per-bot, per-conversation workflow state (structured state objects). FeatureRoomStateStore indexes feature room rows for routing and delivery; lookups by context, room channel, intake thread, feature id, and delivery target are null-safe and skip blank keys; coordinator resolution for room-channel routing uses participant primaryCoordinator when set, otherwise falls back to the ORCHESTRATOR participant.
    status: active
    priority: high
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - StateStore.load(botId, conversationKey) returns state or empty
        - StateStore.save persists state for bot and conversation
        - FeatureRoomStateStore.getParticipantBotIds returns participant configured bot ids in stable order by PlanningRole (Orchestrator, Architect, Auditor, Scribe) regardless of list order in state
        - FeatureRoomStateStore.getByContextId and getByRoomChannelId return empty for null or blank keys; put(null) does not store; put skips secondary indexes when optional keys are null or blank
        - FeatureRoomStateStore.resolveCoordinatorConfiguredBotId returns the participant marked primaryCoordinator when present, else the ORCHESTRATOR participant when present, else empty for null state or empty participants
        - FeaturePlanStateStore stores FeaturePlanState by contextId and secondary indexes (featureId, roomChannelId, intakeThreadId)
        - RepoWorkspaceService resolves absolute local git directories and records branch/commit; optional clone when env allows; creates VINEKEEPERS_REPO_WORKSPACE_ROOT when missing; deletes existing per-context workspace directory before shallow clone when present; fails closed if stale directory cannot be removed; logs milestones and supports optional progress callback; surfaces git output snippet on clone failure
        - FeaturePlanState carries optional profileId and artifacts map (per-artifact section/field values) alongside legacy planning fields; with* methods preserve profileId and artifacts
        - Planning domain includes DiscoveryGap, DiscoveryQuestion, DiscoveryAgenda, and DiscoveryFinding models for structured discovery (JSON-serializable; used by Luna guided discovery loop)
      examples: []
    traceability:
      assets: [ASSET-STATE-STORE, ASSET-LUNA-STATE, ASSET-PLANNING-ROLE, ASSET-ROOM-PARTICIPANT, ASSET-FEATURE-ROOM-STATE, ASSET-FEATURE-ROOM-STATE-STORE, ASSET-FEATURE-PLAN-STATE, ASSET-DISCOVERY-GAP, ASSET-DISCOVERY-QUESTION, ASSET-DISCOVERY-AGENDA, ASSET-DISCOVERY-FINDING, ASSET-PLAN-CRITIQUE-FINDING, ASSET-PLAN-CRITIQUE-SNAPSHOT, ASSET-PLAN-READINESS-STATUS, ASSET-PLAN-APPROVAL-STATUS, ASSET-FEATURE-PLAN-STATE-STORE, ASSET-REPO-WORKSPACE-STATE, ASSET-REPO-WORKSPACE-STATE-STORE, ASSET-DEFAULT-REPO-REF-RESOLVER, ASSET-REPO-WORKSPACE-PROGRESS-PHASE, ASSET-REPO-WORKSPACE-PROGRESS-CALLBACK, ASSET-REPO-WORKSPACE-SERVICE, ASSET-WORK-PROFILE-REGISTRY, ASSET-ARTIFACT-STATE-FACTORY, ASSET-BIND-PLACEHOLDER-RESOLVER, ASSET-STRUCTURED-DISCOVERY-SUPPORT]
      symbols: []
    validation:
      tests:
        - id: UNIT-STATE-STORE
          title: StateStoreTest
          intent: Verify state load/save and key scoping
          testClass: com.vinekeepers.state.StateStoreTest
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE
          title: FeatureRoomStateStoreTest
          intent: Verify FeatureRoomStateStore put, getByContextId, getByRoomChannelId, getByDeliveryTargetId
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-PARTICIPANT-ORDER
          title: FeatureRoomStateStoreTest
          intent: Verify getParticipantBotIds returns participant bot ids in stable role order (Orchestrator, Architect, Auditor, Scribe)
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: getParticipantBotIds_returnsStableOrderFromParticipantList
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-PARTICIPANT-ORDER-WRONG-LIST
          title: FeatureRoomStateStoreTest
          intent: Verify getParticipantBotIds sorts by role when participants list is not in role order
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: getParticipantBotIds_whenParticipantsInWrongOrder_returnsRoleOrderOrchestratorArchitectAuditorScribe
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-PARTICIPANT-EMPTY
          title: FeatureRoomStateStoreTest
          intent: Verify getParticipantBotIds returns empty for null state or empty participant list
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: getParticipantBotIds_emptyOrNullState_returnsEmptyList
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-CONTEXT-BLANK
          title: FeatureRoomStateStoreTest
          intent: Verify getByContextId returns empty for null or blank context id
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: getByContextId_returnsEmptyForNullOrBlank
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-ROOM-BLANK
          title: FeatureRoomStateStoreTest
          intent: Verify getByRoomChannelId returns empty for null or blank room channel id
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: getByRoomChannelId_returnsEmptyForNullOrBlank
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-PUT-NULL
          title: FeatureRoomStateStoreTest
          intent: Verify put(null) does not throw and does not index state
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: put_nullState_doesNothing
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-SKIP-BLANK-INDEX
          title: FeatureRoomStateStoreTest
          intent: Verify put skips blank optional index keys without failing lookups for present keys
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: put_skipsBlankOptionalIndexKeys
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-COORD-PRIMARY
          title: FeatureRoomStateStoreTest
          intent: Verify resolveCoordinatorConfiguredBotId returns participant marked primaryCoordinator
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: resolveCoordinatorConfiguredBotId_returnsPrimaryCoordinatorWhenSet
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-COORD-PRIMARY-VS-ORCH
          title: FeatureRoomStateStoreTest
          intent: Verify resolveCoordinatorConfiguredBotId prefers explicit primary over default orchestrator primary
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: resolveCoordinatorConfiguredBotId_prefersExplicitPrimaryOverOrchestratorOrder
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-COORD-FALLBACK-ORCH
          title: FeatureRoomStateStoreTest
          intent: Verify resolveCoordinatorConfiguredBotId falls back to ORCHESTRATOR when no primary flag
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: resolveCoordinatorConfiguredBotId_whenNoPrimary_fallsBackToOrchestrator
          preconditions: []
        - id: UNIT-FEATURE-ROOM-STATE-STORE-COORD-EMPTY
          title: FeatureRoomStateStoreTest
          intent: Verify resolveCoordinatorConfiguredBotId empty for null state or empty participants
          testClass: com.vinekeepers.state.planning.FeatureRoomStateStoreTest
          testMethod: resolveCoordinatorConfiguredBotId_emptyOrNull_returnsEmpty
          preconditions: []
        - id: UNIT-FEATURE-PLAN-STATE-STORE
          title: FeaturePlanStateStoreTest
          intent: Verify FeaturePlanStateStore put, getByContextId, reindex on update
          testClass: com.vinekeepers.state.planning.FeaturePlanStateStoreTest
          preconditions: []
        - id: UNIT-DEFAULT-REPO-REF-RESOLVER
          title: DefaultRepoRefResolverTest
          intent: Verify repo ref normalization for https, owner/repo, and local directories
          testClass: com.vinekeepers.state.repo.DefaultRepoRefResolverTest
          preconditions: []
        - id: UNIT-REPO-WORKSPACE-SERVICE
          title: RepoWorkspaceServiceTest
          intent: Verify local git repo resolution and UNAVAILABLE when clone disabled for remote URLs
          testClass: com.vinekeepers.state.repo.RepoWorkspaceServiceTest
          preconditions: []
        - id: UNIT-REPO-WORKSPACE-SERVICE-PROGRESS
          title: RepoWorkspaceServiceTest
          intent: Verify progress callback milestones for local repo ensure path
          testClass: com.vinekeepers.state.repo.RepoWorkspaceServiceTest
          testMethod: ensureLocalInvokesProgressPhases
          preconditions: []
        - id: UNIT-ARTIFACT-STATE-FACTORY
          title: ArtifactStateFactoryTest
          intent: Verify ArtifactStateFactory builds empty artifact trees from profile definitions
          testClass: com.vinekeepers.profile.ArtifactStateFactoryTest
          preconditions: []
        - id: UNIT-BIND-PLACEHOLDER-RESOLVER
          title: BindPlaceholderResolverTest
          intent: Verify nested placeholder resolution in string maps from bind/state
          testClass: com.vinekeepers.profile.BindPlaceholderResolverTest
          preconditions: []

features:
  - id: FEAT-STATE
    slug: state
    title: State store for workflow state
    domain_slug: state
    doc_path: features/domain/state/state.md
    summary: StateStore persists and loads per-bot, per-conversation workflow state.
    requirement_ids: [REQ-STATE-001]
    asset_ids: [ASSET-STATE-STORE, ASSET-LUNA-STATE, ASSET-PLANNING-ROLE, ASSET-ROOM-PARTICIPANT, ASSET-FEATURE-ROOM-STATE, ASSET-FEATURE-ROOM-STATE-STORE, ASSET-FEATURE-PLAN-STATE, ASSET-FEATURE-PLAN-STATE-STORE, ASSET-REPO-WORKSPACE-STATE, ASSET-REPO-WORKSPACE-STATE-STORE, ASSET-DEFAULT-REPO-REF-RESOLVER, ASSET-REPO-WORKSPACE-PROGRESS-PHASE, ASSET-REPO-WORKSPACE-PROGRESS-CALLBACK, ASSET-REPO-WORKSPACE-SERVICE, ASSET-WORK-PROFILE-REGISTRY, ASSET-ARTIFACT-STATE-FACTORY, ASSET-BIND-PLACEHOLDER-RESOLVER]
    status: active
