    role: Structured risk row on FeaturePlanState (id, narrative, status, severity, source, related keys, timestamps)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-DECISION
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanDecision.java
    role: Structured decision row on FeaturePlanState (id, narrative, status, source, related keys, timestamps)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-CONFIDENCE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanConfidence.java
    role: >-
