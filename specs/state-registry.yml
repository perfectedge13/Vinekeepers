    path: src/main/java/com/vinekeepers/state/repo/RepoWorkspaceStateStore.java
    role: In-memory store for RepoWorkspaceState; indexed by contextId, workspaceId, repoRef
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DEFAULT-REPO-REF-RESOLVER
    kind: source
    path: src/main/java/com/vinekeepers/state/repo/DefaultRepoRefResolver.java
