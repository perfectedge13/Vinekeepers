schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-24T03:48:06Z"

project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"

enums:
  status: [draft, active, deprecated]
  priority: [low, medium, high]
  type: [functional, non-functional, constraint]
  handling_strategy: [fail, retry, skip]
  asset_kind: [source, config, spec, workflow]
  dependency_kind: [library, tool, service]
  dependency_scope: [build, test, runtime]
  dependency_criticality: [optional, required]

dependencies:
  items:
    - id: DEP-JUNIT
      kind: library
      name: junit-jupiter
      scope: build
      criticality: required
      spec: org.junit.jupiter:junit-jupiter
      install_hint: Maven test dependency
      used_by_requirements: [REQ-CORE-001, REQ-ENV-001, REQ-CORE-002, REQ-CORE-003, REQ-CONFIG-001, REQ-BOT-001, REQ-BOT-002, REQ-EVENTS-001, REQ-STATE-001, REQ-TOOLS-001, REQ-REASONER-001, REQ-WORKFLOW-001, REQ-WORKFLOW-002, REQ-LUNA-001]

assets:
  - id: ASSET-STATE-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/StateStore.java
    role: Persist and load bot workflow state
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-ROLE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningRole.java
    role: Enum for feature room planning roles; production room provisioning is Arrietty-only but legacy role values remain for compatibility
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-ROOM-PARTICIPANT
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/RoomParticipant.java
    role: Model for a participant in a feature room (role, configuredBotId, runtimeBotInstanceId, displayName, primaryCoordinator)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-FEATURE-ROOM-STATE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/FeatureRoomState.java
    role: State model for a feature room (contextId, featureId, roomChannelId, intakeThreadId, participants, status)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-FEATURE-ROOM-STATE-STORE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/FeatureRoomStateStore.java
    role: Store and resolve feature room state by contextId, roomChannelId, intakeThreadId, featureId, or deliveryTargetId (thread then channel); null/blank keys no-op on lookup; put(null) no-op; getParticipantBotIds returns participant configuredBotIds in deterministic PlanningRole order; static resolveCoordinatorConfiguredBotId prefers primaryCoordinator flag then ORCHESTRATOR fallback
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-FEATURE-PLAN-STATE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/FeaturePlanState.java
    role: >-
      Canonical structured planning state for a feature room; requirements, PlanAssumption / PlanIssue lists, validation,
      solution/traceability/context, sectionStatuses, repo workspace linkage, profileId, artifacts map, PlanRisk /
      PlanDecision, unresolvedQuestions, critiqueLifecycleStatus, packet delivery fields (packetPostedAt, optional
      packetMessageRef,       packetPostedFingerprint, chunk count), PlanCritiqueSnapshot, PlanConfidence (readiness, level,
      notes, confidenceScore, confidenceReasons, structuredKnownFactCount, materialUnknownCount, materialUnknownLabels,
      computedAt), PlanApproval (status, actorId, at, optional rationale);
      durable PlanningIntakeStage with stageEnteredAt, intakeKickoffPostedVersion / intakeKickoffPostedFingerprint for
      idempotent coordinator kickoff, and planningOrchestrationFailureReason when intake reaches FAILED; repo workspace fields
      (repoWorkspaceStatus, repoLocalPath, repoRef, repoAccessNotes) feed spread_plan_workspace_signals and JSON evidence spreads in workflow state;
      autonomousPlanningPassCompleted plus clarificationTurnsCompleted / clarificationOutcomeHistory back post-draft clarification engine and discovery gap gating on the plan record;
      durable coordinatorConfiguredBotId for routing when FeatureRoomState is evicted; withPlannerRecoveryFields persists
      planningFailureCategory, planningFailurePhase, planningRecoverableDraftAvailable, planningLastRecoveryHint for typed
      synthesis/orchestration recovery metadata surfaced through hydrate_planning_session spreads; also persists
      planningCanonicalDecisionJson plus lastPosted/lastAsked canonical decision ids and a material-state-change fingerprint
      so post-draft and post-critique routing can be verified against one durable canonical decision model;
      planning room cycle may persist PlanningIntakeStage.CLARIFYING when the post-draft governor selects ASK_ONE_QUESTION and intake
      was not already clarifying
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-CANONICAL-DECISION
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningCanonicalDecision.java
    role: >-
      Typed durable canonical planning decision record (source, nextAction, stage, interactionState, posting/review/approval
      allowances, top-gap metadata, observability ids) that FeaturePlanState persists as the single routing authority
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-CANONICAL-NEXT-ACTION
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningCanonicalNextAction.java
    role: Canonical routable next actions for planning (ASK_ONE_QUESTION, AUTONOMOUS_REDRAFT, POST_PACKET, BLOCK)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-INTERACTION-STATE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningInteractionState.java
    role: Canonical operator interaction posture for planning (for example WAITING_FOR_TEXT_REPLY) persisted with the canonical decision
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-CLARIFICATION-RESOLUTION-DECISION
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/ClarificationResolutionDecision.java
    role: Clarification assessor outcomes (ASK_USER, ASSUME_AND_CONTINUE, LOW_PRIORITY_DEFER, BLOCK_AS_UNIMPLEMENTABLE) for canonical coordinator engine
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-INTAKE-STAGE
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningIntakeStage.java
    role: >-
      Enum of durable coordinator intake phases (GATHERING_CONTEXT through DONE/FAILED) persisted on FeaturePlanState for
      orchestration spine separate from YAML step index
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-FAILURE-CATEGORY
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningFailureCategory.java
    role: >-
      Machine-stable enum for planner/synthesis failures (NONE, SYNTHESIS_TRANSPORT_ERROR, SYNTHESIS_JSON_INVALID,
      SYNTHESIS_REPAIR_EXHAUSTED, SYNTHESIS_UPSERT_REJECTED, SYNTHESIS_EMPTY_NOOP, REPO_GROUNDING_UNAVAILABLE); parse and wireName for FeaturePlanState
      persistence and workflow spreads
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-INTAKE-BINDING-RESOLVER
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningIntakeBindingResolver.java
    role: >-
      Resolves feature-room intake thread ↔ plan binding and coordinator bot id: FeatureRoomStateStore by intake thread,
      FeaturePlanStateStore by intake thread id, then by room channel (or parent thread) when planning intake is active and
      intakeThreadId is set; Binding.exclusiveCoordinatorThread gates coordinator-only Discord routing; static
      isActivePlanningIntake when PlanningIntakeStage is not DONE
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-GAP
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryGap.java
    role: >-
      Typed planning gap (id, kind, artifact/section/field, reason, severity, optional userFacingDetail) for structured
      discovery JSON; userFacingDetail carries plain-language prompt text without exposing internal ids
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-QUESTION
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryQuestion.java
    role: Discovery prompt with optional REQUIRED_FIELD apply target for guided loop
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-AGENDA
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryAgenda.java
    role: Ordered discovery questions and open-gap summary for workflow snapshots
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-DISCOVERY-FINDING
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/DiscoveryFinding.java
    role: Captured answer metadata for discovery logs (optional future persistence)
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLANNING-PROPOSAL
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanningProposal.java
    role: >-
      JSON-serializable draft for an artifact field (proposalId, target ids, proposedValue, confidence, interaction AUTO_APPLY|CONFIRM,
      sources, reasoningSummary); carried in workflow state until confirm or auto-apply
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-CRITIQUE-FINDING
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanCritiqueFinding.java
    role: One rule-based critique finding (id, category, severity, code, message, ref) for Phase C
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-CRITIQUE-SNAPSHOT
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanCritiqueSnapshot.java
    role: >-
      Persisted critique run on FeaturePlanState: generatedAt, source, findings, lifecycle status, PlanCritiqueRubricScores,
      blockingFindingCount, requiredRevisions
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-READINESS-STATUS
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanReadinessStatus.java
    role: String constants for canonical machine readiness (BLOCKED, NOT_READY, REVIEWABLE, CONDITIONALLY_READY, READY) plus legacy compatibility aliases
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-APPROVAL-STATUS
    kind: source
    path: src/main/java/com/vinekeepers/state/planning/PlanApprovalStatus.java
    role: Canonical approval statuses (including NEEDS_DISCOVERY), allowsLaunch helper for Phase C gate
    requires: [REQ-STATE-001]
    feature_ids: [FEAT-STATE]
  - id: ASSET-PLAN-ASSUMPTION
