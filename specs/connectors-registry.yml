    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-GATEWAY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/JdaDiscordGateway.java
    role: JDA-backed Discord gateway for receiving messages and interactions, including author (authorId, author) in payload for routing, deferring interactions within 3s, sending replies and follow-ups with optional components; getSelfUserId and addPermissionOverride for lifecycle room; optional outbound-only mode for non-routed bots (no event listeners)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-GATEWAY-CONTRACT
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordGateway.java
    role: Gateway contract for Discord receive/send and interaction lifecycle (send with optional components, sendFollowUp, updateMessage, openModal, getSelfUserId, addPermissionOverride)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-REPLY-SINK
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordAppReplySink.java
    role: Implements AppReplySink; uses OutboundDeliveryRouter for sender resolution; lifecycle operations; channel send and follow-up/update with optional components; render intents to Discord; fallback to text; adapter owns timing and may auto-defer on interaction receive
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-OUTBOUND-DELIVERY-ROUTER
    kind: source
    path: src/main/java/com/vinekeepers/connectors/OutboundDeliveryRouter.java
    role: Routes outbound Discord delivery; implements DiscordReplySender; resolves sender from delivery target and lifecycle context (configuredBotId); getGatewayForChannel returns null when lifecycle bot has no gateway; getDiscordUserIdForBot(botId) returns that bot's Discord user id; default sender for non-lifecycle channels; for lifecycle channels uses configured bot's sender and does not silently fall back (fail clearly if unavailable)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-GITHUB-SOURCE
    kind: source
    path: src/main/java/com/vinekeepers/connectors/GitHubEventSource.java
    role: GitHub event source
    requires: [REQ-CONNECTORS-GITHUB-001]
    feature_ids: [FEAT-CONNECTORS-GITHUB]

requirements:
  - id: REQ-CONNECTORS-DISCORD-001
    title: Discord event source and reply
    statement: DiscordEventSource implements EventSource and translates Discord payloads, including mention metadata when available, into internal events; the JDA-backed Discord gateway receives live Discord messages and interaction events, acks or defers interactions within the platform window (adapter-owned timing), and sends replies including channel send with optional components. Per-bot Discord identity is supported via optional discordTokenEnvKey in bot config; Bootstrap registers one sender per bot when that key is set and token is present; bots not in routing may have an optional outbound-only gateway (no event listeners). OutboundDeliveryRouter resolves the reply sender from delivery target and optional lifecycle context (configuredBotId); getGatewayForChannel(channelId) returns null when the lifecycle channel's configured bot has no registered gateway (no default fallback); getDiscordUserIdForBot(botId) returns that bot's Discord user id from its gateway getSelfUserId or null. Discord gateway exposes createTextChannel(guildId, channelName), getSelfUserId(), and addPermissionOverride(channelId, guildId, targetUserId, allow, deny) for lifecycle room creation and permission overwrites. DiscordReplySender provides legacy text reply (channelId, messageId, content). DiscordAppReplySink implements the connector contract with lifecycle operations (respondImmediately, sendFollowUp, updateMessage, openModal); ChannelTarget path sends via OutboundDeliveryRouter; when getGatewayForChannel returns null the sink does not send and logs; adapter is responsible for ack/defer within Discord window and may auto-defer when sync reply is not safely possible; fallback to text when intent is not supported.
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - DiscordEventSource exists and implements EventSource and emits events onto the event bus
        - DiscordEventSource can pass Discord mention metadata and author (authorId, author) through the internal event payload for routing
        - "Per-bot Discord identity: bot config may specify discordTokenEnvKey; when set and token present, Bootstrap registers that bot's sender and gateway with OutboundDeliveryRouter"
        - "OutboundDeliveryRouter resolves sender from channel: lifecycle context (by channelId) yields configuredBotId then that bot's sender; absent context uses default sender"
        - "Lifecycle sender resolution: for a channel with lifecycle context, delivery uses the configured bot's sender only; when no sender is registered for that bot, do not send and log error (no silent fallback to another bot)"
        - getGatewayForChannel(channelId) returns null when lifecycle context exists for that channel but the configured bot has no registered gateway (do not return default gateway)
        - getDiscordUserIdForBot(botId) returns the bot's Discord user id from that bot's gateway getSelfUserId, or null if the bot has no gateway or getSelfUserId returns null
        - Discord gateway contract exposes getSelfUserId() and addPermissionOverride(channelId, guildId, targetUserId, allow, deny); JDA gateway implements both
        - "Optional outbound-only gateway: Bootstrap may register a gateway for a bot that is not in routing (e.g. lifecycle room bot); that gateway is outbound-only (no event listeners)"
        - Discord gateway handles Interaction Create; on receive, adapter acks or defers within platform window and publishes Event with kind interaction and token
        - DiscordAppReplySink implements AppReplySink; uses OutboundDeliveryRouter for sender resolution; all lifecycle operations; render intents; channel send and follow-up/update with optional components; fallback to text
        - Discord connector can send replies back to the originating channel or message (including with components) through the Discord API
        - DiscordReplySender interface supports sending replies (channelId, messageId, content) to Discord
        - Replies from the engine are delivered to Discord via sink or legacy reply path when source is Discord
        - Gateway createTextChannel(guildId, channelName) creates a text channel in the guild for lifecycle room; returns channel id or null on failure
      examples: []
    traceability:
      assets: [ASSET-DISCORD-SOURCE, ASSET-DISCORD-REPLY, ASSET-DISCORD-GATEWAY, ASSET-DISCORD-GATEWAY-CONTRACT, ASSET-DISCORD-REPLY-SINK, ASSET-OUTBOUND-DELIVERY-ROUTER]
      symbols: []
    validation:
      tests:
        - id: UNIT-ENGINE-DISCORD-REPLY
          title: VinekeepersEngineTest
          intent: Verify engine-delivered workflow replies are sent back through the Discord reply path
          testClass: com.vinekeepers.core.VinekeepersEngineTest
          testMethod: lunaWorkflowWithReplySenderSendsReplyToDiscord
          preconditions: []
        - id: UNIT-DISCORD-APP-REPLY-SINK
          title: DiscordAppReplySinkTest
          intent: Verify DiscordAppReplySink implements AppReplySink lifecycle, capabilities, ChannelTarget send with components, and intent rendering with fallback to text
          testClass: com.vinekeepers.connectors.DiscordAppReplySinkTest
          preconditions: []
        - id: UNIT-DISCORD-EVENT-SOURCE
          title: DiscordEventSourceTest
          intent: Verify Discord event source and reply sender behavior
          testClass: com.vinekeepers.connectors.DiscordEventSourceTest
          preconditions: []
        - id: UNIT-DISCORD-EVENT-SOURCE-MENTIONS
          title: DiscordEventSourceTest
          intent: Verify DiscordEventSource publishes mention metadata for downstream routing
          testClass: com.vinekeepers.connectors.DiscordEventSourceTest
          testMethod: startPublishesStubMessageWithMentionsMetadata
          preconditions: []
        - id: UNIT-CREATE-CHANNEL-ACTION-DISCORD
          title: CreateChannelActionTest
          intent: Verify create_channel action uses Discord gateway createTextChannel for lifecycle room
          testClass: com.vinekeepers.workflow.actions.CreateChannelActionTest
          preconditions: []
        - id: UNIT-CREATE-CHANNEL-ACTION-LIFECYCLE-OWNER
          title: CreateChannelActionTest
          intent: Verify create_channel with lifecycleOwnerBotId uses gateway getSelfUserId and addPermissionOverride for that bot
          testClass: com.vinekeepers.workflow.actions.CreateChannelActionTest
          testMethod: runWithRouterAndLifecycleOwnerBotId_addsPermissionOverwriteAfterCreate
          preconditions: []
        - id: UNIT-OUTBOUND-DELIVERY-ROUTER
          title: OutboundDeliveryRouterTest
          intent: Verify lifecycle context to configuredBotId sender resolution, default sender when no context, and no fallback when lifecycle channel has no sender for that bot
          testClass: com.vinekeepers.connectors.OutboundDeliveryRouterTest
          preconditions: []
        - id: MANUAL-CONNECTORS-DISCORD
          title: Discord connector compiles and implements interface
          intent: Verify DiscordEventSource and DiscordReplySender exist and compile
          preconditions: []
          steps:
            - run: "mvn compile -q"
              expect: ["BUILD SUCCESS"]

