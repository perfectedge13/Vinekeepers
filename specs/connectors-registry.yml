assets:
  - id: ASSET-DISCORD-SOURCE
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordEventSource.java
    role: Discord event source and reply sender that delegates runtime receive/send work to the Discord gateway
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-REPLY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordReplySender.java
    role: Interface for sending replies back to Discord (channelId, messageId, content)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-GATEWAY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/JdaDiscordGateway.java
    role: JDA-backed Discord gateway for receiving messages and interactions, including author (authorId, author) in payload for routing, deferring interactions within 3s, sending replies and follow-ups with optional components (send(channelId, messageId, content, components))
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-GATEWAY-CONTRACT
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordGateway.java
    role: Gateway contract for Discord receive/send and interaction lifecycle (send with optional components, sendFollowUp, updateMessage, openModal)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-REPLY-SINK
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordAppReplySink.java
    role: Implements AppReplySink; lifecycle operations; channel send and follow-up/update with optional components; render intents to Discord; fallback to text; adapter owns timing and may auto-defer on interaction receive
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-GITHUB-SOURCE
    kind: source
    path: src/main/java/com/vinekeepers/connectors/GitHubEventSource.java
    role: GitHub event source
    requires: [REQ-CONNECTORS-GITHUB-001]
    feature_ids: [FEAT-CONNECTORS-GITHUB]

requirements:
  - id: REQ-CONNECTORS-DISCORD-001
    title: Discord event source and reply
    statement: DiscordEventSource implements EventSource and translates Discord payloads, including mention metadata when available, into internal events; the JDA-backed Discord gateway receives live Discord messages and interaction events, acks or defers interactions within the platform window (adapter-owned timing), and sends replies including channel send with optional components. DiscordReplySender provides legacy text reply (channelId, messageId, content). DiscordAppReplySink implements the connector contract with lifecycle operations (respondImmediately, sendFollowUp, updateMessage, openModal); ChannelTarget path sends via gateway.send(channelId, messageId, content, components); adapter is responsible for ack/defer within Discord window and may auto-defer when sync reply is not safely possible; fallback to text when intent is not supported.
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - DiscordEventSource exists and implements EventSource and emits events onto the event bus
        - DiscordEventSource can pass Discord mention metadata and author (authorId, author) through the internal event payload for routing
        - Discord gateway handles Interaction Create; on receive, adapter acks or defers within platform window and publishes Event with kind interaction and token
        - DiscordAppReplySink implements AppReplySink; all lifecycle operations; render intents; channel send and follow-up/update with optional components; fallback to text
        - Discord connector can send replies back to the originating channel or message (including with components) through the Discord API
        - DiscordReplySender interface supports sending replies (channelId, messageId, content) to Discord
        - Replies from the engine are delivered to Discord via sink or legacy reply path when source is Discord
      examples: []
    traceability:
      assets: [ASSET-DISCORD-SOURCE, ASSET-DISCORD-REPLY, ASSET-DISCORD-GATEWAY, ASSET-DISCORD-GATEWAY-CONTRACT, ASSET-DISCORD-REPLY-SINK]
      symbols: []
    validation:
      tests:
        - id: UNIT-ENGINE-DISCORD-REPLY
          title: VinekeepersEngineTest
          intent: Verify engine-delivered workflow replies are sent back through the Discord reply path
          testClass: com.vinekeepers.core.VinekeepersEngineTest
          testMethod: lunaWorkflowWithReplySenderSendsReplyToDiscord
          preconditions: []
        - id: UNIT-DISCORD-APP-REPLY-SINK
          title: DiscordAppReplySinkTest
          intent: Verify DiscordAppReplySink implements AppReplySink lifecycle, capabilities, ChannelTarget send with components, and intent rendering with fallback to text
          testClass: com.vinekeepers.connectors.DiscordAppReplySinkTest
          preconditions: []
        - id: UNIT-DISCORD-EVENT-SOURCE
          title: DiscordEventSourceTest
          intent: Verify Discord event source and reply sender behavior
          testClass: com.vinekeepers.connectors.DiscordEventSourceTest
          preconditions: []
        - id: UNIT-DISCORD-EVENT-SOURCE-MENTIONS
          title: DiscordEventSourceTest
          intent: Verify DiscordEventSource publishes mention metadata for downstream routing
          testClass: com.vinekeepers.connectors.DiscordEventSourceTest
          testMethod: startPublishesStubMessageWithMentionsMetadata
          preconditions: []
        - id: MANUAL-CONNECTORS-DISCORD
          title: Discord connector compiles and implements interface
          intent: Verify DiscordEventSource and DiscordReplySender exist and compile
          preconditions: []
          steps:
            - run: "mvn compile -q"
              expect: ["BUILD SUCCESS"]

  - id: REQ-CONNECTORS-GITHUB-001
    title: GitHub event source
    statement: GitHubEventSource implements EventSource and translates GitHub payloads into internal events on the event bus.
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - GitHubEventSource exists and implements EventSource
        - Connector emits events onto the event bus when started
      examples: []
    traceability:
      assets: [ASSET-GITHUB-SOURCE]
      symbols: []
    validation:
      tests:
        - id: MANUAL-CONNECTORS-GITHUB
          title: GitHub connector compiles and implements interface
          intent: Verify GitHubEventSource exists and implements EventSource
          preconditions: []
          steps:
            - run: "mvn compile -q"
              expect: ["BUILD SUCCESS"]

