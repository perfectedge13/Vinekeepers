schema:
  id: req-registry
  version: "1.0.0"
  updated_utc: "2026-03-18T12:00:00Z"

project:
  id: vinekeepers
  name: Vinekeepers
  description: Vinekeepers project with spec-driven workflow
  stack:
    language: Java
    runtime: "21"

enums:
  status: [draft, active, deprecated]
  priority: [low, medium, high]
  type: [functional, non-functional, constraint]
  handling_strategy: [fail, retry, skip]
  asset_kind: [source, config, spec, workflow]
  dependency_kind: [library, tool, service]
  dependency_scope: [build, test, runtime]
  dependency_criticality: [optional, required]

dependencies:
  items:
    - id: DEP-JDA
      kind: library
      name: JDA
      scope: runtime
      criticality: required
      spec: net.dv8tion:JDA
      install_hint: Maven dependency
      used_by_requirements: [REQ-CONNECTORS-DISCORD-001]

assets:
  - id: ASSET-CONNECTOR-CONTEXT
    kind: source
    path: src/main/java/com/vinekeepers/connectors/ConnectorContext.java
    role: Generic context for adapters (EventBus, OutboundDeliveryRouter only); no Discord-named fields; Discord options via adapter config
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CONNECTOR-ADAPTER
    kind: source
    path: src/main/java/com/vinekeepers/connectors/ConnectorAdapter.java
    role: registerBots(List BotDefinition, ConnectorContext); adapter does per-bot gateway/sender/default registration only
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CONNECTOR-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/ConnectorRegistry.java
    role: register(connectorId, adapter), get(connectorId)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-CONNECTOR-CONFIG
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordConnectorConfig.java
    role: Discord-specific config (defaultTokenEnvKey from root defaultDiscordTokenEnvKey) passed to adapter constructor
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-CONNECTOR-ADAPTER
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordConnectorAdapter.java
    role: Implements ConnectorAdapter; constructor takes DiscordConnectorConfig and routedBotIds; registerBots does per-bot gateway/sender/default registration only; Bootstrap keeps sink/action wiring
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-REPLY-SENDER
    kind: source
    path: src/main/java/com/vinekeepers/connectors/ReplySender.java
    role: Generic contract for sending outbound replies (channelId, messageId, content); connector-specific senders implement this for use by engine and workflow actions
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-OUTBOUND-GATEWAY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/OutboundGateway.java
    role: Connector execution surface for outbound operations; Discord-shaped API (send, getSelfUserId, createTextChannel, createThreadChannel, addPermissionOverride); used only by connector code and OutboundDeliveryRouter; not a generic core abstraction
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-SOURCE
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordEventSource.java
    role: Discord event source and reply sender that delegates runtime receive/send work to the Discord gateway
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-REPLY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordReplySender.java
    role: DiscordReplySender extends ReplySender; Discord-specific reply sender used wherever core expects ReplySender
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-GATEWAY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/JdaDiscordGateway.java
    role: >-
      JDA-backed Discord gateway implementing DiscordGateway (extends OutboundGateway); receive/send, author in payload,
      defer, send with components; interaction events include threadId when the channel is a ThreadChannel (aligns
      thread session keys with message events); getSelfUserId and addPermissionOverride for lifecycle room; optional
      outbound-only mode for non-routed bots
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-GATEWAY-CONTRACT
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordGateway.java
    role: DiscordGateway extends OutboundGateway; interaction lifecycle (send with components, sendFollowUp, updateMessage, openModal, getSelfUserId, addPermissionOverride)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-REPLY-SINK
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordAppReplySink.java
    role: Implements AppReplySink; uses OutboundDeliveryRouter for sender resolution; lifecycle operations; channel send and follow-up/update with optional components; render intents to Discord; fallback to text; adapter owns timing and may auto-defer on interaction receive
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-OUTBOUND-DELIVERY-ROUTER
    kind: source
    path: src/main/java/com/vinekeepers/connectors/OutboundDeliveryRouter.java
    role: >-
      Routing (sender resolution by target and lifecycle context) plus gateway resolution; implements ReplySender and
      delegates to resolved sender; optional FeatureRoomStateStore for sendAsRole (fallback send) and sendAs;
      sendAsExplicit and sendAsRoleExplicit return errors when explicit workflow sender cannot resolve (no silent fallback);
      registerSender(botId, ReplySender, OutboundGateway);
      getGatewayForChannel returns gateway for channel; getSelfUserIdForBot(botId); used by DiscordSpaceOperations and
      DiscordAppReplySink; no silent fallback for lifecycle when bot has no sender
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CREATE-ROOM-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/connectors/CreateRoomResult.java
    role: "Typed result of createRoom: success with channel id or failure with CreateRoomFailureReason"
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CREATE-THREAD-RESULT
    kind: source
    path: src/main/java/com/vinekeepers/connectors/CreateThreadResult.java
    role: "Typed result of createThread: success with thread id or failure with CreateThreadFailureReason"
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CREATE-ROOM-FAILURE-REASON
    kind: source
    path: src/main/java/com/vinekeepers/connectors/CreateRoomFailureReason.java
    role: Enum of reasons for create-room (create channel) failure from SpaceOperations
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CREATE-THREAD-FAILURE-REASON
    kind: source
    path: src/main/java/com/vinekeepers/connectors/CreateThreadFailureReason.java
    role: Enum of reasons for create-thread failure from SpaceOperations
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-SPACE-OPERATIONS
    kind: source
    path: src/main/java/com/vinekeepers/connectors/SpaceOperations.java
    role: >-
      Interface for connector-specific space operations: createRoom(CreateRoomRequest) returns CreateRoomResult,
      createThread(CreateThreadRequest) returns CreateThreadResult; resolved by source prefix from SpaceOperationsRegistry;
      no default for missing prefix — callers fail closed
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-SPACE-OPERATIONS-REGISTRY
    kind: source
    path: src/main/java/com/vinekeepers/connectors/SpaceOperationsRegistry.java
    role: Thread-safe registry of SpaceOperations by connector id (source prefix); register(connectorId, ops), get(connectorId)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-SPACE-OPERATIONS
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordSpaceOperations.java
    role: >-
      Implements SpaceOperations for Discord; returns typed CreateRoomResult and CreateThreadResult; reads only request
      getters; createRoom/createThread delegate to gateway; when CreateRoomRequest has non-empty participantBotIds,
      addPermissionOverride for each bot (multi-bot feature room)
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CREATE-ROOM-REQUEST
    kind: source
    path: src/main/java/com/vinekeepers/connectors/CreateRoomRequest.java
    role: >-
      Request DTO with explicit intent fields (sourceId, guildId, channelName, lifecycleOwnerBotId, participantBotIds,
      project, codeChange); from(event, state, bind) with bind precedence; optional participantBotIds for multi-bot
      feature room permission overrides; consumed by SpaceOperations.createRoom
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-CREATE-THREAD-REQUEST
    kind: source
    path: src/main/java/com/vinekeepers/connectors/CreateThreadRequest.java
    role: Request DTO with explicit intent fields; factory (caller) owns bind/state resolution; consumed by SpaceOperations.createThread
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-REPLY-TARGET-RESOLVER
    kind: source
    path: src/main/java/com/vinekeepers/connectors/ReplyTargetResolver.java
    role: Connector contract to resolve Event to ReplyTarget; engine uses by connector id
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-DISCORD-REPLY-TARGET-RESOLVER
    kind: source
    path: src/main/java/com/vinekeepers/connectors/DiscordReplyTargetResolver.java
    role: Implements ReplyTargetResolver; reads event payload (channelId, messageId, interactionId, token, deferred) and returns InteractionTarget or ChannelTarget
    requires: [REQ-CONNECTORS-DISCORD-001]
    feature_ids: [FEAT-CONNECTORS-DISCORD]
  - id: ASSET-GITHUB-SOURCE
    kind: source
    path: src/main/java/com/vinekeepers/connectors/GitHubEventSource.java
    role: GitHub event source
    requires: [REQ-CONNECTORS-GITHUB-001]
    feature_ids: [FEAT-CONNECTORS-GITHUB]

requirements:
  - id: REQ-CONNECTORS-DISCORD-001
    title: Discord event source and reply
    statement: Discord event source and reply; generic outbound abstraction ReplySender (send) and OutboundGateway (send, getSelfUserId, createTextChannel, createThreadChannel, addPermissionOverride). DiscordReplySender extends ReplySender; DiscordGateway extends OutboundGateway. Per-bot identity via BotDefinition.getConnectorIdentity("discord") (tokenEnvKey, handlesOwnedSpaces). ConnectorContext is generic (EventBus, OutboundDeliveryRouter only). Adapter registerBots() does per-bot gateway/sender/default registration only. Bootstrap registers engine reply sender, sink, and Discord ReplyTargetResolver by connector id (engine.setReplySender("discord", outboundDeliveryRouter), engine.registerSink("discord", DiscordAppReplySink), engine.registerReplyTargetResolver("discord", DiscordReplyTargetResolver)); keeps action registration. OutboundDeliveryRouter implements ReplySender; registerSender(botId, ReplySender, OutboundGateway); resolves sender from delivery target and lifecycle configuredBotId; getGatewayForChannel returns OutboundGateway or null when lifecycle bot has no gateway; getSelfUserIdForBot(botId) returns that bot's gateway getSelfUserId. DiscordAppReplySink with lifecycle operations; ack/defer adapter-owned; fallback to text when intent not supported.
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - DiscordEventSource exists and implements EventSource and emits events onto the event bus
        - DiscordEventSource can pass Discord mention metadata and author (authorId, author) through the internal event payload for routing
        - Per-bot Discord identity via BotDefinition.getConnectorIdentity("discord") (tokenEnvKey, handlesOwnedSpaces); DiscordConnectorAdapter registers sender and gateway when token present
        - "OutboundDeliveryRouter resolves sender from delivery target (channel or thread id): LifecycleContextStore getByDeliveryTargetId(targetId) when present yields context then configuredBotId and that bot's sender; else resolve by channelId; absent context uses default sender"
        - "Lifecycle sender resolution: for a channel with lifecycle context, delivery uses the configured bot's sender only; when no sender is registered for that bot, do not send and log error (no silent fallback to another bot)"
        - getGatewayForChannel(channelIdOrDeliveryTargetId) returns null when lifecycle context exists for that channel or delivery target (e.g. thread) but the configured bot has no registered gateway (do not return default gateway)
        - getSelfUserIdForBot(botId) returns the bot's Discord user id from that bot's gateway getSelfUserId, or null if the bot has no gateway or getSelfUserId returns null
        - OutboundGateway exposes getSelfUserId(), createTextChannel, createThreadChannel, addPermissionOverride; DiscordGateway extends OutboundGateway; JDA gateway implements DiscordGateway
        - "Optional outbound-only gateway: Bootstrap may register a gateway for a bot that is not in routing (e.g. lifecycle room bot); that gateway is outbound-only (no event listeners)"
        - Discord gateway handles Interaction Create; on receive, adapter acks or defers within platform window and publishes Event with kind interaction and token
        - DiscordAppReplySink implements AppReplySink; uses OutboundDeliveryRouter for sender resolution; all lifecycle operations; render intents; channel send and follow-up/update with optional components; fallback to text
        - Discord connector can send replies back to the originating channel or message (including with components) through the Discord API
        - ReplySender generic contract (send(channelId, messageId, content)); DiscordReplySender extends ReplySender; Discord implementations used wherever core expects ReplySender
        - Replies from the engine are delivered to Discord via sink or legacy reply path when source is Discord
        - Gateway createTextChannel(guildId, channelName) creates a text channel in the guild for lifecycle room; returns channel id or null on failure
        - SpaceOperations.createRoom(CreateRoomRequest) returns CreateRoomResult, createThread(CreateThreadRequest) returns CreateThreadResult; no default connector when source prefix is null or blank — callers fail closed
        - DiscordSpaceOperations returns typed CreateRoomResult and CreateThreadResult (success with id or failure with CreateRoomFailureReason/CreateThreadFailureReason)
      examples: []
    traceability:
      assets: [ASSET-REPLY-SENDER, ASSET-OUTBOUND-GATEWAY, ASSET-CONNECTOR-CONTEXT, ASSET-CONNECTOR-ADAPTER, ASSET-CONNECTOR-REGISTRY, ASSET-DISCORD-CONNECTOR-CONFIG, ASSET-DISCORD-CONNECTOR-ADAPTER, ASSET-DISCORD-SOURCE, ASSET-DISCORD-REPLY, ASSET-DISCORD-GATEWAY, ASSET-DISCORD-GATEWAY-CONTRACT, ASSET-DISCORD-REPLY-SINK, ASSET-OUTBOUND-DELIVERY-ROUTER, ASSET-CREATE-ROOM-RESULT, ASSET-CREATE-THREAD-RESULT, ASSET-CREATE-ROOM-FAILURE-REASON, ASSET-CREATE-THREAD-FAILURE-REASON, ASSET-SPACE-OPERATIONS, ASSET-SPACE-OPERATIONS-REGISTRY, ASSET-DISCORD-SPACE-OPERATIONS, ASSET-CREATE-ROOM-REQUEST, ASSET-CREATE-THREAD-REQUEST, ASSET-REPLY-TARGET-RESOLVER, ASSET-DISCORD-REPLY-TARGET-RESOLVER]
      symbols: []
    validation:
      tests:
        - id: UNIT-ENGINE-DISCORD-REPLY
          title: VinekeepersEngineTest
          intent: Verify engine-delivered workflow replies are sent back through the Discord reply path
          testClass: com.vinekeepers.core.VinekeepersEngineTest
          testMethod: lunaWorkflowWithReplySenderSendsReplyToDiscord
          preconditions: []
        - id: UNIT-DISCORD-APP-REPLY-SINK
          title: DiscordAppReplySinkTest
          intent: Verify DiscordAppReplySink implements AppReplySink lifecycle, capabilities, ChannelTarget send with components, and intent rendering with fallback to text
          testClass: com.vinekeepers.connectors.DiscordAppReplySinkTest
          preconditions: []
        - id: UNIT-DISCORD-REPLY-TARGET-RESOLVER
          title: DiscordReplyTargetResolverTest
          intent: Verify DiscordReplyTargetResolver resolves Event to ChannelTarget or InteractionTarget from payload (channelId, messageId, interactionId, token, deferred); message vs interaction kind; sourceId passed through
          testClass: com.vinekeepers.connectors.DiscordReplyTargetResolverTest
          preconditions: []
        - id: UNIT-DISCORD-EVENT-SOURCE
          title: DiscordEventSourceTest
          intent: Verify Discord event source and reply sender behavior
          testClass: com.vinekeepers.connectors.DiscordEventSourceTest
          preconditions: []
        - id: UNIT-DISCORD-EVENT-SOURCE-MENTIONS
          title: DiscordEventSourceTest
          intent: Verify DiscordEventSource publishes mention metadata for downstream routing
          testClass: com.vinekeepers.connectors.DiscordEventSourceTest
          testMethod: startPublishesStubMessageWithMentionsMetadata
          preconditions: []
        - id: UNIT-CREATE-CHANNEL-ACTION-DISCORD
          title: CreateChannelActionTest
          intent: Verify create_channel action uses Discord gateway createTextChannel for lifecycle room
          testClass: com.vinekeepers.workflow.actions.CreateChannelActionTest
          preconditions: []
        - id: UNIT-CREATE-CHANNEL-ACTION-LIFECYCLE-OWNER
          title: CreateChannelActionTest
          intent: Verify create_channel with lifecycleOwnerBotId uses gateway getSelfUserId and addPermissionOverride for that bot
          testClass: com.vinekeepers.workflow.actions.CreateChannelActionTest
          testMethod: runWithRouterAndLifecycleOwnerBotId_addsPermissionOverwriteAfterCreate
          preconditions: []
        - id: UNIT-DISCORD-SPACE-OPERATIONS
          title: DiscordSpaceOperationsTest
          intent: Verify DiscordSpaceOperations createRoom (guildId, name building, permission override) and createThread (channelId, threadName, contextId, setDeliveryTargetId), normalizeChannelName
          testClass: com.vinekeepers.connectors.DiscordSpaceOperationsTest
          preconditions: []
        - id: UNIT-OUTBOUND-DELIVERY-ROUTER
          title: OutboundDeliveryRouterTest
          intent: Verify lifecycle context to configuredBotId sender resolution, default sender when no context, and no fallback when lifecycle channel has no sender for that bot
          testClass: com.vinekeepers.connectors.OutboundDeliveryRouterTest
          preconditions: []
        - id: UNIT-OUTBOUND-DELIVERY-ROUTER-SEND-AS-ROLE
          title: OutboundDeliveryRouterTest
          intent: Verify sendAsRole resolves role to bot and sends via that bot's sender
          testClass: com.vinekeepers.connectors.OutboundDeliveryRouterTest
          testMethod: sendAsRole_resolvesRoleToBotAndSendsViaThatBot
          preconditions: []
        - id: UNIT-OUTBOUND-DELIVERY-ROUTER-SEND-AS-ROLE-THREAD
          title: OutboundDeliveryRouterTest
          intent: Verify sendAsRole when target is thread resolves by deliveryTargetId
          testClass: com.vinekeepers.connectors.OutboundDeliveryRouterTest
          testMethod: sendAsRole_whenTargetIsThread_resolvesByDeliveryTargetId
          preconditions: []
        - id: UNIT-OUTBOUND-DELIVERY-ROUTER-SEND-AS-ROLE-FALLBACK
          title: OutboundDeliveryRouterTest
          intent: Verify sendAsRole when no feature room or null role falls back to standard send
          testClass: com.vinekeepers.connectors.OutboundDeliveryRouterTest
          testMethod: sendAsRole_whenNoFeatureRoomOrNullRole_fallsBackToStandardSend
          preconditions: []
        - id: UNIT-CONNECTOR-REGISTRY
          title: ConnectorRegistryTest
          intent: Verify ConnectorRegistry register(connectorId, adapter) and get(connectorId)
          testClass: com.vinekeepers.connectors.ConnectorRegistryTest
          preconditions: []
        - id: UNIT-DISCORD-CONNECTOR-ADAPTER
          title: DiscordConnectorAdapterTest
          intent: Verify DiscordConnectorAdapter registerBots and per-bot gateway/sender registration
          testClass: com.vinekeepers.connectors.DiscordConnectorAdapterTest
          preconditions: []
        - id: MANUAL-CONNECTORS-DISCORD
          title: Discord connector compiles and implements interface
          intent: Verify DiscordEventSource and DiscordReplySender exist and compile
          preconditions: []
          steps:
            - run: "mvn compile -q"
              expect: ["BUILD SUCCESS"]

  - id: REQ-CONNECTORS-GITHUB-001
    title: GitHub event source
    statement: GitHubEventSource implements EventSource and translates GitHub payloads into internal events on the event bus.
    status: active
    priority: medium
    type: functional
    behavior:
      inputs: []
      outputs: []
      rules: []
      defaults: []
      errors: []
    acceptance:
      criteria:
        - GitHubEventSource exists and implements EventSource
        - Connector emits events onto the event bus when started
      examples: []
    traceability:
      assets: [ASSET-GITHUB-SOURCE]
      symbols: []
    validation:
      tests:
        - id: MANUAL-CONNECTORS-GITHUB
          title: GitHub connector compiles and implements interface
          intent: Verify GitHubEventSource exists and implements EventSource
          preconditions: []
          steps:
            - run: "mvn compile -q"
              expect: ["BUILD SUCCESS"]

features:
  - id: FEAT-CONNECTORS-DISCORD
    slug: discord
    title: Discord event source and reply
    domain_slug: connectors
    doc_path: features/domain/connectors/discord.md
    summary: Discord event source and reply; a JDA-backed gateway receives live messages, preserves mention metadata for routing, and delivers workflow replies back to Discord.
    requirement_ids: [REQ-CONNECTORS-DISCORD-001]
    asset_ids: [ASSET-REPLY-SENDER, ASSET-OUTBOUND-GATEWAY, ASSET-CONNECTOR-CONTEXT, ASSET-CONNECTOR-ADAPTER, ASSET-CONNECTOR-REGISTRY, ASSET-DISCORD-CONNECTOR-CONFIG, ASSET-DISCORD-CONNECTOR-ADAPTER, ASSET-DISCORD-SOURCE, ASSET-DISCORD-REPLY, ASSET-DISCORD-GATEWAY, ASSET-DISCORD-GATEWAY-CONTRACT, ASSET-DISCORD-REPLY-SINK, ASSET-OUTBOUND-DELIVERY-ROUTER, ASSET-CREATE-ROOM-RESULT, ASSET-CREATE-THREAD-RESULT, ASSET-CREATE-ROOM-FAILURE-REASON, ASSET-CREATE-THREAD-FAILURE-REASON, ASSET-SPACE-OPERATIONS, ASSET-SPACE-OPERATIONS-REGISTRY, ASSET-DISCORD-SPACE-OPERATIONS, ASSET-CREATE-ROOM-REQUEST, ASSET-CREATE-THREAD-REQUEST, ASSET-REPLY-TARGET-RESOLVER, ASSET-DISCORD-REPLY-TARGET-RESOLVER]
    status: active
  - id: FEAT-CONNECTORS-GITHUB
    slug: github
    title: GitHub event source
    domain_slug: connectors
    doc_path: features/domain/connectors/github.md
    summary: GitHubEventSource implements EventSource and translates GitHub payloads into internal events on the event bus.
    requirement_ids: [REQ-CONNECTORS-GITHUB-001]
    asset_ids: [ASSET-GITHUB-SOURCE]
    status: active
