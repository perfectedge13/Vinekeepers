# Bot definitions and routing for Vinekeepers
# Luna: listens for @Luna mentions on Discord, gathers repository + feature request,
# then launches a Cursor Cloud agent run and reports progress back to chat.
# Arrietty: template for lifecycle room bot instances (provisioned at runtime per channel).
#
# Discord identity is connector-scoped under identities.discord. Each bot may set
# identities.discord.tokenEnvKey to the env var name for that bot's Discord token (never put
# raw tokens here). identities.discord.handlesOwnedSpaces is connector-scoped ownership for
# Discord lifecycle channels (single-owner precedence). Optional top-level defaultDiscordTokenEnvKey
# is a retained transitional setting when a bot has no identities.discord.tokenEnvKey.

defaultDiscordTokenEnvKey: LUNA_DISCORD_TOKEN

bots:
  - id: luna
    persona:
      name: Luna
      systemPrompt: You are Luna, a bot that helps users run code changes via Cursor Cloud API. You gather which project to update and what change to make, then create a branch, run nova-commit, push, and optionally open a PR.
    workflow:
      type: configured
      params:
        workflowRef: luna_cursor
    identities:
      discord:
        tokenEnvKey: LUNA_DISCORD_TOKEN
  - id: arrietty
    persona:
      name: Arrietty
      systemPrompt: You are Arrietty (Orchestrator), the primary coordinator in feature rooms. You help users in this channel with follow-up and context for Cursor runs.
    sessionKeyStrategy: thread  # Session key per thread for feature-room bots
    workflow:
      type: configured
      params:
        workflowRef: arrietty_room
    identities:
      discord:
        handlesOwnedSpaces: true
        tokenEnvKey: ARRIETTY_DISCORD_TOKEN
  - id: architect
    persona:
      name: Architect
      systemPrompt: You are Architect, a feature room participant. In the intake/spec thread, you contribute visible design and structure proposals when the workflow drives role turns; the main room stays coordinator-led so you do not auto-reply to generic room traffic.
    sessionKeyStrategy: thread
    workflow:
      type: configured
      params:
        workflowRef: architect_intro
    identities:
      discord:
        tokenEnvKey: ARCHITECT_DISCORD_TOKEN
  - id: auditor
    persona:
      name: Auditor
      systemPrompt: You are Auditor, a feature room participant. Minimal workflow; you reply only when invoked via action.
    sessionKeyStrategy: thread
    workflow:
      type: configured
      params:
        workflowRef: auditor_intro
    identities:
      discord:
        tokenEnvKey: AUDITOR_DISCORD_TOKEN
  - id: scribe
    persona:
      name: Scribe
      systemPrompt: You are Scribe, a feature room participant. In the intake/spec thread, you post consolidation and status when the workflow drives role turns; the room channel defaults to the orchestrator for summaries.
    sessionKeyStrategy: thread
    workflow:
      type: configured
      params:
        workflowRef: scribe_intro
    identities:
      discord:
        tokenEnvKey: SCRIBE_DISCORD_TOKEN

routing:
  - botId: luna
    filter:
      discordMention: "luna"
      # discordAuthors: numeric Discord user id (matches actorId) or username (matches actorUsername, case-insensitive)
      discordAuthors: ["novawilde13_72571"]

# Workflows DSL: id -> steps (ask_input, prompt_for_field, capture_field, call_action, branch, done)
# Optional: intent/choices/confirmLabel/cancelLabel/fields for rich interactions
workflows:
  # Silent intro workflows: no prompt; reply only when invoked via post_channel_message asRole.
  architect_intro:
    steps:
      - type: done
        message: ""
  auditor_intro:
    steps:
      - type: done
        message: ""
  scribe_intro:
    steps:
      - type: done
        message: ""
  arrietty_room:
    steps:
      - type: capture_field
        storeIn: roomAction
        trimAndLower: true
      - type: branch
        branches:
          - when: { key: roomAction, value: status }
            next: 2
          - when: { key: roomAction, value: retry }
            next: 3
          - when: { key: roomAction, value: close }
            next: 4
          - when: { key: roomAction, value: "" }
            next: 5
          - when: else
            next: 6
      - type: done
        message: "Room status: active. Repo and request are in context."
      - type: done
        message: "Retry requested. You can ask for another run."
      - type: done
        message: "Room closed. Use the channel for follow-up."
      - type: done
        message: "What would you like? (status, retry, close, or ask anything)"
      - type: done
        message: "{{roomAction}}"
  simple_echo:
    steps:
      - type: ask_input
        prompt: What should I echo?
        storeIn: userMessage
      - type: done
        message: "Echo: {{userMessage}}"
  luna_cursor:
    steps:
      - type: prompt_for_field
        prompt: "Choose a repository"
        storeIn: project
        choiceProvider: githubRepos
      - type: capture_field
        storeIn: project
      - type: branch
        branches:
          - when: { key: project, value: __custom__ }
            next: 3
          - when: else
            next: 5
      - type: prompt_for_field
        prompt: "Enter repo URL or owner/repo"
        storeIn: project
      - type: capture_field
        storeIn: project
      - type: prompt_for_field
        prompt: "What feature or spec-driven code change should I implement?"
        storeIn: codeChange
      - type: capture_field
        storeIn: codeChange
      - type: prompt_for_field
        prompt: "Repo: {{project}}, Branch: main. Change: {{codeChange}}. Confirm?"
        storeIn: confirmAction
        intent: present_choices
        choices:
          - { id: launch, label: Launch }
          - { id: edit_repo, label: Edit repo }
          - { id: edit_request, label: Edit request }
          - { id: cancel, label: Cancel }
      - type: capture_field
        storeIn: confirmAction
      - type: branch
        branches:
          - when: { key: confirmAction, value: launch }
            next: 10
          - when: { key: confirmAction, value: edit_repo }
            next: 0
            clear: [project, codeChange, confirmAction]
          - when: { key: confirmAction, value: edit_request }
            next: 5
            clear: [codeChange, confirmAction]
          - when: { key: confirmAction, value: cancel }
            next: 39
          - when: else
            next: 39
      - type: call_action
        action: create_channel
        bind:
          participantBotIds: [arrietty, architect, auditor, scribe]
          lifecycleOwnerBotId: arrietty
        storeIn: channelId
      - type: branch
        branches:
          - when: { key: channelId, value: CHANNEL_CREATE_FAILED }
            next: 38
          - when: else
            next: 12
      - type: call_action
        action: provision_bot_instance
        bind: { templateBotId: arrietty }
        storeIn: instanceId
      - type: call_action
        action: create_lifecycle_context
        bind: { configuredBotId: arrietty }
        storeIn: contextId
      - type: call_action
        action: create_thread
        bind: { threadName: "intake-spec" }
        storeIn: deliveryChannelId
      - type: call_action
        action: provision_room_participants
        storeIn: featureRoomParticipants
      - type: call_action
        action: initialize_feature_room_state
      - type: call_action
        action: initialize_feature_plan_state
      - type: call_action
        action: ensure_repo_workspace
      - type: call_action
        action: upsert_artifact_section_data
        bind:
          artifactId: requirements_spec
          sectionId: narrative
          mode: replace
          data:
            feature_summary: "{{codeChange}}"
      - type: call_action
        action: get_profile_missing_fields
        storeIn: profileMissingSummary
      - type: call_action
        action: get_structured_discovery_gaps
        storeSpread: true
      - type: branch
        branches:
          - when: { key: discoveryHasOpenGaps, value: "true" }
            next: 23
          - when: else
            next: 31
      - type: call_action
        action: build_discovery_agenda
        storeSpread: true
      - type: branch
        branches:
          - when: { key: discoveryCurrentQuestionPrompt, operator: nonblank }
            next: 25
          - when: else
            next: 31
      - type: prompt_for_field
        prompt: "{{discoveryCurrentQuestionPrompt}}"
        storeIn: discoveryAnswerRaw
      - type: capture_field
        storeIn: discoveryAnswerRaw
      - type: call_action
        action: capture_and_apply_discovery_answer
      - type: call_action
        action: classify_assumption_or_issue
      - type: call_action
        action: recompute_plan_progress
        storeSpread: true
      - type: branch
        branches:
          - when: { key: discoveryBlockingIssueMode, value: "true" }
            next: 31
          - when: { key: discoveryHasOpenGaps, value: "true" }
            next: 23
            clear: [discoveryAnswerRaw]
          - when: else
            next: 31
      - type: call_action
        action: post_channel_message
        bind:
          content: "Intake/spec thread — orchestrator kickoff. Repo: {{project}}. Request: {{codeChange}}. We'll gather structured input from each role next."
          asRole: orchestrator
          target: thread
      - type: call_action
        action: post_channel_message
        bind:
          content: "Architect: proposed structure — align implementation with repo conventions; capture boundaries and main components for this change."
          asRole: architect
          target: thread
      - type: call_action
        action: post_channel_message
        bind:
          content: "Auditor: validation focus — risks, test strategy, and spec/drift checks before implementation proceeds."
          asRole: auditor
          target: thread
      - type: call_action
        action: post_channel_message
        bind:
          content: "Scribe: intake/spec consolidation — profile gaps to address: {{profileMissingSummary}}"
          asRole: scribe
          target: thread
      - type: call_action
        action: post_channel_message
        bind:
          content: "Feature room ready. Thread above has role contributions. Launching next."
          asRole: orchestrator
          target: room
      - type: call_action
        action: launch_cursor_run
        bind: {}
        storeIn: launchMessage
      - type: done
        message: "Launching now. See <#{{channelId}}>."
      - type: done
        message: "Could not create room."
      - type: done
        message: "Cancelled."
