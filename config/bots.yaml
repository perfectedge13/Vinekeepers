  # Production Arrietty entry: v2 phase graph delegates to the full linear coordinator flow (arrietty_room_legacy).
  # Capability kinds: legacy_action, linear_workflow_ref (see GraphWorkflowRunner).
  arrietty_room_v2:
    workflowSchema: v2
    llm:
      provider: openai
      model: gpt-4o-mini
      timeoutMs: 120000
    templates:
      exposeInternal: false
      allowedKeys:
        - coordinatorSummary
        - nextQuestionPlain
        - progressLine
        - whatChangedSinceLastTurn
        - approvalPromptBody
        - resolutionExplanation
        - userCopyBlockerSummary
        - userCopyClarificationLedgerId
        - userCopyProgressDelta
        - userCopyProgressEventLatest
        - userCopyProgressLine
        - userCopyCoordinatorProgress
        - reviewReady
        - reviewReadyReason
        - approvalReady
        - approvalReadyReason
        - deliberationPhase
    deliberation:
      label: planning_packet_deliberation
      profileHint: software_feature_planning
    entryPhase: planning
    phases:
      planning:
        pipeline: [cap_linear_room]
        defaultNextPhase: done
      done:
        pipeline: []
        terminal: true
    capabilities:
      cap_linear_room:
        kind: linear_workflow_ref
        workflowRef: arrietty_room_legacy
    rulesets: {}
  simple_echo:
    steps:
    - type: ask_input
      prompt: What should I echo?
      storeIn: userMessage
    - type: done
      message: 'Echo: {{userMessage}}'
  luna_cursor:
    steps:
    - type: prompt_for_field
      prompt: Choose a repository
      storeIn: project
      choiceProvider: githubRepos
    - type: capture_field
      storeIn: project
    - type: branch
      branches:
      - when:
          key: project
          value: __custom__
        next: 3
      - when: else
        next: 5
    - type: prompt_for_field
      prompt: Enter repo URL or owner/repo
      storeIn: project
    - type: capture_field
      storeIn: project
    - type: prompt_for_field
      prompt: What feature or spec-driven code change should I implement?
      storeIn: codeChange
    - type: capture_field
      storeIn: codeChange
    - type: prompt_for_field
      prompt: 'Repo: {{project}}, Branch: main. Change: {{codeChange}}. Confirm?'
      storeIn: confirmAction
      intent: present_choices
      choices:
      - id: launch
        label: Launch
      - id: edit_repo
        label: Edit repo
      - id: edit_request
        label: Edit request
      - id: cancel
        label: Cancel
    - type: capture_field
      storeIn: confirmAction
    - type: branch
      branches:
      - when:
          key: confirmAction
          value: launch
        next: 10
      - when:
          key: confirmAction
          value: edit_repo
        next: 0
        clear:
        - project
        - codeChange
        - confirmAction
      - when:
          key: confirmAction
          value: edit_request
        next: 5
        clear:
        - codeChange
        - confirmAction
      - when:
          key: confirmAction
          value: cancel
        next: 23
      - when: else
        next: 23
    - type: call_action
      action: create_channel
      bind:
        participantBotIds:
        - arrietty
        - architect
        - auditor
        - scribe
        lifecycleOwnerBotId: arrietty
      storeIn: channelId
    - type: branch
      branches:
      - when:
          key: channelId
          value: CHANNEL_CREATE_FAILED
        next: 22
      - when: else
        next: 12
    - type: call_action
      action: provision_bot_instance
      bind:
        templateBotId: arrietty
      storeIn: instanceId
    - type: call_action
      action: create_lifecycle_context
      bind:
        configuredBotId: arrietty
      storeIn: contextId
    - type: call_action
      action: create_thread
      bind:
        threadName: intake-spec
      storeIn: deliveryChannelId
    - type: call_action
      action: provision_room_participants
      storeIn: featureRoomParticipants
    - type: call_action
      action: initialize_feature_room_state
    - type: call_action
      action: initialize_feature_plan_state
    - type: call_action
      action: ensure_repo_workspace
    - type: call_action
      action: upsert_artifact_section_data
      bind:
        artifactId: requirements_spec
        sectionId: narrative
        mode: replace
        data:
          feature_summary: '{{codeChange}}'
          current_state_summary: ''
          scope_summary: ''
          user_stories: ''
          acceptance_criteria: ''
    - type: call_action
      action: post_channel_message
      bind:
        content: Continue planning in this **intake/spec** thread. Discovery, review, and launch approval all happen here
          — the coordinator will post next; reply in-thread when prompted.
        asRole: orchestrator
        target: thread
    - type: call_action
      action: start_coordinator_planning
      bind:
        intakeThreadId: '{{deliveryChannelId}}'
    - type: done
      message: Feature room is ready. Continue in the intake/spec thread above to complete the plan, approval, and launch.
    - type: done
      message: Could not create room.
    - type: done
      message: Cancelled.
  devops_deploy:
    steps:
    - type: extract_event
      fromEvent:
      - from: context.channelId
        storeIn: channelId
    - type: prompt_for_field
      prompt: '**DevOps** — choose an action:'
      storeIn: mainMenu
      intent: present_choices
      choices:
      - id: ansible
        label: Ansible playbook deploy
      - id: compose_up
        label: Docker Compose — start (up)
      - id: compose_stop
        label: Docker Compose — stop
      - id: compose_ps
        label: Docker Compose — status (ps)
      - id: cancel
        label: Cancel
    - type: capture_field
      storeIn: mainMenu
    - type: branch
      branches:
      - when:
          key: mainMenu
          value: cancel
        next: 61
      - when:
          key: mainMenu
          value: ansible
        next: 4
      - when:
          key: mainMenu
          value: compose_up
        next: 20
      - when:
          key: mainMenu
          value: compose_stop
        next: 32
      - when:
          key: mainMenu
          value: compose_ps
        next: 44
      - when: else
        next: 61
    - type: call_action
      action: deploy_resolve_project
      storeSpread: true
    - type: branch
      branches:
      - when:
          key: deployNeedsProjectPick
          value: 'true'
        next: 6
      - when: else
        next: 8
    - type: prompt_for_field
      prompt: Which deploy target?
      storeIn: deployTargetId
      choiceProvider: deployTargets
    - type: capture_field
      storeIn: deployTargetId
    - type: prompt_for_field
      prompt: Which Git branch should we deploy?
      storeIn: branchChoice
      choiceProvider: deployGitBranches
    - type: capture_field
      storeIn: branchChoice
    - type: branch
      branches:
      - when:
          key: branchChoice
          value: other
        next: 11
      - when: else
        next: 13
    - type: prompt_for_field
      prompt: Enter the branch name to deploy.
      storeIn: branchCustom
    - type: capture_field
      storeIn: branchCustom
    - type: call_action
      action: resolve_deploy_branch
      storeSpread: true
    - type: call_action
      action: create_thread
      bind:
        threadName: deploy-progress
      storeIn: deliveryChannelId
    - type: call_action
      action: start_ansible_deploy
      storeSpread: true
    - type: done
      message: '{{deployAnsibleMessage}}'
    - type: call_action
      action: deploy_resolve_project
      storeSpread: true
    - type: branch
      branches:
      - when:
          key: deployNeedsProjectPick
          value: 'true'
        next: 22
      - when: else
        next: 24
    - type: prompt_for_field
      prompt: Which deploy target?
      storeIn: deployTargetId
      choiceProvider: deployTargets
    - type: capture_field
      storeIn: deployTargetId
    - type: prompt_for_field
      prompt: Which service(s)?
      storeIn: deployComposeService
      choiceProvider: deployComposeServices
    - type: capture_field
      storeIn: deployComposeService
    - type: call_action
      action: create_thread
      bind:
        threadName: deploy-progress
      storeIn: deliveryChannelId
    - type: call_action
      action: run_deploy_compose
      bind:
        composeOperation: up
      storeSpread: true
    - type: done
      message: '{{deployComposeMessage}}'
    - type: call_action
      action: deploy_resolve_project
      storeSpread: true
    - type: branch
      branches:
      - when:
          key: deployNeedsProjectPick
          value: 'true'
        next: 34
      - when: else
        next: 36
    - type: prompt_for_field
      prompt: Which deploy target?
      storeIn: deployTargetId
      choiceProvider: deployTargets
    - type: capture_field
      storeIn: deployTargetId
    - type: prompt_for_field
      prompt: Which service(s)?
      storeIn: deployComposeService
      choiceProvider: deployComposeServices
    - type: capture_field
      storeIn: deployComposeService
    - type: call_action
      action: create_thread
      bind:
        threadName: deploy-progress
      storeIn: deliveryChannelId
    - type: call_action
      action: run_deploy_compose
      bind:
        composeOperation: stop
      storeSpread: true
    - type: done
      message: '{{deployComposeMessage}}'
    - type: call_action
      action: deploy_resolve_project
      storeSpread: true
    - type: branch
      branches:
      - when:
          key: deployNeedsProjectPick
          value: 'true'
        next: 46
      - when: else
        next: 48
    - type: prompt_for_field
      prompt: Which deploy target?
      storeIn: deployTargetId
      choiceProvider: deployTargets
    - type: capture_field
      storeIn: deployTargetId
    - type: call_action
      action: create_thread
      bind:
        threadName: deploy-progress
      storeIn: deliveryChannelId
    - type: call_action
      action: run_deploy_compose
      bind:
        composeOperation: ps
      storeSpread: true
    - type: done
      message: '{{deployComposeMessage}}'
    - type: done
      message: Cancelled.
