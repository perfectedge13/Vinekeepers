      - when:
          key: confirmAction
          value: launch
        next: 10
      - when:
          key: confirmAction
          value: edit_repo
        next: 0
        clear:
        - project
        - codeChange
        - confirmAction
      - when:
          key: confirmAction
          value: edit_request
        next: 5
        clear:
        - codeChange
        - confirmAction
      - when:
          key: confirmAction
          value: cancel
        next: 23
      - when: else
        next: 23
