defaultDiscordTokenEnvKey: LUNA_DISCORD_TOKEN
bots:
- id: luna
  persona:
    name: Luna
    systemPrompt: You are Luna, a bot that helps users run code changes via Cursor Cloud API. You gather which project to
      update and what change to make, then create a branch, run nova-commit, push, and optionally open a PR.
  workflow:
    type: configured
    params:
      workflowRef: luna_cursor
  identities:
    discord:
      tokenEnvKey: LUNA_DISCORD_TOKEN
      ingress:
        messages: routed
        interactions: routed
- id: arrietty
  persona:
    name: Arrietty
    systemPrompt: You are Arrietty (Orchestrator), the primary coordinator in feature rooms. You help users in this channel
      with follow-up and context for Cursor runs.
  sessionKeyStrategy: thread
  conversationMode: conversational
  workflow:
    type: configured
    params:
      workflowRef: arrietty_room_v2
  identities:
    discord:
      handlesOwnedSpaces: true
      tokenEnvKey: ARRIETTY_DISCORD_TOKEN
      ingress:
        messages: owned_spaces
        interactions: own_messages
- id: architect
  persona:
    name: Architect
    systemPrompt: You are Architect, a feature room participant. In the intake/spec thread, you contribute visible design
      and structure proposals when the workflow drives role turns; the main room stays coordinator-led so you do not auto-reply
      to generic room traffic.
  sessionKeyStrategy: thread
  workflow:
    type: configured
    params:
      workflowRef: architect_intro
  identities:
    discord:
      tokenEnvKey: ARCHITECT_DISCORD_TOKEN
- id: auditor
  persona:
    name: Auditor
    systemPrompt: You are Auditor, a feature room participant. Minimal workflow; you reply only when invoked via action.
  sessionKeyStrategy: thread
  workflow:
    type: configured
    params:
      workflowRef: auditor_intro
  identities:
    discord:
      tokenEnvKey: AUDITOR_DISCORD_TOKEN
- id: scribe
  persona:
    name: Scribe
    systemPrompt: You are Scribe, a feature room participant. In the intake/spec thread, you post consolidation and status
      when the workflow drives role turns; the room channel defaults to the orchestrator for summaries.
  sessionKeyStrategy: thread
  workflow:
    type: configured
    params:
      workflowRef: scribe_intro
  identities:
    discord:
      tokenEnvKey: SCRIBE_DISCORD_TOKEN
- id: gadget
  persona:
    name: Gadget
    systemPrompt: You are Gadget, a DevOps assistant. When @Gadget in the ops channel, you offer deploy actions, gather project
      and branch, run Ansible on the host, and post progress to a Discord thread.
  workflow:
    type: configured
    params:
      workflowRef: devops_deploy
  identities:
    discord:
      tokenEnvKey: GADGET_DISCORD_TOKEN
      ingress:
        messages: routed
        interactions: routed
routing:
- botId: luna
  filter:
    discordMention: luna
    discordAuthors:
    - novawilde13_72571
    discordChannelsExclude:
    - '1484800775342391378'
- botId: gadget
  filter:
    discordMention: gadget
    discordChannels:
    - '1484800775342391378'
