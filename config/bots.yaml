defaultDiscordTokenEnvKey: LUNA_DISCORD_TOKEN
bots:
- id: luna
  persona:
    name: Luna
    systemPrompt: You are Luna, a bot that helps users run code changes via Cursor
      Cloud API. You gather which project to update and what change to make, then
      create a branch, run nova-commit, push, and optionally open a PR.
  workflow:
    type: configured
    params:
      workflowRef: luna_cursor
  identities:
    discord:
      tokenEnvKey: LUNA_DISCORD_TOKEN
      ingress:
        messages: routed
        interactions: routed
- id: arrietty
  persona:
    name: Arrietty
    systemPrompt: You are Arrietty (Orchestrator), the primary coordinator in feature
      rooms. You help users in this channel with follow-up and context for Cursor
      runs.
  sessionKeyStrategy: thread
  conversationMode: conversational
  workflow:
    type: configured
    params:
      workflowRef: arrietty_room_v2
      deferredInteractionAckPlanningCoordinator: true
  identities:
    discord:
      handlesOwnedSpaces: true
      tokenEnvKey: ARRIETTY_DISCORD_TOKEN
      ingress:
        messages: owned_spaces
        interactions: own_messages
- id: gadget
  persona:
    name: Gadget
    systemPrompt: You are Gadget, a DevOps assistant. When @Gadget in the ops channel,
      you offer deploy actions, gather project and branch, run Ansible on the host,
      and post progress to a Discord thread.
  workflow:
    type: configured
    params:
      workflowRef: devops_deploy
  identities:
    discord:
      tokenEnvKey: GADGET_DISCORD_TOKEN
      ingress:
        messages: routed
        interactions: routed
routing:
- botId: luna
  filter:
    discordMention: luna
    discordAuthors:
    - novawilde13_72571
    discordChannelsExclude:
    - '1484800775342391378'
- botId: gadget
  filter:
    discordMention: gadget
    discordChannels:
    - '1484800775342391378'
workflows:
  arrietty_room_v2:
    workflowSchema: v2
    llm:
      provider: openai
      model: gpt-5.4-mini-2026-03-17
      timeoutMs: 120000
    templates:
      exposeInternal: false
      allowedKeys:
      - coordinatorSummary
      - nextQuestionPlain
      - progressLine
      - whatChangedSinceLastTurn
      - approvalPromptBody
      - resolutionExplanation
      - userCopyBlockerSummary
      - userCopyClarificationLedgerId
      - userCopyProgressDelta
      - userCopyProgressEventLatest
      - userCopyProgressLine
      - userCopyCoordinatorProgress
      - reviewReady
      - reviewReadyReason
      - approvalReady
      - approvalReadyReason
      - deliberationPhase
      - canonicalPlanningIntakeStage
      - planningIngressMode
      - planningEventKind
      - planningActiveCapabilityId
      - planningAwaitingField
      - planningAutonomousFirstPassCompleted
      - planningRepoEvidenceJson
      - repoWorkspaceStatusSummary
      - project
      - proposalConfirmPrompt
      - discoveryCurrentQuestionPrompt
      - planningClarificationQuestionText
      - planningClarificationOrchestratorPrompt
      - planningClarificationStuckHint
      - planningOrchestratorRoundSummary
      - planningClarificationMergeError
      - planningRoomCycleErrorUserMessage
      - planningCycleUserVisibleFailure
      - planningPacketDepthReason
      - planningPacketSkipReason
      - planReadinessStatus
      - planReadinessStatusLabel
      - planningCritiqueNextAction
      - planningNextActionLabel
      - planningNextActionSummary
      - planReadinessSummary
      - planAssumptionsSummary
      - planIssuesSummary
      - planCritiqueSummary
      - planningThreadReviewBuildError
      - planningApprovalGateReason
      - planReadinessCheckpointGuide
      - launchMessage
    deliberation:
      label: planning_packet_deliberation
      profileHint: software_feature_planning
    entryPhase: planning_ingress
    phases:
      planning_ingress:
        pipeline:
        - cap_hydrate_planning_session
        - cap_ensure_repo_workspace
        - cap_spread_plan_workspace_signals
        - cap_classify_planning_ingress
        rulesRef: rs_ingress
        defaultNextPhase: planning_prepare
      planning_kickoff:
        pipeline:
        - cap_coordinator_intake_bootstrap
        defaultNextPhase: planning_prepare
      planning_prepare:
        pipeline:
        - cap_planning_prepare
        defaultNextPhase: planning_autonomous_draft
      planning_autonomous_draft:
        pipeline:
        - cap_set_stage_drafting
        - cap_planning_run_expansion
        - cap_planning_run_inner_round
        defaultNextPhase: planning_assess_clarification
      planning_assess_clarification:
        pipeline:
        - cap_planning_finalize_cycle_spread
        rulesRef: rs_post_draft
        defaultNextPhase: planning_blocked
      planning_redraft_notice:
        pipeline:
        - cap_post_draft_blocked
        defaultNextPhase: planning_autonomous_draft
      planning_clarification:
        pipeline:
        - cap_set_stage_clarifying
        - cap_planning_clarification
        defaultNextPhase: planning_autonomous_draft
      planning_packet:
        pipeline:
        - cap_derive_plan_governance
        - cap_evaluate_planning_packet_depth
        - cap_post_planning_packet_thread
        defaultNextPhase: planning_critique
      planning_critique:
        pipeline:
        - cap_set_stage_critiquing
        - cap_run_plan_critique_and_readiness
        rulesRef: rs_critique
        defaultNextPhase: planning_preapproval_review
      planning_human_review:
        pipeline:
        - cap_planning_human_review
        rulesRef: rs_human_review
        defaultNextPhase: planning_preapproval_review
      planning_preapproval_review:
        pipeline:
        - cap_set_stage_readiness_gate
        - cap_evaluate_planning_approval_gate
        - cap_post_prelaunch_review
        rulesRef: rs_preapproval_review
        defaultNextPhase: planning_approval_hold
      planning_approval_hold:
        pipeline:
        - cap_post_approval_hold
        defaultNextPhase: done
      planning_revision_reset:
        pipeline:
        - cap_planning_revision_reset
        defaultNextPhase: planning_autonomous_draft
      planning_approval:
        pipeline:
        - cap_set_stage_awaiting_approval
        - cap_planning_approval
        rulesRef: rs_approval
      planning_launch:
        pipeline:
        - cap_planning_launch
        defaultNextPhase: done
      planning_blocked:
        pipeline:
        - cap_set_stage_failed
        - cap_post_blocked_thread
        - cap_post_blocked_room
        defaultNextPhase: failed
      done:
        pipeline: []
        terminal: true
      failed:
        pipeline: []
        terminal: true
    capabilities:
      cap_hydrate_planning_session:
        kind: legacy_action
        action: hydrate_planning_session
        storeSpread: true
      cap_ensure_repo_workspace:
        kind: legacy_action
        action: ensure_repo_workspace
      cap_spread_plan_workspace_signals:
        kind: legacy_action
        action: spread_plan_workspace_signals
        storeSpread: true
      cap_classify_planning_ingress:
        kind: legacy_action
        action: classify_planning_ingress
        storeSpread: true
      cap_coordinator_intake_bootstrap:
        kind: legacy_action
        action: coordinator_intake_bootstrap
        storeSpread: true
      cap_set_stage_drafting:
        kind: legacy_action
        action: set_planning_intake_stage
        bind:
          stage: DRAFTING
        storeSpread: true
      cap_set_stage_clarifying:
        kind: legacy_action
        action: set_planning_intake_stage
        bind:
          stage: CLARIFYING
        storeSpread: true
      cap_set_stage_critiquing:
        kind: legacy_action
        action: set_planning_intake_stage
        bind:
          stage: CRITIQUING
        storeSpread: true
      cap_set_stage_readiness_gate:
        kind: legacy_action
        action: set_planning_intake_stage
        bind:
          stage: READINESS_GATE
        storeSpread: true
      cap_set_stage_awaiting_approval:
        kind: legacy_action
        action: set_planning_intake_stage
        bind:
          stage: AWAITING_APPROVAL
        storeSpread: true
      cap_set_stage_failed:
        kind: legacy_action
        action: set_planning_intake_stage
        bind:
          stage: FAILED
        storeSpread: true
      cap_planning_prepare:
        kind: configurable_steps
        steps:
        - type: call_action
          action: get_profile_missing_fields
          storeIn: profileMissingSummary
        - type: call_action
          action: generate_planning_proposals
          storeSpread: true
        - type: call_action
          action: apply_auto_planning_proposals
          storeSpread: true
        - type: call_action
          action: accept_pending_planning_confirmations
          storeSpread: true
        - type: call_action
          action: spread_planning_workspace_blocker
          storeSpread: true
        - type: branch
          branches:
          - when:
              key: planningWorkspaceUserInputRequired
              value: 'true'
            next: 6
          - when: else
            next: 13
        - type: prompt_for_field
          prompt: '{{planningWorkspaceBlockerPrompt}}'
          storeIn: discoveryAnswerRaw
        - type: capture_field
          storeIn: discoveryAnswerRaw
        - type: call_action
          action: classify_assumption_or_issue
        - type: call_action
          action: ensure_repo_workspace
        - type: call_action
          action: spread_planning_workspace_blocker
          storeSpread: true
        - type: call_action
          action: recompute_plan_progress
          storeSpread: true
        - type: branch
          branches:
          - when:
              key: planningWorkspaceUserInputRequired
              value: 'true'
            next: 6
            clear:
            - discoveryAnswerRaw
          - when: else
            next: 13
        - type: call_action
          action: recompute_plan_progress
          storeSpread: true
        - type: call_action
          action: mark_intake_discovery_complete
          storeSpread: true
        - type: done
          message: ''
      cap_planning_run_expansion:
        kind: legacy_action
        action: planning_run_expansion
        storeSpread: true
      cap_planning_run_inner_round:
        kind: legacy_action
        action: planning_run_inner_round
        storeSpread: true
      cap_planning_finalize_cycle_spread:
        kind: legacy_action
        action: planning_finalize_cycle_spread
        storeSpread: true
      cap_post_draft_blocked:
        kind: legacy_action
        action: post_channel_message
        bind:
          content: '{{planningPostDraftNoticeMarkdown}}'
          asRole: orchestrator
          target: thread
      cap_planning_clarification:
        kind: configurable_steps
        steps:
        - type: branch
          branches:
          - when:
              key: planningClarificationStuck
              value: 'true'
            next: 1
          - when: else
            next: 2
        - type: call_action
          action: post_channel_message
          bind:
            content: '{{planningClarificationStuckHint}}'
            asRole: orchestrator
            target: thread
        - type: prompt_for_field
          prompt: '{{planningOrchestratorRoundSummary}}'
          storeIn: planningClarificationRaw
        - type: capture_field
          storeIn: planningClarificationRaw
        - type: call_action
          action: merge_planning_clarification_choice
          storeSpread: true
        - type: branch
          branches:
          - when:
              key: planningClarificationMergeOk
              value: 'true'
            next: 6
          - when: else
            next: 8
        - type: call_action
          action: post_channel_message
          bind:
            content: Thanks — I've recorded that and I'm folding it into the draft. You'll see another short update when this pass finishes.
            asRole: orchestrator
            target: thread
        - type: done
          message: ''
        - type: call_action
          action: post_channel_message
          bind:
            content: I could not apply that clarification — {{planningClarificationMergeError}}. Please send a short plain-text reply in this thread.
            asRole: orchestrator
            target: thread
        - type: branch
          branches:
          - when: else
            next: 2
            clear:
            - planningClarificationRaw
      cap_derive_plan_governance:
        kind: legacy_action
        action: derive_plan_governance
        storeSpread: true
      cap_evaluate_planning_packet_depth:
        kind: legacy_action
        action: evaluate_planning_packet_depth
        storeSpread: true
      cap_post_planning_packet_thread:
        kind: legacy_action
        action: post_planning_packet_thread
        storeSpread: true
      cap_run_plan_critique_and_readiness:
        kind: legacy_action
        action: run_plan_critique_and_readiness
        storeSpread: true
      cap_planning_human_review:
        kind: configurable_steps
        steps:
        - type: call_action
          action: post_channel_message
          bind:
            content: '**Planning review requested**

              {{planReadinessCheckpointGuide}}

              **Status:** {{planReadinessStatusLabel}}

              **Next action:** {{planningNextActionLabel}}

              {{planReadinessSummary}}

              **Critique (high level)** — {{planCritiqueSummary}}

              '
            asRole: orchestrator
            target: thread
        - type: prompt_for_field
          prompt: '**Choose the next step** for this packet.

            **Continue to approval** checks whether the approval menu can open for this packet.

            **Revise plan first** runs another drafting round, then brings you back to this checkpoint.

            If the action menu does not render, reply with `continue` or `revise`.

            This step still does **not** launch code by itself.'
          storeIn: readinessProceedRaw
          intent: present_choices
          choices:
          - id: proceed
            label: Continue to approval
          - id: revise
            label: Revise plan first
        - type: capture_field
          storeIn: readinessProceedRaw
        - type: branch
          branches:
          - when:
              key: readinessProceedRaw
              value: proceed
            next: 4
          - when:
              key: readinessProceedRaw
              value: continue
            next: 4
          - when:
              key: readinessProceedRaw
              value: revise
            next: 6
          - when: else
            next: 0
        - type: call_action
          action: acknowledge_readiness_human_decision
          storeSpread: true
        - type: done
          message: ''
        - type: done
          message: ''
      cap_post_prelaunch_review:
        kind: legacy_action
        action: post_channel_message
        bind:
          content: '**Pre-launch review** — the **Planning packet** above is the full draft; this message is a **short checklist** only.

            **Status:** {{planReadinessStatusLabel}}

            **Next action:** {{planningNextActionLabel}}

            {{planReadinessSummary}}

            **Assumptions** — {{planAssumptionsSummary}}

            **Issues / risks** — {{planIssuesSummary}}

            **Critique** — {{planCritiqueSummary}}

            {{planningThreadReviewBuildError}}

            _If the approval gates pass in this step, you will get **Approve / Approve with risks / Revise / Reject** — nothing launches until you pick one._

            '
          asRole: orchestrator
          target: thread
      cap_evaluate_planning_approval_gate:
        kind: legacy_action
        action: evaluate_planning_approval_gate
        storeSpread: true
      cap_post_approval_hold:
        kind: legacy_action
        action: post_channel_message
        bind:
          content: '**Approval held** — {{planningApprovalGateReason}}

            {{planningNextActionSummary}}

            Reply with `revise` to run another planning round, or `continue` after you have more context to review.'
          asRole: orchestrator
          target: thread
      cap_planning_revision_reset:
        kind: configurable_steps
        steps:
        - type: branch
          branches:
          - when: else
            next: 1
            clear:
            - discoveryAnswerRaw
            - planApprovalDecision
            - planningProposalsJson
            - planningConfirmQueueJson
            - proposalConfirmPrompt
            - proposalConfirmProposalId
            - proposalConfirmArtifactId
            - proposalConfirmSectionId
            - proposalConfirmFieldId
            - proposalConfirmProposedValue
            - planningHasConfirmPending
            - readinessProceedRaw
            - planningHumanReadinessAcknowledged
            - discoveryBundledApplyJson
            - intakeChoice
            - planningClarificationRaw
            - planningPacketPostedVersion
            - planningRoomCycleIteration
        - type: done
          message: ''
      cap_planning_approval:
        kind: configurable_steps
        steps:
        - type: prompt_for_field
          prompt: Approve implementation launch?
          storeIn: planApprovalDecision
          intent: present_choices
          choices:
          - id: approve
            label: Approve
          - id: approve_with_risks
            label: Approve with risks
          - id: revise
            label: Revise plan
          - id: reject
            label: Reject
        - type: capture_field
          storeIn: planApprovalDecision
        - type: call_action
          action: persist_plan_approval
        - type: branch
          branches:
          - when:
              key: planApprovalDecision
              value: reject
            next: 5
          - when:
              key: planApprovalDecision
              value: revise
            next: 4
          - when: else
            next: 4
        - type: done
          message: ''
        - type: call_action
          action: post_channel_message
          bind:
            content: '**Plan rejected** — not launching from this packet. Start a fresh planning run from the main room when the request changes.'
            asRole: orchestrator
            target: thread
        - type: done
          message: Planning rejected; not launching.
      cap_planning_launch:
        kind: configurable_steps
        steps:
        - type: call_action
          action: post_channel_message
          bind:
            content: '**Approved** — launching from this plan. Repo: `{{project}}`. Request summary is in the planning packet above.'
            asRole: orchestrator
            target: thread
        - type: call_action
          action: post_channel_message
          bind:
            content: Lifecycle room is ready. Launching the Cursor run from the approved planning packet in this feature room.
            asRole: orchestrator
            target: room
        - type: call_action
          action: post_channel_message
          bind:
            content: '**Launching Cursor Cloud** — submitting the run now (HTTP timeout up to ~2 minutes). A success or failure message follows in this thread.'
            asRole: orchestrator
            target: thread
        - type: call_action
          action: launch_cursor_run
          bind: {}
          storeSpread: true
        - type: branch
          branches:
          - when:
              key: launchSucceeded
              value: 'false'
            next: 5
          - when: else
            next: 8
        - type: call_action
          action: post_channel_message
          bind:
            content: 'Planning is blocked right now — {{planningCycleUserVisibleFailure}}

              {{planReadinessSummary}}'
            asRole: orchestrator
            target: thread
        - type: call_action
          action: post_channel_message
          bind:
            content: Planning blocked — cannot launch until workspace/gaps are resolved. See intake/spec thread.
            asRole: orchestrator
            target: room
        - type: done
          message: Planning blocked; not launching.
        - type: call_action
          action: post_channel_message
          bind:
            content: '{{launchMessage}}'
            asRole: orchestrator
            target: thread
        - type: done
          message: '{{launchMessage}}'
      cap_post_blocked_thread:
        kind: legacy_action
        action: post_channel_message
        bind:
          content: 'Planning is blocked right now — {{planningCycleUserVisibleFailure}}

            {{planReadinessSummary}}'
          asRole: orchestrator
          target: thread
      cap_post_blocked_room:
        kind: legacy_action
        action: post_channel_message
        bind:
          content: Planning blocked — cannot launch until workspace/gaps are resolved. See intake/spec thread.
          asRole: orchestrator
          target: room
    rulesets:
      rs_ingress:
        - when:
            equals:
              key: planningIngressMode
              value: SYNTHETIC_KICKOFF
          then:
          - transition: planning_kickoff
        - when:
            equals:
              key: planningIngressMode
              value: APPROVAL_INTERACTION
          then:
          - transition: planning_preapproval_review
      rs_post_draft:
        - when:
            equals:
              key: planningPostDraftAction
              value: ASK_ONE_QUESTION
          then:
          - transition: planning_clarification
        - when:
            equals:
              key: planningPostDraftAction
              value: POST_PACKET
          then:
          - transition: planning_packet
        - when:
            equals:
              key: planningPostDraftAction
              value: ASSUME_AND_CONTINUE
          then:
          - transition: planning_packet
        - when:
            equals:
              key: planningPostDraftAction
              value: AUTONOMOUS_REDRAFT
          then:
          - transition: planning_redraft_notice
        - when:
            equals:
              key: planningPostDraftAction
              value: BLOCK
          then:
          - transition: planning_blocked
      rs_critique:
        - when:
            equals:
              key: planningCritiqueNextAction
              value: BLOCK
          then:
          - transition: planning_blocked
        - when:
            equals:
              key: planningCritiqueNextAction
              value: ASK_ONE_QUESTION
          then:
          - transition: planning_clarification
        - when:
            equals:
              key: planningCritiqueNextAction
              value: REVIEWABLE
          then:
          - transition: planning_human_review
        - when:
            equals:
              key: planningCritiqueNextAction
              value: REVISE_INTERNAL
          then:
          - transition: planning_revision_reset
      rs_human_review:
        - when:
            equals:
              key: readinessProceedRaw
              value: revise
          then:
          - transition: planning_revision_reset
      rs_preapproval_review:
        - when:
            truthy:
              key: planningReadyForApproval
          then:
          - transition: planning_approval
      rs_approval:
        - when:
            equals:
              key: planApprovalDecision
              value: approve
          then:
          - transition: planning_launch
        - when:
            equals:
              key: planApprovalDecision
              value: approve_with_risks
          then:
          - transition: planning_launch
        - when:
            equals:
              key: planApprovalDecision
              value: revise
          then:
          - transition: planning_revision_reset

  simple_echo:
    steps:
    - type: ask_input
      prompt: What should I echo?
      storeIn: userMessage
    - type: done
      message: 'Echo: {{userMessage}}'
  luna_cursor:
    steps:
    - type: prompt_for_field
      prompt: Choose a repository
      storeIn: project
      choiceProvider: githubRepos
    - type: capture_field
      storeIn: project
    - type: branch
      branches:
      - when:
          key: project
          value: __custom__
        next: 3
      - when: else
        next: 5
    - type: prompt_for_field
      prompt: Enter repo URL or owner/repo
      storeIn: project
    - type: capture_field
      storeIn: project
    - type: prompt_for_field
      prompt: What feature or spec-driven code change should I implement?
      storeIn: codeChange
    - type: capture_field
      storeIn: codeChange
    - type: prompt_for_field
      prompt: 'Repo: {{project}}, Branch: main. Change: {{codeChange}}. Confirm?'
      storeIn: confirmAction
      intent: present_choices
      choices:
      - id: launch
        label: Launch
      - id: edit_repo
        label: Edit repo
      - id: edit_request
        label: Edit request
      - id: cancel
        label: Cancel
    - type: capture_field
      storeIn: confirmAction
    - type: branch
      branches:
      - when:
          key: confirmAction
          value: launch
        next: 10
      - when:
          key: confirmAction
          value: edit_repo
        next: 0
        clear:
        - project
        - codeChange
        - confirmAction
      - when:
          key: confirmAction
          value: edit_request
        next: 5
        clear:
        - codeChange
        - confirmAction
      - when:
          key: confirmAction
          value: cancel
        next: 23
      - when: else
        next: 23
    - type: call_action
      action: create_channel
      bind:
        participantBotIds:
        - arrietty
        lifecycleOwnerBotId: arrietty
      storeIn: channelId
    - type: branch
      branches:
      - when:
          key: channelId
          value: CHANNEL_CREATE_FAILED
        next: 22
      - when: else
        next: 12
    - type: call_action
      action: provision_bot_instance
      bind:
        templateBotId: arrietty
      storeIn: instanceId
    - type: call_action
      action: create_lifecycle_context
      bind:
        configuredBotId: arrietty
      storeIn: contextId
    - type: call_action
      action: create_thread
      bind:
        threadName: intake-spec
      storeIn: deliveryChannelId
    - type: call_action
      action: provision_room_participants
      bind:
        orchestratorConfiguredBotId: arrietty
      storeIn: featureRoomParticipants
    - type: call_action
      action: initialize_feature_room_state
    - type: call_action
      action: initialize_feature_plan_state
    - type: call_action
      action: ensure_repo_workspace
    - type: call_action
      action: upsert_artifact_section_data
      bind:
        artifactId: requirements_spec
        sectionId: narrative
        mode: replace
        data:
          feature_summary: '{{codeChange}}'
          current_state_summary: ''
          scope_summary: ''
          user_stories: ''
          acceptance_criteria: ''
    - type: call_action
      action: post_channel_message
      bind:
        content: Continue in this **intake/spec** thread for planning, review, and
          launch approval. The coordinator will post next; reply here when prompted.
        asRole: orchestrator
        target: thread
    - type: call_action
      action: start_coordinator_planning
      bind:
        intakeThreadId: '{{deliveryChannelId}}'
    - type: done
      message: 'Feature room is ready. Continue in the **intake/spec** thread (<#{{deliveryChannelId}}>) to finish the plan, get approval, and launch.'
    - type: done
