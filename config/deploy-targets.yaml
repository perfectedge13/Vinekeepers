# Deploy targets: playbook path is relative to DEPLOY_ANSIBLE_ROOT / GADGET_ANSIBLE_ROOT.
# Root key: targets (legacy gadget-projects.yaml may use projects:).
# optional gitRemote: branch UX via deployGitBranches (git ls-remote --heads).
# extraVars: merged into ansible-playbook -e.
# optional compose: file, workingDirectory, services[], hostOpsExecutor: direct | cursor_agent
targets:
  - id: vinekeepers
    label: Vinekeepers
    playbook: playbooks/site.yml
    gitRemote: https://github.com/octocat/Hello-World.git
    extraVars: {}
    compose:
      file: compose.yaml
      workingDirectory: .
      services:
        - vinekeepers
      hostOpsExecutor: direct
