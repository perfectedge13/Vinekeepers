# Deploy targets: playbook path is relative to DEPLOY_ANSIBLE_ROOT / GADGET_ANSIBLE_ROOT.
# Host stack paths for direct compose live here and should match the real deploy host layout.
# On Neo, the sample neo4j / wikijs stacks live under /home/perfect_edge13/Docker/*.
# Root key: targets (legacy gadget-projects.yaml may use projects:).
# optional gitRemote: branch UX via deployGitBranches (git ls-remote --heads).
# extraVars: merged into ansible-playbook -e.
# optional compose: file, workingDirectory, services[], hostOpsExecutor: direct | cursor_agent
targets:
  - id: vinekeepers
    label: Vinekeepers
    playbook: playbooks/site.yml
    gitRemote: https://github.com/octocat/Hello-World.git
    extraVars: {}
    compose:
      file: compose.yaml
      workingDirectory: .
      services:
        - vinekeepers
      hostOpsExecutor: direct
  - id: neo4j
    label: Neo4j
    compose:
      file: docker-compose.yml
      workingDirectory: /home/perfect_edge13/Docker/neo4j
      services:
        - neo4j
      hostOpsExecutor: direct
  - id: wikijs
    label: Wiki.js
    compose:
      file: docker-compose.yml
      workingDirectory: /home/perfect_edge13/Docker/wikijs
      services:
        - wikijs-db
      hostOpsExecutor: direct
