# Containerized host-ops manifest for compose.host-ops.yaml.
# Use DEPLOY_TARGETS_PATH=/app/config/deploy-targets.docker.yaml so direct compose
# targets resolve against mounted in-container paths without shadowing /app.
targets:
  - id: vinekeepers
    label: Vinekeepers
    playbook: playbooks/site.yml
    gitRemote: https://github.com/octocat/Hello-World.git
    extraVars: {}
    compose:
      file: compose.yaml
      workingDirectory: /workspace/vinekeepers
      services:
        - vinekeepers
      hostOpsExecutor: direct
  - id: neo4j
    label: Neo4j
    compose:
      file: docker-compose.yml
      workingDirectory: /opt/stacks/neo4j
      services:
        - neo4j
      hostOpsExecutor: direct
  - id: wikijs
    label: Wiki.js
    compose:
      file: docker-compose.yml
      workingDirectory: /opt/stacks/wikijs
      services:
        - wikijs
      hostOpsExecutor: direct
