# Containerized deploy manifest when DEPLOY_TARGETS_PATH points here (see compose.yaml).
# The repo target uses an in-container path; host stack targets still use the same
# absolute host paths defined in config/deploy-targets.yaml and are bind-mounted there.
targets:
  - id: vinekeepers
    label: Vinekeepers
    playbook: playbooks/site.yml
    gitRemote: https://github.com/octocat/Hello-World.git
    extraVars: {}
    compose:
      file: compose.yaml
      workingDirectory: /workspace/vinekeepers
      services:
        - vinekeepers
      hostOpsExecutor: direct
  - id: neo4j
    label: Neo4j
    compose:
      file: docker-compose.yml
      workingDirectory: /home/perfect_edge13/Docker/neo4j
      services:
        - neo4j
      hostOpsExecutor: direct
  - id: wikijs
    label: Wiki.js
    compose:
      file: docker-compose.yml
      workingDirectory: /home/perfect_edge13/Docker/wikijs
      services:
        - wikijs
        - db
      hostOpsExecutor: direct
