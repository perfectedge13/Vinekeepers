# Work profiles: config-driven information shapes (artifact / section / field).
# Not Discord- or Git-specific; code loads this generically via WorkProfileLoader.
#
# Required-field / minWords style rules under readiness and coordinator sections are completeness targets for
# synthesis, readiness, and engine evaluation — not obligations to interrupt the user with generic field prompts.

profiles:
  software_feature_planning:
    profileId: software_feature_planning
    title: Software feature planning
    # Review-packet substance gate (GenericReadinessEvaluator) for default coordinator profile.
    readiness:
      anyOfGroups:
        - rules:
            - artifactId: requirements_spec
              sectionId: narrative
              fieldId: feature_summary
              minWords: 12
              readinessChecks:
                - placeholder
            - artifactId: overall_plan
              sectionId: outline
              fieldId: plan_body
              minWords: 18
              readinessChecks:
                - placeholder
            - artifactId: validation_plan
              sectionId: checks
              fieldId: validation_notes
              minWords: 12
              readinessChecks:
                - placeholder
    packetQuality:
      forbiddenSubstrings:
        - 'tbd'
        - 'todo:'
        - '[placeholder]'
        - 'lorem ipsum'
    artifacts:
      - artifactId: requirements_spec
        title: Requirements specification
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: narrative
            title: Feature narrative
            repeatable: false
            required: true
            fields:
              - fieldId: feature_summary
                label: Feature summary
                type: text
                required: true
                promptHint: One paragraph describing the change or feature goal.
              - fieldId: scope_summary
                label: Scope
                type: text
                required: false
                promptHint: In/out of scope, boundaries, and major components touched.
              - fieldId: acceptance_criteria
                label: Acceptance criteria
                type: text
                required: true
                promptHint: Bullet-style criteria; required before approval.
      - artifactId: decision_log
        title: Decision log
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: false
        sections:
          - sectionId: decisions
            title: Decisions
            repeatable: true
            required: false
            fields:
              - fieldId: decision_text
                label: Decision
                type: text
                required: true
                promptHint: >-
                  What you decided; the situation or constraints behind it; and what that means for the work ahead
                  (trade-offs, follow-ups, or options you ruled out). Plain sentences are fine — we store this on the plan.
      - artifactId: overall_plan
        title: Overall plan
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: outline
            title: Plan outline
            repeatable: false
            required: true
            fields:
              - fieldId: plan_body
                label: Plan
                type: markdown
                required: true
                promptHint: High-level steps and sequencing.
      - artifactId: validation_plan
        title: Validation plan
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: checks
            title: Validation checks
            repeatable: false
            required: true
            fields:
              - fieldId: validation_notes
                label: Validation approach
                type: text
                required: true
                promptHint: How correctness will be verified.
      - artifactId: project_context
        title: Project context
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: false
        sections:
          - sectionId: context
            title: Context
            repeatable: false
            required: false
            fields:
              - fieldId: context_summary
                label: Context summary
                type: text
                required: false
                promptHint: Links, constraints, or background.

  # Richer default for feature-room planning: more approval artifacts and required scope.
  software_feature_planning_v2:
    profileId: software_feature_planning_v2
    title: Software feature planning (v2)
    coordinatorClarification:
      mode: canonical_v1
      engine:
        maxClarificationTurns: 10
        maxClarificationTurnsPerGap: 2
        maxAutonomousRedraftsBeforeAsk: 2
        clarificationConfidenceThreshold: 0.72
        repoEvidenceAskThreshold: 0.42
        clarificationAskPriorityThreshold: 0.48
        allowAssumeAndContinue: true
        allowClarificationAfterCritique: true
      gaps:
        - id: config_vs_runtime_scope
          blocking: false
          questionTemplate: >-
            Should this work stay **configuration/schema only** (YAML and config files), touch **runtime/bootstrap**
            resolution in code, or **both**? Reply in plain text (e.g. "config only", "runtime too", or "both").
          hintDetectAllOf:
            - config
            - runtime
          # Broad substring matches on free-text user answers (assumptions, exploration, decisions).
          resolveAnySubstring:
            - config-driven
            - config only
            - configuration only
            - configuration/schema only
            - config/schema only
            - yaml only
            - runtime only
            - runtime too
            - both
            - config and runtime
            - runtime and config
            - default: assume both
            - decision (user
            - coordinator clarification (user)
            - static
            - static is fine
            - compile-time
            - build-time
            - no runtime
            - not runtime
            - schema only
        - id: config_runtime_specifics
          blocking: false
          questionTemplate: >-
            You indicated both configuration and runtime may change — **where** should defaults live (repo YAML only,
            environment overrides, or both)? Reply briefly in plain text.
          hintDetectAllOf: []
          canonicalOpenAllOf:
            - both
            - config
            - runtime
          resolveAnySubstring:
            - yaml only
            - yaml
            - bootstrap
            - env
            - override
            - .yaml
            - environment
            - environment overrides
            - yaml and environment
        - id: model_override_granularity
          blocking: true
          questionTemplate: >-
            For workflow-level model routing, should overrides be configured per **named workflow step**, per
            **step type/phase**, or **both**? Reply briefly in plain text (for example: "named steps", "step
            types", or "both").
          hintDetectAllOf:
            - override
            - step
          canonicalOpenAllOf:
            - model
            - step
          resolveAnySubstring:
            - named workflow steps
            - named workflow step
            - named steps
            - named step
            - step-id
            - step ids
            - workflow steps
            - workflow step
            - individual steps
            - specific steps
            - scope is per step
            - per-step
            - per step
            - step types
            - step type
            - per phase
            - phases
            - both
            - decision (user
            - coordinator clarification (user)
    # Declarative readiness: generic evaluator + supplemental workspace/validation checks in Java.
    readiness:
      anyOfGroups:
        - rules:
            - artifactId: requirements_spec
              sectionId: narrative
              fieldId: current_state_summary
              minWords: 14
              readinessChecks:
                - placeholder
            - artifactId: requirements_spec
              sectionId: narrative
              fieldId: feature_summary
              minWords: 14
              maxEchoOverlapWithRequest: 0.72
              echoWordSlack: 10
              readinessChecks:
                - placeholder
    artifacts:
      - artifactId: requirements_spec
        title: Requirements specification
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: narrative
            title: Feature narrative
            repeatable: false
            required: true
            fields:
              - fieldId: feature_summary
                label: Problem / goal
                type: text
                required: true
                promptHint: What problem this solves and who it is for (not only a one-line title).
              - fieldId: current_state_summary
                label: Current state / baseline
                type: text
                required: true
                promptHint: What exists today; what fails or is painful without this change (not the proposed fix).
              - fieldId: scope_summary
                label: Scope and non-goals
                type: text
                required: true
                promptHint: In scope, explicit out-of-scope, and boundaries.
              - fieldId: user_stories
                label: User stories / scenarios
                type: markdown
                required: false
                promptHint: >-
                  Short stories or scenarios, one per line or bullet; role, action, and outcome in plain language.
                  Discord packets may render these as labeled lists when there are multiple lines.
              - fieldId: acceptance_criteria
                label: Acceptance criteria
                type: text
                required: true
                promptHint: Testable criteria; bullets.
      - artifactId: architecture_notes
        title: Architecture and design
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: impact
            title: Impacted components
            repeatable: false
            required: true
            fields:
              - fieldId: components_impacted
                label: Components / modules touched
                type: text
                required: true
                promptHint: Packages, services, or major classes likely involved.
              - fieldId: architecture_summary
                label: Design notes
                type: markdown
                required: true
                promptHint: Approach, constraints, and notable design choices.
      - artifactId: risk_register
        title: Risks and issues
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: main
            title: Risks
            repeatable: false
            required: true
            fields:
              - fieldId: risk_summary
                label: Risks, edge cases, rollbacks
                type: text
                required: true
                promptHint: >-
                  What could go wrong, mitigations, rollout/fallback; one risk per line or bullet when possible
                  (packets can render a labeled list for easier scanning).
      - artifactId: decision_log
        title: Decision log
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: decisions
            title: Decisions
            repeatable: true
            required: false
            fields:
              - fieldId: decision_text
                label: Decision
                type: text
                required: true
                promptHint: >-
                  What you decided; what situation or constraints led to it; and what that choice means for
                  the work ahead (trade-offs, follow-ups, or things ruled out).
      - artifactId: overall_plan
        title: Overall plan
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: outline
            title: Plan outline
            repeatable: false
            required: true
            fields:
              - fieldId: plan_body
                label: Plan
                type: markdown
                required: true
                promptHint: Sequenced implementation steps tied to the repo.
      - artifactId: validation_plan
        title: Validation plan
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: checks
            title: Validation checks
            repeatable: false
            required: true
            fields:
              - fieldId: validation_notes
                label: Validation approach
                type: text
                required: true
                promptHint: >-
                  List concrete commands (e.g. mvn test, mvn compile, npm run validate-specs) and manual checks
                  for this feature.
      - artifactId: request_exploration
        title: Request exploration
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: true
        sections:
          - sectionId: analysis
            title: Explored dimensions
            repeatable: false
            required: true
            fields:
              - fieldId: exploration_body
                label: Exploration notes
                type: markdown
                required: true
                minWords: 24
                maxEchoOverlapWithRequest: 0.72
                echoWordSlack: 15
                readinessChecks:
                  - placeholder
                  - hollow_exploration
                promptHint: >-
                  Structured exploration of what the feature means (workflow touchpoints, config model, compat,
                  validation). Filled automatically before the packet; edit if wrong.
      - artifactId: project_context
        title: Project context
        ownerRoles: [ORCHESTRATOR]
        requiredForApproval: false
        sections:
          - sectionId: context
            title: Context
            repeatable: false
            required: false
            fields:
              - fieldId: context_summary
                label: Context summary
                type: text
                required: false
                promptHint: Links, constraints, or background.
