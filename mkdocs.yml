site_name: Vinekeepers

docs_dir: mkdoc

plugins:
  - search
  - mermaid2

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Features:
      - Overview: features/index.md
      - Domains:
          - Domain index: features/domain.md
          - Core:
              - Overview: features/domain/core.md
              - Specs governance and bootstrap: features/domain/core/core.md
              - Event-driven engine orchestration: features/domain/core/engine.md
          - Connectors:
              - Overview: features/domain/connectors.md
              - Discord event source and reply: features/domain/connectors/discord.md
              - GitHub event source: features/domain/connectors/github.md
          - Env:
              - Overview: features/domain/env.md
              - Environment and .env loading: features/domain/env/env.md
          - Config:
              - Overview: features/domain/config.md
              - Bot config from YAML: features/domain/config/config.md
          - Bot:
              - Overview: features/domain/bot.md
              - Event routing and normalized context: features/domain/bot/routing.md
              - Bot runtime definition and tool policy: features/domain/bot/bot.md
          - Events:
              - Overview: features/domain/events.md
              - Event bus and publish/subscribe: features/domain/events/events.md
          - State:
              - Overview: features/domain/state.md
              - State store for workflow state: features/domain/state/state.md
          - Tools:
              - Overview: features/domain/tools.md
              - Tool registry and execution: features/domain/tools/tools.md
          - Audit:
              - Overview: features/domain/audit.md
              - Audit log for tool calls and outcomes: features/domain/audit/audit.md
          - Reasoner:
              - Overview: features/domain/reasoner.md
              - Reasoner interface for bot decisions: features/domain/reasoner/reasoner.md
          - Workflow:
