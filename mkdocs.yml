site_name: Vinekeepers
docs_dir: mkdoc
plugins:
  - search
  - mermaid2
theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
nav:
  - Home: index.md
  - Features:
    - Overview: features/index.md
    - Domains:
      - Domains: features/domain.md
      - Core:
        - Overview: features/domain/core.md
        - Env: features/domain/core/env.md
        - Config: features/domain/core/config.md
        - Bot: features/domain/core/bot.md
        - Events: features/domain/core/events.md
        - State: features/domain/core/state.md
        - Tools: features/domain/core/tools.md
        - Audit: features/domain/core/audit.md
        - Reasoner: features/domain/core/reasoner.md
        - Workflow: features/domain/core/workflow.md
        - Core: features/domain/core/core.md
        - Luna: features/domain/core/luna.md
      - Connectors:
        - Overview: features/domain/connectors.md
        - Discord: features/domain/connectors/discord.md
        - GitHub: features/domain/connectors/github.md
  - Architecture: architecture.md
  - Runbooks:
    - Index: runbooks/index.md
    - Operational: runbooks/operational.md
    - Troubleshooting: runbooks/troubleshooting.md
    - Recovery: runbooks/recovery.md
    - Maintenance: runbooks/maintenance.md
  - Cursor:
    - Overview: cursor/index.md
    - Rules:
      - Overview: cursor/rules/index.md
      - vinekeepers-standards: cursor/rules/vinekeepers-standards.md
      - spec-workflow: cursor/rules/spec-workflow.md
      - spec-workflow-core: cursor/rules/spec-workflow-core.md
      - guardrails: cursor/rules/guardrails.md
      - spec-workflow-vinekeepers: cursor/rules/spec-workflow-vinekeepers.md
    - Skills:
      - Overview: cursor/skills/index.md
      - Nova-code:
        - Overview: cursor/skills/nova-code.md
        - implementation:
          - plan-change: cursor/skills/nova-code/implementation/plan-change.md
          - implement: cursor/skills/nova-code/implementation/implement.md
          - update-tests: cursor/skills/nova-code/implementation/update-tests.md
          - removal-rename: cursor/skills/nova-code/implementation/removal-rename.md
