---
# Example playbook invoked by Gadget with -e gadget_project=... -e gadget_branch=...
# Replace tasks with real git pull, build, and docker compose steps on your host.
# Mount this tree and the Docker socket into the Vinekeepers container when running in Docker.
- name: Gadget deploy placeholder
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Show deploy parameters
      ansible.builtin.debug:
        msg: "Deploy gadget_project={{ gadget_project | default('unknown') }} branch={{ gadget_branch | default('main') }}"
    - name: Reminder
      ansible.builtin.debug:
        msg: >-
          Extend this playbook to checkout gadget_branch, build, stop the running container,
          and start the new image on the host. From inside Docker, mount /var/run/docker.sock
          and host paths your tasks need.
