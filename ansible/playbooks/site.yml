---
# Generic example: parameters come from ansible-playbook -e (project_id, branch, gadget_project, gadget_branch,
# plus manifest extraVars). Implement checkout, build, and service restart in your own play or role — not in Java.
# Run from the Vinekeepers container with DEPLOY_ANSIBLE_ROOT / GADGET_ANSIBLE_ROOT pointing at this tree.
- name: Deploy parameters (example)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Echo deploy context
      ansible.builtin.debug:
        msg: >-
          project_id={{ project_id | default('') }} branch={{ branch | default('') }}
          (legacy gadget_project={{ gadget_project | default('') }} gadget_branch={{ gadget_branch | default('') }})
